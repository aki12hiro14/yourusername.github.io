<style>
:root{color-scheme:dark;--bg:#0d2638;--ink:#e8f5f5;--mute:#acc3cd;--accent:#63dfd0;--bd:#416777;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
main{width:min(100%,430px)}
.kicker{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:750}
.card{margin-top:15px;background:#15354a;border:1px solid var(--bd);border-radius:22px;padding:clamp(22px,6vw,35px);box-shadow:0 18px 65px #04172588}
.logo{display:inline-grid;place-items:center;width:49px;height:49px;background:#173e4e;border:1px solid #318577;border-radius:15px;margin-bottom:14px;color:var(--accent)}
h1{font-size:clamp(25px,6vw,34px);line-height:1.35;letter-spacing:-.02em;margin:0 0 10px}p{line-height:1.7;color:var(--mute);font-size:14px;margin:0 0 16px}
label{display:block;font-size:13px;font-weight:750;margin:20px 0 8px}
input{display:block;width:100%;min-height:58px;border:1px solid #6a94a4;background:#0d2537;border-radius:11px;color:white;padding:12px 15px;font-size:24px;letter-spacing:.35em;text-align:center;outline:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #63dfd032}
button{margin-top:13px;width:100%;border:0;border-radius:11px;background:#59cdbd;color:#092b32;min-height:52px;font-size:16px;font-weight:800;cursor:pointer}
button:hover{background:#77e4d6}button:disabled{opacity:.52;cursor:not-allowed}
#feedback{min-height:40px;margin-top:13px;font-size:13px;color:#ffc5ac;line-height:1.6}
#feedback.ok{color:var(--accent)}
.caution{border-top:1px solid #315469;padding-top:14px;margin:0;font-size:11px}
.bottom{color:#8da8b4;text-align:center;font-size:11px;margin:17px 12px 0;line-height:1.7}
@media(max-width:430px){.card{border-radius:18px;padding:23px 19px}h1{font-size:26px}}
</style>

<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id);
 const form=$('gateForm'),code=$('accessCode'),button=$('unlock'),feedback=$('feedback');
 const storeKey='shuntsound-outline-gate-v1', maxFails=3, waitMs=30000;
 let memory={fails:0,lockUntil:0}, busy=false;
 function getState(){try{const obj=JSON.parse(localStorage.getItem(storeKey)||'null');if(obj&&Number.isFinite(obj.fails)&&Number.isFinite(obj.lockUntil))return obj;}catch(_){}return memory;}
 function setState(v){memory=v;try{localStorage.setItem(storeKey,JSON.stringify(v));}catch(_){}}
 function message(s,ok=false){feedback.textContent=s;feedback.className=ok?'ok':'';}
 function refresh(){const s=getState(),remaining=Math.max(0,s.lockUntil-Date.now());
   if(remaining>0){button.disabled=true;code.disabled=true;button.textContent='待機中';message(`3回間違えました。あと ${Math.ceil(remaining/1000)} 秒後に再入力できます。`);return false;}
   if(s.lockUntil&&remaining<=0)setState({fails:0,lockUntil:0});
   code.disabled=busy;button.disabled=busy;button.textContent=busy?'確認中…':'アウトラインを開く';return true;
 }
 function toBytes(value){const s=atob(value),out=new Uint8Array(s.length);for(let i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out;}
 async function decrypt(pin){
   if(!crypto||!crypto.subtle)throw new Error('この環境では暗号化ページを開けません。HTTPSでアクセスしてください。');
   const d=JSON.parse($('encryptedPayload').textContent);
   const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:toBytes(d.salt),iterations:d.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:toBytes(d.iv)},key,toBytes(d.data));
   return new TextDecoder().decode(plain);
 }
 form.addEventListener('submit',async e=>{
   e.preventDefault();if(busy||!refresh())return;
   const pin=code.value.trim();if(!/^\d{4}$/.test(pin)){message('数字4桁で入力してください。');return;}
   busy=true;refresh();message('閲覧コードを確認しています…',true);
   try{
     const page=await decrypt(pin);
     setState({fails:0,lockUntil:0});
     document.open();document.write(page);document.close();
   }catch(err){
     if(err&&err.name==='OperationError'){
       const s=getState(),fails=(s.fails||0)+1;
       if(fails>=maxFails){setState({fails:0,lockUntil:Date.now()+waitMs});}
       else setState({fails,lockUntil:0});
       code.value='';busy=false;
       if(refresh())message(`コードが違います。あと ${maxFails-fails} 回間違えると30秒間ロックされます。`);
     }else{busy=false;refresh();message(err?.message||'開けませんでした。');}
   }
 });
 refresh();setInterval(refresh,300);
})();
</script>
