function update(){
  // ヒットストップ中はゲームロジックを止める（BGMだけ継続）
  if(hitStopT>0){ hitStopT--; updateBGM(); return; }
  tick++;
  updateBGM();
  if(tick%180===0) saveProgress();
  if(tick%60===0) checkAchievements();
  shakeX*=.6; shakeY*=.6;
  if(bossWarn>0) bossWarn--;

  const p=player;

  // Stage 2/3 checkpoint：各面の中間地点
  const cpThresh = currentStage===4 ? 112*T : currentStage===3 ? 96*T : currentStage===1 ? 85*T : 104*T;
  if(!checkpointActivated && p.x>cpThresh){
    checkpointActivated=true;
    checkpointX=(currentStage===4?114*T:currentStage===3?98*T:currentStage===1?87*T:106*T);
    checkpointBig=p.big;
    checkpointFire=p.fire;
    if(currentStage!==1){ p.cape=true; p.capeT=1200; }
    const cpMsg = currentStage===1?'CHECK POINT! ✅':'CHECK POINT!'+(currentStage===3?' 🌋':' モモンガ補充');
    spawnFloat(p.x+p.w/2,p.y-18,cpMsg,'#00ff88');
    addParts(p.x+p.w/2,p.y+p.h/2,'#00ff88',20);
    tone(523,.08,'square',.18); tone(659,.08,'square',.16,.08); tone(784,.16,'square',.14,.16);
  }

  // ボスエリア入口チェックポイント（2/3/4面）
  const bossThresh = currentStage===2?157*T : currentStage===3?126*T : currentStage===4?128*T : 999999;
  if(!bossCheckActivated && (currentStage===2||currentStage===3||currentStage===4) && p.x > bossThresh){
    bossCheckActivated=true;
    checkpointActivated=true;
    checkpointX=bossThresh+2*T;
    checkpointBig=true;
    checkpointFire=true;
    // HP全回復
    p.hp=3;
    // 能力フルセット付与
    p.big=true;
    if(currentStage===2){ p.cape=true; p.capeT=1200; }
    if(currentStage===3){ p.fire=true; p.cape=true; p.capeT=1200; }
    if(currentStage===4){ p.fire=true; p.iceReady=1; p.cape=true; p.capeT=1200; }
    spawnFloat(p.x+p.w/2,p.y-18,'💪 ボスチェックポイント!','#ff8800');
    addParts(p.x+p.w/2,p.y+p.h/2,'#ff8800',24); addParts(p.x+p.w/2,p.y+p.h/2,'#ffee00',16);
    sndItem(); shakeX=4; shakeY=4;
    // FINAL BATTLE! 演出
    finalBattleT=200;
    // ジャジャーン系SE
    tone(110,.08,'sawtooth',.38);
    tone(165,.10,'sawtooth',.32,.06);
    tone(220,.12,'square',.28,.14);
    tone(330,.20,'square',.22,.22);
    tone(440,.30,'square',.18,.36);
  }

  // Dead player arc
  if(p.dead){
    p.vy+=GRAVITY; p.y+=p.vy; p.deadT--;
    if(p.deadT<=0){
      if(p.hp<=0){ 
        // ハートが全部なくなったら必ず1面からやり直し
        currentStage=1;
        checkpointActivated=false;
        clearSavedProgress();
        dumpTelemetry(); submitScore(); 
        gameState='gameover'; 
        return; 
      }
      p.dead=false;
      if(checkpointActivated){
        p.x=checkpointX; p.y=(GR-2)*T;
        p.big=checkpointBig; p.fire=checkpointFire;
        if(currentStage===2){ p.cape=true; p.capeT=1200; }
        if(currentStage===3){ p.fire=true; p.big=true; p.cape=true; p.capeT=1200; }
        if(currentStage===4){ p.cape=true; p.capeT=1200; p.fire=true; p.iceReady=1; p.big=true; }
        if(bossCheckActivated){ p.hp=3; } // ボス前復活はHP全回復
        spawnFloat(p.x,p.y-10,bossCheckActivated?'💪 ボス前復活! HP全回復!':'復活!','#00ff88');
      } else {
        p.x=findSafeRespawnX(Math.max(16,camX+32));
        p.y=(GR-2)*T;
        p.big=false; p.fire=false;
      }
      p.vx=0; p.vy=0; p.mini=false; p.miniT=0;
      p.magnet=false; p.magnetT=0; p.hammerT=0;
      p.invT=120; p.groundPound=false; p.combo=0; p.comboT=0;
    }
    updateCamera(); return;
  }

  // Input
  const left =key('ArrowLeft') ||key('KeyA');
  const right=key('ArrowRight')||key('KeyD');
  const jump =key('ArrowUp')   ||key('Space')||key('KeyW');
  const down =key('ArrowDown') ||key('KeyS');

  // 地上は素早く加速・減速、空中は慣性を保持（本家マリオ式）
  const accel = p.onGround ? .65 : .38;
  const fric  = p.onGround ? .72 : .94;
  if(left)  { p.vx-=accel*(0.75+Math.abs(stickPowerX)*0.45); p.facing=-1; }
  if(right) { p.vx+=accel*(0.75+Math.abs(stickPowerX)*0.45); p.facing= 1; }
  if(!left&&!right) p.vx*=fric;
  const curSpd = p.hammerT>0 ? RUN_SPD*1.5 : RUN_SPD;
  p.vx=Math.max(-curSpd,Math.min(curSpd,p.vx));
  // 水中判定
  {
    const wTx=Math.floor((p.x+p.w/2)/T);
    const wTyMid=Math.floor((p.y+p.h*.65)/T);
    const wTyFoot=Math.floor((p.y+p.h-1)/T);
    p.inWater=(getTile(wTx,wTyMid)===WATER || getTile(wTx,wTyFoot)===WATER);
  }
  if(p.inWater){
    p.vy=Math.min(2.0, p.vy+GRAVITY*.08);  // 水中:よりゆっくり沈む
    p.vx*=.82;
    p.onGround=false;
    p.djumpUsed=false;
  } else {
    p.vy=Math.min(13, p.vy+GRAVITY);
  }

  // ── コヨーテタイム：直前まで地面にいたならジャンプ許可 ──
  if(p.onGround){ p.coyoteT=6; }
  else if(p.coyoteT>0){ p.coyoteT--; }

  // ── ジャンプバッファ：着地前にジャンプを押してもOK ──
  if(jump && !p.jumpHeld){ p.jumpBufT=8; }
  if(p.jumpBufT>0){ p.jumpBufT--; }

  if(p.inWater){
    if(jump && !p.jumpHeld){ p.vy=-4.4; p.jumpHeld=true; sndJump(); }  // 水中泳ぎ
    if(!jump) p.jumpHeld=false;
  } else {
    // 通常ジャンプ：コヨーテタイムもしくは着地中 + バッファ入力でも受け付ける
    const canJump = p.onGround || p.coyoteT>0;
    const wantsJump = (jump && !p.jumpHeld) || p.jumpBufT>0;
    if(canJump && wantsJump && !p.jumpHeld){
      p.vy=JUMP_V*(p.mini?1.4:1); p.jumpHeld=true; p.djumpUsed=false;
      p.coyoteT=0; p.jumpBufT=0;
      sndJump();
    }
  }
  // 2段ジャンプ：djumpアイテム OR マント装備
  if(jump && !p.onGround && !p.jumpHeld && (p.djump || p.cape) && !p.djumpUsed){
    if(p.cape){
      // マント2段ジャンプ：フル高度（JUMP_V * 1.05）
      p.vy = JUMP_V * 1.05;
      p.spinT = 24; // マントくるり演出
      addParts(p.x+p.w/2,p.y+p.h/2,'#c98b3c',18);
      addParts(p.x+p.w/2,p.y+p.h/2,'#fff2aa',12);
      spawnFloat(p.x+p.w/2,p.y,'🦅 マント2段！','#ffd080');
      vib(25);
    } else {
      // djumpアイテム：85%高度
      p.vy = JUMP_V * .85;
      addParts(p.x+p.w/2,p.y+p.h/2,'#88ff44',12);
      spawnFloat(p.x+p.w/2,p.y,'2段ジャンプ!','#88ff44');
    }
    p.djumpUsed = true; p.jumpHeld = true;
    sndJump();
  }
  // 壁キック判定
  if(!p.onGround && !p.groundPound){
    const wdir=left?-1:right?1:p.wallDir||0;
    if(wdir!==0){
      const wtx=Math.floor((wdir>0?p.x+p.w:p.x-2)/T);
      const wty=Math.floor((p.y+p.h/2)/T);
      const onWall=isSolid(getTile(wtx,Math.floor(p.y/T)))||isSolid(getTile(wtx,wty));
      if(onWall){ p.wallT=Math.min(p.wallT+1,10); p.wallDir=wdir; }
      else p.wallT=Math.max(0,p.wallT-1);
    } else p.wallT=Math.max(0,p.wallT-1);
    if(jump && !p.jumpHeld && p.wallT>=3){
      p.vy=JUMP_V*.88; p.vx=-p.wallDir*RUN_SPD*1.4; p.facing=-p.wallDir;
      p.jumpHeld=true; p.wallT=0; p.djumpUsed=false;
      sndJump(); addParts(p.x+p.w/2,p.y+p.h/2,'#aaccff',14);
      spawnFloat(p.x+p.w/2,p.y,'壁キック!','#aaccff');
    }
  } else if(p.onGround){ p.wallT=0; }
  if(!jump){ p.jumpHeld=false; if(p.vy<-3) p.vy+=.9; }
  if(p.onGround) p.djumpUsed=false;

  // マント飛行：空中でJUMP長押しするとゆっくり落ちる
  if(p.cape){
    if(p.capeT>0) p.capeT--;
    if(p.capeT<=0){ p.cape=false; p.glide=false; }
    p.glide = jump && !p.onGround && p.vy>0;
    if(p.glide){
      p.vy=Math.min(p.vy,1.15);
      p.vx+=p.facing*0.035;
      if(tick%6===0) addParts(p.x+p.w/2,p.y+p.h/2,'#e0b06a',2);
    }
  }
  if(p.spinCD>0) p.spinCD--;
  if(p.spinT>0){
    p.spinT--;
    const sx=p.x-12, sy=p.y-6, sw=p.w+24, sh=p.h+12;
    enemies.forEach(e=>{
      if(!e.alive||e.stomp>0) return;
      if(overlap(sx,sy,sw,sh,e.x,e.y,e.w,e.h)){
        e.stomp=18; e.vy=-4; e.vx=p.facing*3;
        p.score+=300; addParts(e.x+7,e.y+6,'#ffd080',16);
        spawnFloat(e.x+7,e.y,'SPIN!','#ffd080'); sndEnemyDie();
      }
    });
    if(boss && boss.alive && boss.active && overlap(sx,sy,sw,sh,boss.x,boss.y,boss.w,boss.h) && tick%8===0){
      boss.hp-=0.25; boss.hitT=12; shakeX=2; shakeY=2;
      addParts(p.x+p.w/2,p.y+p.h/2,'#ffd080',8);
      if(boss.hp<=0) killBoss(5000);
    }
  }

  // グラウンドパウンド：空中で↓を押すと急降下
  if(down && !p.onGround && !p.groundPound && p.vy<4){
    p.vy=9; p.vx*=.3; p.groundPound=true;
    addParts(p.x+p.w/2,p.y+p.h/2,'#ffcc00',8);
  }

  // アイスボール発射 or 持ち上げた敵を投げる（X キー）
  if(p.iceCD>0) p.iceCD--;
  if(p.throwCD>0) p.throwCD--;
  if(key('KeyX') && !p.dead){
    if(p.carrying && p.throwCD===0){
      // 持っている敵を投げる
      const te=p.carrying; p.carrying=null; p.throwCD=20;
      te.thrown=true; te.alive=true;
      te.vx=p.facing*8; te.vy=-4;
      te.frozen=0;
      thrownEnemies.push(te);
      sndThrow();
    } else if(p.iceReady>0 && p.iceCD===0){
      const ix=p.facing>0?p.x+p.w+2:p.x-10;
      iceballs.push({x:ix,y:p.y+p.h/2-4,vx:p.facing*5,vy:-.5,w:8,h:8,life:80});
      p.iceCD=25; p.iceReady--; sndFreeze();
    }
  }

  // ファイアー発射（Z キー：押すたびに1発、押しっぱなし連射なし）
  if(p.fireCD>0) p.fireCD--;
  if(!key('KeyZ')) p.fireHeld=false;
  if(key('KeyZ') && p.fire && p.fireCD===0 && !p.dead && !p.fireHeld){
    const fx = p.facing>0 ? p.x+p.w+2 : p.x-10;
    fireballs.push({x:fx, y:p.y+p.h/2-4, vx:p.facing*5.5, vy:-1.5, w:8,h:8, life:90, bounces:0});
    p.fireCD=15; p.fireHeld=true; sndFireShoot();
  }

  // マントくるくる攻撃：🔥ボタンで発動。空中でも地上でも使える
  if(key('KeyZ') && p.cape && p.spinCD===0 && !p.dead && !p.fireHeld){
    p.spinT=22; p.spinCD=36; p.fireHeld=true;
    sndSpin();
    addParts(p.x+p.w/2,p.y+p.h/2,'#ffd080',14);
  }

  movePlayer();

  // ── 詰まり検出：狭い溝にはまったら自動脱出 ──
  // ── アイドルタイマー ──
  const isActing = (left||right||jump||key('KeyZ')||key('KeyX')) || Math.abs(p.vx)>0.4 || Math.abs(p.vy)>0.8;
  _idleT = isActing ? 0 : _idleT+1;

  if(!p.dead && !p.invT){
    const reallyStuck = Math.abs(p.vx)<0.3 && Math.abs(p.vy)<0.3;
    if(reallyStuck){
      p.stuckT = (p.stuckT||0) + 1;
    } else {
      p.stuckT = 0;
    }
    if(p.stuckT >= 150){ // 2.5秒間動けない
      p.stuckT = 0;
      // 上に強制脱出を試みる
      const aboveBlocked = isSolid(getTile(Math.floor((p.x+p.w/2)/T), Math.floor((p.y-T)/T)));
      if(!aboveBlocked){
        // 上が開いてる → バネで脱出
        p.vy = -12; p.onGround = false;
        addParts(p.x+p.w/2, p.y, '#ffff44', 16);
        spawnFloat(p.x+p.w/2, p.y-10, '脱出！', '#ffff44');
      } else {
        // 完全に囲まれてる → ダメージ復活
        hurtPlayer();
        spawnFloat(p.x+p.w/2, p.y-10, '⚠ 脱出不可！', '#ff8800');
      }
    }
  } else { if(player) player.stuckT=0; }

  // グラウンドパウンド着地：ブロック・？ブロック・コイン全部対象
  if(p.groundPound && p.onGround){
    shakeX=5; shakeY=5; sndBreak();
    const ph=p.mini?8:(p.big?20:16); if(p.mini){p.w=8;p.h=8;} else if(!p.big){p.w=12;p.h=16;}
    const tyB=Math.floor((p.y+ph)/T);
    const tx0=Math.floor(p.x/T), tx1=Math.floor((p.x+p.w-1)/T);
    [tx0,tx1,tx0-1,tx1+1].forEach(tx=>{  // 左右1マスも対象
      const k=`${tx},${tyB}`;
      const id=getTile(tx,tyB);
      if(id===BRICK && !brokenQ[k]){
        brokenQ[k]=true; setTile(tx,tyB,AIR);
        addParts(tx*T+8,tyB*T+8,'#c84b0a',10); p.score+=50; sndBreak();
      } else if(id===QBLK && !brokenQ[k]){
        brokenQ[k]=true; setTile(tx,tyB,SOLID);
        spawnItem(tx,tyB-1,getQItem(tx)); sndQBlk();} else if(id===COIN && !coinsDone[k]){
        coinsDone[k]=true; p.coins++; p.score+=100; telemetry.coinsTotal++; _achSessionCoins++;
        spawnFloat(tx*T+8,(tyB-.5)*T,'100','#ffd700');
        addParts(tx*T+8,tyB*T,'#ffd700',4); sndCoin(); vibCoin();
      }
    });
    addParts(p.x+p.w/2,p.y+ph,'#888',14);
    p.groundPound=false;
  }
  if(p.onGround) p.groundPound=false;

  if(p.invT>0) p.invT--;
  if(p.growT>0) p.growT--;
  p.animT++;

  // ── ハンマー振り ──────────────────────────────────────
  if(p.hammerT>0){
    p.hammerT--;
    if(p.hammerT%6===0){
      const hx=p.facing>0?p.x+p.w-2:p.x-18;
      enemies.forEach(e=>{
        if(!e.alive||e.stomp>0) return;
        if(overlap(hx,p.y,20,p.h+4,e.x,e.y,e.w,e.h)){
          e.stomp=18; e.vy=-4; e.vx=p.facing*2;
          p.score+=500; addParts(e.x+7,e.y,'#ffcc00',12);
          spawnFloat(e.x+7,e.y,'500','#ffcc00'); sndHammer();
        }
      });
      if(boss.alive&&boss.active&&boss.hitT<=0&&overlap(hx,p.y,20,p.h+4,boss.x,boss.y,boss.w,boss.h)){
        boss.hp--; boss.hitT=40; shakeX=5; shakeY=5;
        spawnFloat(boss.x+boss.w/2,boss.y-8,'🔨HAMMER!','#ffcc00');
        addParts(boss.x+boss.w/2,boss.y,'#ff8800',16);
        sndHammer(); sndBossHit(); vibBossHit();
        if(boss.hp<=0) killBoss(5000);
      }
      for(let bi=barrels.length-1;bi>=0;bi--){
        const br=barrels[bi];
        if(!br.alive) continue;
        if(overlap(hx,p.y,20,p.h+4,br.x,br.y,br.w,br.h)){
          br.alive=false; addParts(br.x+7,br.y+7,'#c84b0a',12);
          p.score+=200; spawnFloat(br.x+7,br.y,'200','#ffcc00'); sndHammer();
        }
      }
    }
  }

  // 5000点ごとに1UP
  while(p.score >= p.nextLifeScore){
    p.hp = Math.min(5, p.hp+1);
    p.nextLifeScore += 5000;
    shakeX=3; shakeY=3;
    spawnFloat(p.x+p.w/2, p.y-8, '1UP!', '#00ff88');
    addParts(p.x+p.w/2, p.y+p.h/2, '#00ff88', 16);
    addParts(p.x+p.w/2, p.y+p.h/2, '#ffffff', 10);
    tone(660,.08,'square',.25); tone(784,.08,'square',.22,.08); tone(1047,.15,'square',.28,.16);
  }
  if(Math.abs(p.vx)>.3 && p.onGround && p.animT%7===0) p.runF=(p.runF+1)%3;
  else if(!(Math.abs(p.vx)>.3)) p.runF=0;

  // Items (mushrooms, stars, flowers, ice)
  items.forEach(it=>{
    if(it.collected) return;
    // キノコ: 時間制限あり、端でも落ちる（本家マリオ式）
    if(it.type==='mushroom'||it.type==='ice'){
      it.life=(it.life||480)-1;
      if(it.life<=0){ it.collected=true; return; }
    }
    it.vy=Math.min(10,it.vy+GRAVITY*.5); it.x+=it.vx; it.y+=it.vy; it.animT++;
    const tx0=Math.floor(it.x/T),tx1=Math.floor((it.x+it.w-1)/T);
    const ty=Math.floor((it.y+it.h)/T);
    if(isSolid(getTile(tx0,ty))||isSolid(getTile(tx1,ty))){ it.y=ty*T-it.h; it.vy=0; }
    if(isSolid(getTile(Math.floor((it.x-1)/T),ty-1))){ it.vx=Math.abs(it.vx); }
    if(isSolid(getTile(tx1+1,ty-1))){ it.vx=-Math.abs(it.vx); }
    // キノコ・アイスは端から落ちる。スター・フラワーは折り返す
    if(it.type!=='mushroom'&&it.type!=='ice'){
      if(!isSolid(getTile(tx0,ty+1))&&!isSolid(getTile(tx1,ty+1))) it.vx*=-1;
    }
    // 溝に落ちたら消える
    if(it.y > (GR+2)*T){ it.collected=true; return; }
    if(overlap(p.x,p.y,p.w,p.h,it.x,it.y,it.w,it.h)){
      it.collected=true;
      if(it.type==='mushroom'){
        p.big=true; p.score+=1000; p.growT=75;
        shakeX=8; shakeY=8;
        addParts(it.x+7,it.y+7,'#ff8844',28);
        addParts(it.x+7,it.y+7,'#ffdd44',20);
        addParts(it.x+7,it.y+7,'#ffffff',12);
        spawnFloat(it.x+7,it.y-8,'⬆ LEVEL UP! 🍄','#ffdd44');
        sndItem();
        tone(523,.06,'square',.2); tone(659,.06,'square',.2,.06);
        tone(784,.06,'square',.2,.12); tone(1047,.15,'square',.18,.18);
        vib([20,20,20,20,40]);
      }
      if(it.type==='flower'){
        p.big=true; p.fire=true; p.score+=1000; p.growT=75;
        shakeX=10; shakeY=10;
        // 炎の輪エフェクト
        for(let ang=0;ang<12;ang++){
          const rad=ang/12*Math.PI*2;
          parts.push({x:it.x+7+Math.cos(rad)*18,y:it.y+7+Math.sin(rad)*18,
            vx:Math.cos(rad)*2.2,vy:Math.sin(rad)*2.2,
            life:45,col:['#ff2200','#ff6600','#ffee00'][ang%3],sz:4});
        }
        addParts(it.x+7,it.y+7,'#ff2200',24);
        addParts(it.x+7,it.y+7,'#ff8800',18);
        addParts(it.x+7,it.y+7,'#ffee00',14);
        spawnFloat(it.x+7,it.y-8,'🔥 FIRE POWER! 🔥','#ff6600');
        sndItem();
        tone(659,.06,'square',.22); tone(784,.06,'square',.22,.06);
        tone(1047,.06,'square',.20,.12); tone(1319,.18,'square',.18,.18);
        vib([10,10,30,10,50]);
      }
      if(it.type==='star'){ p.invT=300; p.score+=1000; sndItem(); addParts(it.x+7,it.y+7,'#ffd700',12); }
      if(it.type==='djump'){
        p.djump=true; p.score+=1000; sndItem();
        addParts(it.x+7,it.y+7,'#88ff44',20); addParts(it.x+7,it.y+7,'#fff',10);
        spawnFloat(it.x+7,it.y,'2段ジャンプ!','#88ff44');
      }
      if(it.type==='cape'){ ctx.fillStyle='#c98b3c'; ctx.fillRect(x+2,y+3,10,9); ctx.fillStyle='#fff2aa'; ctx.fillRect(x+4,y+5,6,2); ctx.fillStyle='#7a3b12'; ctx.fillRect(x+1,y+4,2,8); }
    if(it.type==='hammer'){
        p.hammerT=400; p.score+=1000; sndHammer();
        addParts(it.x+7,it.y+7,'#ff8800',40); addParts(it.x+7,it.y+7,'#ffee00',30);
        addParts(it.x+7,it.y+7,'#ffffff',20);
        shakeX=8; shakeY=8;
        spawnFloat(it.x+7,it.y,'🔨 HAMMER!!','#ffcc00');
        spawnFloat(it.x+7,it.y+10,'無敵！！','#ff8800');
        phaseFlashT=18; phaseFlashCol='rgba(255,160,0,';
      }
      if(it.type==='cape'){
        p.cape=true; p.capeT=1200; p.score+=1000; sndCape();
        addParts(it.x+7,it.y+7,'#d8a15a',22); addParts(it.x+7,it.y+7,'#fff2aa',12);
        spawnFloat(it.x+7,it.y,'マント!','#ffd080');
      }
      if(it.type==='ice'){ p.iceReady=Math.min(5,p.iceReady+3); p.score+=1000; sndFreeze(); addParts(it.x+7,it.y+7,'#88ddff',18); addParts(it.x+7,it.y+7,'#fff',10); }
      if(it.type==='mini'){
        p.mini=true; p.miniT=600; p.big=false; p.fire=false;
        p.w=8; p.h=8; p.score+=1000; sndItem();
        addParts(it.x+7,it.y+7,'#ff88cc',20); addParts(it.x+7,it.y+7,'#fff',10);
        spawnFloat(it.x+7,it.y,'ミニ!','#ff88cc');
      }
      if(it.type==='magnet'){
        p.magnet=true; p.magnetT=480; p.score+=1000; sndItem();
        addParts(it.x+7,it.y+7,'#ff4488',20); addParts(it.x+7,it.y+7,'#ffd700',14);
        spawnFloat(it.x+7,it.y,'磁石コイン!','#ffd700');
      }
      if(it.type!=='mini'&&it.type!=='magnet') spawnFloat(it.x+7,it.y,'1000','#fff');
    }
  });

  // Enemies
  enemies.forEach(e=>{
    if(!e.alive) return;
    if(e.carried) return; // 持ち上げ中は通常更新スキップ
    if(e.stomp>0){ e.stomp--; if(!e.stomp) e.alive=false; return; }
    if(e.frozen>0){
      e.frozen--;
      // 凍結中：プレイヤーが横から触れたら持ち上げ
      if(!p.carrying && p.invT===0 && overlap(p.x,p.y,p.w,p.h,e.x,e.y,e.w,e.h)){
        if(!(p.vy>0 && p.y+p.h < e.y+e.h*.7)){
          p.carrying=e; e.carried=true; sndPickup();
        }
      }
      return;
    }
    e.vy=Math.min(10,e.vy+GRAVITY*.6);
    e.x+=e.vx; e.y+=e.vy; e.animT++;
    const ex0=Math.floor(e.x/T),ex1=Math.floor((e.x+e.w-1)/T);
    const eyB=Math.floor((e.y+e.h)/T);
    if(isSolid(getTile(ex0,eyB))||isSolid(getTile(ex1,eyB))){ e.y=eyB*T-e.h; e.vy=0; }
    // 壁・端の反転（同フレームで複数回反転しないよう1回のみ）
    {
      let flipped=false;
      if(!flipped && isSolid(getTile(ex0,Math.floor(e.y/T)))&&e.vx<0){ e.vx=Math.abs(e.vx); flipped=true; }
      if(!flipped && isSolid(getTile(ex1+1,eyB-1))&&e.vx>0){ e.vx=-Math.abs(e.vx); flipped=true; }
      if(!flipped && !isSolid(getTile(ex0,eyB+1))&&e.vx<0){ e.vx=Math.abs(e.vx); flipped=true; }
      if(!flipped && !isSolid(getTile(ex1,eyB+1))&&e.vx>0){ e.vx=-Math.abs(e.vx); flipped=true; }
      // 最低速度保証（ゼロ速度で固まらないように）
      if(Math.abs(e.vx)<0.4) e.vx=e.vx>=0?0.8:-0.8;
    }
    if(e.x<0||e.x>LW*T) e.alive=false;
    if(p.invT===0 && overlap(p.x,p.y,p.w,p.h,e.x,e.y,e.w,e.h)){
      if(p.vy>0 && p.y+p.h < e.y+e.h*.55){
        e.stomp=18; e.vy=0; e.vx=0;
        p.combo++; p.comboT=90;
        const _cmul=Math.pow(2,Math.min(p.combo-1,5));
        const _cscore=200*_cmul;
        p.vy=-7+(p.mini?-2:0); p.score+=_cscore; sndStomp(); sndEnemyDie(); vibStomp(); _achStompCount++;
        if(p.combo>1) spawnFloat(e.x+7,e.y,`${p.combo}コンボ! ×${_cmul}`,'#ff9900');
        else spawnFloat(e.x+7,e.y,'200','#ff8');
        addParts(e.x+7,e.y+6,'#ff4400',6);
      } else { hurtPlayer(); }
    }
  });

  // 持ち上げ中：プレイヤーの頭の上に追従
  if(p.carrying){
    const e=p.carrying;
    e.x=p.x+(p.w-e.w)/2; e.y=p.y-(p.big?20:16)-2;
  }

  // 投げられた敵：高速移動、他の敵に当たったら両方死亡
  for(let i=thrownEnemies.length-1;i>=0;i--){
    const te=thrownEnemies[i];
    te.x+=te.vx; te.y+=te.vy; te.vy=Math.min(10,te.vy+GRAVITY*.5);
    const ttx=Math.floor((te.x+(te.vx>0?te.w:0))/T);
    const ttyB=Math.floor((te.y+te.h)/T);
    if(isSolid(getTile(ttx,Math.floor((te.y+te.h/2)/T)))){ te.vx*=-0.5; }
    if(isSolid(getTile(Math.floor(te.x/T),ttyB))||isSolid(getTile(Math.floor((te.x+te.w-1)/T),ttyB))){ te.y=ttyB*T-te.h; te.vy=0; }
    te.life=(te.life||120)-1;
    if(te.life<=0||te.y>LH*T){ thrownEnemies.splice(i,1); continue; }
    let hitSomething=false;
    enemies.forEach(e=>{
      if(!e.alive||e.carried||hitSomething) return;
      if(overlap(te.x,te.y,te.w,te.h,e.x,e.y,e.w,e.h)){
        e.stomp=1; e.vx=0; e.vy=0;
        addParts(e.x+7,e.y+6,'#88ddff',12); addParts(e.x+7,e.y+6,'#fff',8);
        spawnFloat(e.x+7,e.y,'300','#88ddff'); p.score+=300;
        sndEnemyDie(); hitSomething=true;
      }
    });
    if(hitSomething){ thrownEnemies.splice(i,1); }
  }


  // ── チェックポイント ─────────────────────────────────────
  {
    const cpX=118*T;
    if(!checkpointActivated && p.x > cpX){
      checkpointActivated=true;
      checkpointX=cpX+8;
      checkpointBig=p.big; checkpointFire=p.fire;
      spawnFloat(cpX+8,((GR-5)*T),'チェックポイント!','#00ff88');
      addParts(cpX+8,(GR-1)*T,'#00ff88',20); addParts(cpX+8,(GR-1)*T,'#ffdd00',14);
      tone(880,.06,'square',.12); tone(1100,.05,'square',.10,.07); tone(1320,.06,'square',.10,.13);
      shakeX=4; shakeY=4;
    }
  }

  // ── パイプから敵スポーン ──────────────────────────────
  PIPE_DEFS.forEach((pd,i)=>{
    // プレイヤーが遠すぎる場合はスキップ（画面外に溜めない）
    if(Math.abs(pd.x - p.x) > 600) return;
    if(pipeWarn[i]>0){
      pipeWarn[i]--;
      if(pipeWarn[i]===0){
        // 飛び出し！
        const dir=p.x>pd.x?1:-1;
        enemies.push({
          x:pd.x-7, y:pd.pipeTopY-14,
          vx:dir*1.0, vy:-3.5,
          w:14, h:12, alive:true, stomp:0, animT:0,
          frozen:0, carried:false, fromPipe:true
        });
        sndPipePop();
        shakeX=4; shakeY=4;
        addParts(pd.x,pd.pipeTopY,'#88ff44',12);
        addParts(pd.x,pd.pipeTopY,'#ffffff',8);
        pipeTimers[i]=350+Math.floor(Math.random()*450);
      }
      return;
    }
    pipeTimers[i]--;
    if(pipeTimers[i]<=0){
      pipeWarn[i]=70; // 「！」警告フレーム
      tone(1200,.03,'square',.12); tone(1600,.04,'square',.10,.03);
    }
  });


  // ── 3面溶岩火柱（間欠泉）────────────────────────────────────
  if(currentStage===3){
    geyserTimers.forEach(g=>{
      g.t--;
      if(g.t<=0){
        // 火柱噴出：SPIKEタイルの上に上向きプロジェクタイルを出す
        const gx=g.tx*T+T/2;
        const gy=(GR)*T;
        projs.push({x:gx-4,y:gy-8,vx:0,vy:-4.5,w:8,h:10,life:28,kind:'geyser'});
        addParts(gx,gy,'#ff4400',8);
        addParts(gx,gy,'#ff8800',5);
        tone(180,.06,'sawtooth',.18);
        g.t=g.interval+Math.floor(Math.random()*40);
      }
    });
  }

  // ── 動く足場 ──────────────────────────────────────────────────
  movPlats.forEach(mp=>{
    if(mp.vx){ mp.x+=mp.vx; if(Math.abs(mp.x-mp.x0)>mp.range){ mp.vx*=-1; mp.x=mp.x0+mp.range*Math.sign(mp.x-mp.x0); } }
    if(mp.vy){ mp.y+=mp.vy; if(Math.abs(mp.y-mp.y0)>mp.range){ mp.vy*=-1; mp.y=mp.y0+mp.range*Math.sign(mp.y-mp.y0); } }
    if(!p.dead && p.vy>=0){
      if(p.x+p.w-3>mp.x && p.x+3<mp.x+mp.w &&
         p.y+p.h>=mp.y && p.y+p.h<=mp.y+mp.h+Math.abs(p.vy)+6){
        p.y=mp.y-p.h; p.vy=0; p.onGround=true; p.djumpUsed=false; p.wallT=0;
        p.x+=mp.vx;
        if(mp.vy<0) p.y+=mp.vy; // 上昇時も追随
      }
    }
  });

  // ── タル転がし（ドンキーコング風） ─────────────────────
  for(let i=barrels.length-1;i>=0;i--){
    const br=barrels[i];
    if(!br.alive){ barrels.splice(i,1); continue; }
    br.animT++;
    br.vy=Math.min(10,br.vy+GRAVITY*.7);
    br.x+=br.vx; br.y+=br.vy;
    const brx0=Math.floor(br.x/T),brx1=Math.floor((br.x+br.w-1)/T);
    const bryB=Math.floor((br.y+br.h)/T);
    if(isSolid(getTile(brx0,bryB))||isSolid(getTile(brx1,bryB))){
      br.y=bryB*T-br.h; br.vy=0;
      if(getTile(brx0,bryB)===SPRING||getTile(brx1,bryB)===SPRING) br.vy=-9;
    }
    const wallT=getTile(Math.floor((br.x+(br.vx>0?br.w:0))/T),Math.floor((br.y+br.h*.5)/T));
    if(isSolid(wallT)){ br.vx*=-0.85; sndBarrel(); }
    br.life=(br.life||380)-1;
    if(br.life<=0||br.y>(GR+3)*T){ barrels.splice(i,1); continue; }
    if(p.invT===0&&overlap(p.x,p.y,p.w,p.h,br.x,br.y,br.w,br.h)){
      if(p.vy>0&&p.y+p.h<br.y+br.h*.6){
        br.alive=false; p.vy=-7; p.score+=300;
        spawnFloat(br.x+7,br.y,'300','#ffdd00');
        addParts(br.x+7,br.y+7,'#c84b0a',12); sndStomp(); vibStomp();
      } else { hurtPlayer(); }
    }
    for(let j=fireballs.length-1;j>=0;j--){
      if(overlap(fireballs[j].x,fireballs[j].y,8,8,br.x,br.y,br.w,br.h)){
        br.alive=false; addParts(br.x+7,br.y+7,'#ff4400',12);
        p.score+=200; spawnFloat(br.x+7,br.y,'200','#ff8800');
        fireballs.splice(j,1); break;
      }
    }
  }

  // Boss
  if(boss.alive){
    const bossActivateX = (currentStage===4) ? 150*T : (currentStage===3) ? 143*T : 157*T;
    if(p.x>bossActivateX && !boss.active){ boss.active=true; bossWarn=240; bossIntroT=240; shakeX=8; shakeY=8; tone(90,.35,'sawtooth',.30); tone(180,.18,'square',.22,.2); }
    if(boss.active) updateBoss();
  }

  // ── ファイアボール ──
  for(let i=fireballs.length-1;i>=0;i--){
    const fb=fireballs[i];
    fb.x+=fb.vx; fb.y+=fb.vy; fb.vy=Math.min(8,fb.vy+GRAVITY*.45); fb.life--;
    // 床バウンド
    const fbty=Math.floor((fb.y+fb.h)/T);
    const fbtx0=Math.floor(fb.x/T), fbtx1=Math.floor((fb.x+fb.w-1)/T);
    if(isSolid(getTile(fbtx0,fbty))||isSolid(getTile(fbtx1,fbty))){
      if(fb.bounces>=2){ addParts(fb.x+4,fb.y+4,'#ff4400',5); fireballs.splice(i,1); continue; }
      fb.vy=-Math.abs(fb.vy)*.65; fb.y=fbty*T-fb.h; fb.bounces++;
    }
    // 壁衝突
    if(isSolid(getTile(Math.floor((fb.x+(fb.vx>0?fb.w:0))/T),Math.floor((fb.y+fb.h/2)/T)))){
      addParts(fb.x+4,fb.y+4,'#ff4400',5); fireballs.splice(i,1); continue;
    }
    if(fb.life<=0){ fireballs.splice(i,1); continue; }
    // 敵に当たる
    let hit=false;
    enemies.forEach(e=>{
      if(!e.alive||e.stomp>0||hit) return;
      if(overlap(fb.x,fb.y,fb.w,fb.h,e.x,e.y,e.w,e.h)){
        if(e.fireType){
          // 火炎カニ：ファイア無効！炎を弾く
          addParts(e.x+7,e.y+2,'#ff8800',8);
          spawnFloat(e.x+7,e.y,'🔥無効!','#ff6600');
          hit=true; // ファイアボールは消える
        } else {
          e.stomp=18; e.vy=-3; e.vx=0;
          p.score+=300;
          addParts(e.x+7,e.y+6,'#ff4400',10); addParts(e.x+7,e.y+6,'#ffcc00',8);
          spawnFloat(e.x+7,e.y,'300','#ff8800');
          sndEnemyDie(); hit=true;
        }
      }
    });
    if(hit){ fireballs.splice(i,1); }
  }

  // ── アイスボール ──
  for(let i=iceballs.length-1;i>=0;i--){
    const ib=iceballs[i];
    ib.x+=ib.vx; ib.y+=ib.vy; ib.vy=Math.min(6,ib.vy+GRAVITY*.3); ib.life--;
    const ibty=Math.floor((ib.y+ib.h)/T);
    if(isSolid(getTile(Math.floor(ib.x/T),ibty))||isSolid(getTile(Math.floor((ib.x+ib.w-1)/T),ibty))){
      ib.y=ibty*T-ib.h; ib.vy*=-.4;
    }
    if(isSolid(getTile(Math.floor((ib.x+(ib.vx>0?ib.w:0))/T),Math.floor((ib.y+ib.h/2)/T)))){
      addParts(ib.x+4,ib.y+4,'#88ddff',5); iceballs.splice(i,1); continue;
    }
    if(ib.life<=0){ iceballs.splice(i,1); continue; }
    let ibHit=false;
    enemies.forEach(e=>{
      if(!e.alive||e.frozen>0||e.stomp>0||e.carried||ibHit) return;
      if(overlap(ib.x,ib.y,ib.w,ib.h,e.x,e.y,e.w,e.h)){
        e.frozen=220; e.vx=0; e.vy=0;
        addParts(e.x+7,e.y+6,'#88ddff',14); addParts(e.x+7,e.y+6,'#fff',8);
        spawnFloat(e.x+7,e.y,'❄','#88ddff');
        sndFreeze(); ibHit=true;
      }
    });
    if(ibHit){ iceballs.splice(i,1); continue; }

    // ボスに当たる（2回でHP-1）
    if(boss.alive && overlap(ib.x,ib.y,ib.w,ib.h,boss.x,boss.y,boss.w,boss.h)){
      boss.iceHits=(boss.iceHits||0)+1;
      boss.hitT=30; _achIceHitCount++;
      addParts(boss.x+boss.w/2,boss.y+10,'#88ddff',14);
      addParts(boss.x+boss.w/2,boss.y+10,'#fff',8);
      sndFreeze();
      const iceDmgThreshold = (boss.magmaMode) ? 1 : 2; // 3面ボスは氷1発でHP-1
    const iceDmgAmt = (boss.magmaMode) ? 2 : 1;         // さらに2倍ダメージ
    if(boss.iceHits>=iceDmgThreshold && (boss._invT||0)<=0){
        boss.iceHits=0;
        boss.hp-=iceDmgAmt;
        boss.hitT=boss.magmaMode?70:50;
        shakeX=boss.magmaMode?8:4; shakeY=boss.magmaMode?8:4;
        if(boss.magmaMode){
          spawnFloat(boss.x+boss.w/2,boss.y,'❄❄ 弱点!! -'+iceDmgAmt,'#88ddff');
          addParts(boss.x+boss.w/2,boss.y,'#88ddff',30);
          addParts(boss.x+boss.w/2,boss.y,'#ffffff',15);
          phaseFlashT=10; phaseFlashCol='rgba(100,180,255,';
        } else {
          spawnFloat(boss.x+boss.w/2,boss.y,'❄-1','#88ddff');
          addParts(boss.x+boss.w/2,boss.y,'#66bbff',20);
        }
        sndBossHit(); vibBossHit();
        if(boss.hp<=0) killBoss(5000);
      } else {
        spawnFloat(boss.x+boss.w/2,boss.y,'❄','#88ddff');
      }
      iceballs.splice(i,1);
    }
  }

  // Projectiles（ボスの弾）
  for(let i=projs.length-1;i>=0;i--){
    const pr=projs[i];
    pr.x+=pr.vx; pr.y+=pr.vy; pr.vy+=GRAVITY*.3; pr.life--;
    if(pr.life<=0||((pr.kind!=='shockwave')&&isSolid(getTile(Math.floor(pr.x/T),Math.floor(pr.y/T))))){
      addParts(pr.x,pr.y,'#ff6600',5); projs.splice(i,1); continue;
    }
    if(p.invT===0 && overlap(p.x,p.y,p.w,p.h,pr.x,pr.y,pr.w,pr.h)){
      hurtPlayer(); projs.splice(i,1);
    }
  }

  // Particles + float texts
  for(let i=parts.length-1;i>=0;i--){
    const pt=parts[i];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=.13; pt.vx*=.9; pt.life--;
    if(pt.life<=0) parts.splice(i,1);
  }
  for(let i=floatTxts.length-1;i>=0;i--){
    floatTxts[i].y-=.5; floatTxts[i].life--;
    if(floatTxts[i].life<=0) floatTxts.splice(i,1);
  }

  // Stage clear / Final clear：1面ボス撃破後は2面へ、2面ボス撃破後だけ最終クリア
  if(!boss.alive){
    bossWarn=0;
    boss._deadTimer=(boss._deadTimer||0)+1;
    if(boss._deadTimer===1){
      sndWin(); vibWin(); stopBGM(); bossDefeatT=300;
      // リザルト計算
      (function(){
        const elapsedSec=Math.max(0,(tick-_stageStartTick)/60);
        const tBonus=Math.max(0,Math.round(10000-elapsedSec*28));
        const cBonus=_stageCoinsCollected*200;
        const total=tBonus+cBonus;
        const rank=total>=14000?'S':total>=9000?'A':total>=4000?'B':total>=1000?'C':'D';
        const rankCol=rank==='S'?'#ffd700':rank==='A'?'#88ccff':rank==='B'?'#88ff88':rank==='C'?'#ffffff':'#aaaaaa';
        _stageClearData={tBonus,cBonus,total,rank,rankCol,elapsedSec};
      })();
      if(currentStage===1){
        spawnFloat(boss.x+boss.w/2,boss.y-20,'STAGE 1 CLEAR!','#ffef5a');
      } else if(currentStage===2){
        spawnFloat(boss.x+boss.w/2,boss.y-20,'STAGE 2 CLEAR!','#ff9944');
      } else if(currentStage===3){
        spawnFloat(boss.x+boss.w/2,boss.y-20,'🌋 STAGE 3 CLEAR!! 🌋','#ff6622');
        spawnFloat(boss.x+boss.w/2,boss.y-40,'MAGMA CRAB KING 撃破！','#ffcc00');
        phaseFlashT=40; phaseFlashCol='rgba(255,100,0,';
      } else if(currentStage===4){
        spawnFloat(boss.x+boss.w/2,boss.y-20,'⭐ FINAL CLEAR!! ⭐','#cc88ff');
        spawnFloat(boss.x+boss.w/2,boss.y-40,'OMEGA CRAB KING 撃破！','#ffffff');
        phaseFlashT=60; phaseFlashCol='rgba(180,0,255,';
      } else {
        clearTimeMs=Date.now()-gameStartTime;
        lastClearIsBest=(!bestClearTime || clearTimeMs<bestClearTime);
        if(lastClearIsBest){ bestClearTime=clearTimeMs; localStorage.setItem('crabBestClearTime',String(bestClearTime)); }
        clearSavedProgress();
        if(clearTimeMs<180000) unlockAchievement('speedrun');
      }
    }
    if(boss._deadTimer>300){
      if(currentStage===1){ startStage2FromStage1(); return; }
      if(currentStage===2){ startStage3FromStage2(); return; }
      if(currentStage===3){ startStage4FromStage3(); return; }
      // currentStage===4: FINAL CLEAR
      submitScore(); gameState='fullclear'; fullClearT=420; bossDefeatT=999999;
    }
  }

  updateCamera();
}

function updateBoss(){
  const b=boss;

  // SKY CRAB KING phase control：2面のみ強化
  const isSkyBoss = (typeof currentStage !== 'undefined' && currentStage===2) || b.skyMode;
  if(isSkyBoss && !b._skyInit){
    b._skyInit=true;
    b.skyMode=true;
    b.hp=Math.max(b.hp||0,8);
    b.maxHp=Math.max(b.maxHp||0,8);
    b.bubbleT=80;
    b.shockT=0;
    b.phase2=false;
  }
  b.clawA+=.08; b.eyeA+=.05;
  b.hitT=Math.max(0,b.hitT-1);
  b.actT--;

  // SKY CRAB KING attacks：泡弾＋地面ドン衝撃波
  // MAGMA CRAB：火炎弾（skyModeと別系統）
  if(b.magmaMode && b.active && b.alive && (!b.skyMode || b.omegaMode)){
    const wasPhase2_mg=b.phase2;
    b.phase2 = b.hp <= Math.ceil(b.maxHp/2);
    if(!wasPhase2_mg && b.phase2){
      finalPhaseT=120; phaseFlashT=40; phaseFlashCol='rgba(255,0,0,';
      b._invT=90; // フェーズ2移行時：90フレーム無敵（マグマアーマー）
      spawnFloat(b.x+b.w/2,b.y-20,'🔥 MAGMA ARMOR! 🔥','#ff4400');
    }
    if(b._invT>0){ b._invT--; b.hitT=2; } // 無敵中はダメージ無効
    if(!b.bubbleT) b.bubbleT=65;
    b.bubbleT--;
    if(b.bubbleT===28){ spawnFloat(b.x+b.w/2,b.y-14,'🔥！','#ff4400'); b._aimWarn=28; }
    if(b._aimWarn>0) b._aimWarn--;
    if(b.bubbleT<=0){
      const dir=player.x>b.x?1:-1;
      const shots=b.phase2?[-1.8,-0.4,1.0]:[-1.0,0.4];
      shots.forEach((vy,i)=>{
        projs.push({x:b.x+(dir>0?b.w:0),y:b.y+b.h/2-3+i*2,
          vx:dir*(b.phase2?3.8:3.2),vy,w:9,h:8,life:80,kind:'fire'});
      });
      tone(220,.08,'sawtooth',.22);
      b._aimWarn=0;
      b.bubbleT=b.phase2?48:68;
    }
    if(b.shockT>0) b.shockT--;
  }

  if(b.skyMode && b.active && b.alive){
    const wasPhase2_sky=b.phase2;
    b.phase2 = b.hp <= Math.ceil(b.maxHp/2);
    if(!wasPhase2_sky && b.phase2){ finalPhaseT=120; phaseFlashT=40; phaseFlashCol='rgba(200,50,255,'; }
    if(!b.bubbleT) b.bubbleT=90;
    b.bubbleT--;
    // ─ 予備動作Tell：発射28フレーム前に「！」警告 ─
    if(b.bubbleT===28){
      spawnFloat(b.x+b.w/2,b.y-14,'💧！','#44aaff');
      b._aimWarn=28; // 点滅カウンタ
    }
    if(b._aimWarn>0) b._aimWarn--;
    if(b.bubbleT<=0){
      const dir = player.x > b.x ? 1 : -1;
      const shots = b.phase2 ? [-2.0, -0.7, 0.8] : [-1.2, 0.2];
      shots.forEach((vy,i)=>{
        projs.push({
          x:b.x+(dir>0?b.w:0),
          y:b.y+b.h/2-4+i*2,
          vx:dir*(b.phase2?3.2:2.6),
          vy:vy,
          w:9,h:9,
          life:95,
          kind:'bubble'
        });
      });
      sndBubble();
      b._aimWarn=0;
      b.bubbleT=b.phase2?58:82;
    }
    if(b.shockT>0) b.shockT--;
  }

  // Move
  const prevVy = b.vy;
  b.vy=Math.min(10,b.vy+GRAVITY*.5);
  b.x+=b.vx; b.y+=b.vy;

  const bx0=Math.floor(b.x/T), bx1=Math.floor((b.x+b.w-1)/T);
  const byB=Math.floor((b.y+b.h)/T);
  const onGround = isSolid(getTile(bx0,byB))||isSolid(getTile(bx1,byB));
  const justLanded = onGround && prevVy > 1.5;
  // ボスの頭が天井タイルに入ったら押し下げる
  const byT=Math.floor(b.y/T);
  if(b.vy<0 && (isSolid(getTile(bx0,byT))||isSolid(getTile(bx1,byT)))){
    b.y=(byT+1)*T; b.vy=Math.abs(b.vy)*.4;
  } // 着地判定（閾値を上げて誤爆防止）
  if(onGround){ b.y=Math.min(byB,GR)*T-b.h; b.vy=0; }
  // ハードクランプ：絶対に地面（GR行）より下には行かない
  if(b.y + b.h > GR*T){ b.y = GR*T - b.h; b.vy = 0; }
  // 画面外上限：ボスが上に飛び出したら跳ね返す
  if(b.y < (GR-7)*T){ b.y=(GR-7)*T; b.vy=Math.abs(b.vy)*.4; } // 天井タイル下に固定

  // 壁反射
  if(b.x<158*T) b.vx=Math.abs(b.vx);
  if(b.x+b.w>LW*T-T) b.vx=-Math.abs(b.vx);
  const spd=(b.skyMode?1.45:1.2)+(b.maxHp-b.hp)*(b.skyMode?.42:.35);
  b.vx=b.vx>0?spd:-spd;
  // フェーズ変化検知
  const newPhase=b.hp>=7?1:b.hp>=4?2:1>=b.hp?4:3;
  if((b._phase||1)!==newPhase){
    b._phase=newPhase;
    if(newPhase===2){
      shakeX=10;shakeY=10;
      spawnFloat(b.x+b.w/2,b.y,'PHASE 2!','#ff8800');
      addParts(b.x+b.w/2,b.y+b.h/2,'#ff8800',30); addParts(b.x+b.w/2,b.y+b.h/2,'#ffd700',15);
      tone(120,.4,'sawtooth',.35); tone(150,.2,'square',.25,.15);
      phaseFlashT=18; phaseFlashCol='rgba(255,140,0,';
    }
    if(newPhase===3){
      shakeX=14;shakeY=14;
      spawnFloat(b.x+b.w/2,b.y,'ENRAGE!!','#ff2200');
      addParts(b.x+b.w/2,b.y+b.h/2,'#ff2200',40); addParts(b.x+b.w/2,b.y+b.h/2,'#ffd700',25); addParts(b.x+b.w/2,b.y+b.h/2,'#fff',15);
      tone(80,.5,'sawtooth',.40); tone(90,.3,'square',.30,.15); tone(60,.2,'sawtooth',.25,.3);
      phaseFlashT=24; phaseFlashCol='rgba(255,40,0,';
    }
    if(newPhase===4){
      shakeX=18;shakeY=18;
      spawnFloat(b.x+b.w/2,b.y,'LAST STAND!!','#ff0000');
      addParts(b.x+b.w/2,b.y+b.h/2,'#ff0000',60); addParts(b.x+b.w/2,b.y+b.h/2,'#fff',40); addParts(b.x+b.w/2,b.y+b.h/2,'#ffee00',30);
      tone(60,.6,'sawtooth',.45); tone(50,.4,'square',.35,.2); tone(40,.25,'sawtooth',.3,.4);
      phaseFlashT=30; phaseFlashCol='rgba(255,0,0,';
    }
  }
  // 泡エフェクト（HP低いほど頻繁に）
  if(b.hp<=6 && tick%(b.hp<=2?8:b.hp<=4?15:25)===0){
    const bx2=b.x+6+Math.random()*(b.w-12);
    addParts(bx2,b.y,'#aaddff',3);
    parts.push({x:bx2,y:b.y,vx:(Math.random()-.5)*.8,vy:-1.2-Math.random()*.8,life:22,sz:Math.random()<.5?2:3,col:'rgba(180,220,255,.8)'});
  }
  // 着地衝撃波（HP低い時）
  if(justLanded && b.hp<=5){
    shakeX=5+Math.max(0,3-b.hp); shakeY=5+Math.max(0,3-b.hp);
    addParts(b.x+b.w/2,(byB)*T,'#ff8800',12+b.hp);
    projs.push({x:b.x-20,y:byB*T-6,vx:-3.5,vy:0,w:16,h:6,life:20});
    projs.push({x:b.x+b.w+4,y:byB*T-6,vx:3.5,vy:0,w:16,h:6,life:20});
  }

  const p=player;

  // ── フェーズ行動 ──────────────────────────────
  if(b.actT<=0){
    if(b.hp>=4){
      // フェーズ1：ランダムでジャンプ・方向転換・ダッシュ
      const r=Math.random();
      if(r<0.25 && onGround){
        b.vy=-5; // 小ジャンプ
        b.actT=100+Math.floor(Math.random()*60);
      } else if(r<0.5){
        b.vx=-b.vx; // 方向転換
        b.actT=80+Math.floor(Math.random()*50);
      } else if(r<0.65){
        // プレイヤーに向かってダッシュ
        b.vx=p.x>b.x?spd*1.8:-spd*1.8;
        b.actT=60+Math.floor(Math.random()*40);
      } else {
        b.actT=120+Math.floor(Math.random()*60);
      }
    } else if(b.hp>=2){
      // フェーズ2：ストンプジャンプ or ランダム回避
      const r=Math.random();
      if(r<0.55 && onGround){
        // ストンプTell: ジャンプ前に床ひび割れ予告
        spawnFloat(b.x+b.w/2,b.y+b.h,'💥','#ff8800');
        addParts(b.x+b.w/2,(byB)*T,'#ff4400',8);
        b.vy=-7; b.actT=110; sndShock(); // ストンプジャンプ
      } else if(r<0.75){
        b.vx=-b.vx; // 回避
        b.actT=70+Math.floor(Math.random()*40);
      } else if(r<0.9 && onGround){
        // プレイヤーの逆方向に跳ぶ
        const away=p.x>b.x?-1:1;
        b.vx=away*spd*1.5; b.vy=-6;
        b.actT=90;
      } else {
        b.actT=80+Math.floor(Math.random()*40);
      }
    } else {
      // 激怒フェーズ：爪弾＋激しいランダム行動
      [-1,1].forEach(dir=>{
        projs.push({x:b.x+(dir>0?b.w:0),y:b.y+b.h/2,vx:dir*3.5,vy:-2.5,w:10,h:8,life:80});
      });
      const r=Math.random();
      if(r<0.4 && onGround) b.vy=-7;           // ジャンプ
      if(r<0.2){ b.vx=p.x>b.x?spd*2:-spd*2; } // 突進
      else if(r<0.4){ b.vx=-b.vx; }             // 反転
      b.actT=55+Math.floor(Math.random()*25);
    }
  }

  // ── タル投げ ──────────────────────────────────────────
  if(b.barrelT>0) b.barrelT--;
  if(b.barrelT===0 && onGround && b.hp<=5){
    const dir=p.x<b.x?-1:1;
    barrels.push({x:b.x+(dir<0?0:b.w-14),y:b.y+b.h-14,vx:dir*2.8,vy:-1.5,w:14,h:14,alive:true,animT:0,life:400});
    sndBarrel(); addParts(b.x+b.w/2,b.y+b.h*.5,'#c84b0a',8);
    const iv=b.hp<=2?130:b.hp<=4?210:290;
    b.barrelT=iv+Math.floor(Math.random()*110);
  }

  // SKY CRAB KING phase2 jump assist
  if(b.skyMode && b.phase2 && onGround && Math.random()<0.018){
    b.vy=-8.2;
    b.vx += (player.x>b.x?1:-1)*1.2;
  }

  // 地上でたまにランダム反転（フェーズ問わず）
  if(onGround && Math.random()<0.006) b.vx=-b.vx;

  // ── 着地衝撃（着地した瞬間のみ・stompT=180で重複防止） ──
  if(b.stompT>0){ b.stompT--; }
  if(justLanded && b.stompT===0 && (b.hp<4 || b.skyMode)){
    shakeX=b.skyMode?8:5; shakeY=b.skyMode?7:5; 
    if(b.skyMode) sndShockWave(); else sndShock();
    b.stompT=b.skyMode?110:180;
    addParts(b.x+b.w/2,b.y+b.h,'#ff6600',b.skyMode?24:16);
    addParts(b.x+b.w/2,b.y+b.h,'#ffaa00',b.skyMode?18:10);
    if(b.skyMode){
      [-1,1].forEach(dir=>{
        projs.push({
          x:b.x+b.w/2,
          y:b.y+b.h-8,
          vx:dir*(b.phase2?4.0:3.0),
          vy:-0.5,
          w:16,h:8,
          life:70,
          kind:'shockwave'
        });
      });
      spawnFloat(b.x+b.w/2,b.y-8,'地面ドン!','#ff8844');
    }
  }

  // ── プレイヤーがボスを踏む ──
  const stompZoneTop = b.y + 5;
  const stompZoneBot = b.y + 22;
  if(p.vy>0 && p.y+p.h>stompZoneTop && p.y+p.h<stompZoneBot
     && p.x+p.w>b.x+4 && p.x<b.x+b.w-4){
    const gp=p.groundPound;
    const dmg=gp?2:1;
    b.hp-=dmg; b.hitT=gp?60:45;
    p.vy=gp?-10:-8;
    if(gp){ shakeX=8; shakeY=8; p.groundPound=false; }
    else  { shakeX=4; shakeY=4; }
    addParts(b.x+b.w/2,b.y,'#ff4400',gp?28:16);
    if(gp){ addParts(b.x+b.w/2,b.y,'#ffffff',12); addParts(b.x+b.w/2,b.y,'#ffee00',10); }
    const pts=gp?1000:500;
    spawnFloat(b.x+b.w/2,b.y-12,gp?'1000 x2!!':String(pts),'#ff8800');
    p.score+=pts; sndBossHit(); vibBossHit();
    hitStopT=gp?7:4; telemetry.bossHits++;
    if(b.hp<=0){
      // ボス撃破：デスアニメ用に座標保存
      b.alive=false;
      b._dieX=b.x; b._dieY=b.y;
      addParts(b.x+b.w/2,b.y+b.h/2,'#ff4400',32);
      addParts(b.x+b.w/2,b.y+b.h/2,'#ffd700',20);
      addParts(b.x+b.w/2,b.y+b.h/2,'#ffffff',18);
      addParts(b.x+b.w/2,b.y+b.h/2,'#ff8800',16);
      spawnFloat(b.x+b.w/2,b.y,'5000','#ffee00'); p.score+=5000;
      shakeX=10; shakeY=10;
    }
  }
  // ボスに触れてダメージ
  if(p.invT===0 && overlap(p.x,p.y,p.w,p.h,b.x+4,b.y+10,b.w-8,b.h-10)){
    hurtPlayer();
  }
}

function updateCamera(){
  camX+=(player.x-W/2+6-camX)*.15;
  camY+=(player.y-H*.62-camY)*.12;
  camX=Math.max(0,Math.min(LW*T-W,camX));
  camY=Math.max(0,Math.min(LH*T-H,camY));
}

function addParts(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=1+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:30,col,sz:2+Math.random()*2});
  }
}
function spawnFloat(x,y,txt,col){
  floatTxts.push({x,y,txt,col,life:55});
}

// ── DRAWING ────────────────────────────────────────
// Tile drawing
function drawTile(id,sx,sy,tx,ty){
  if(id===SOLID){
    ctx.fillStyle='#b45b0a'; ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle='#c86020'; ctx.fillRect(sx,sy,T,2);
    ctx.fillStyle='#8b3a05'; ctx.fillRect(sx,sy+T-2,T,2);
    ctx.fillStyle='#8b3a05';
    const o=(ty%2)?8:0;
    for(let bx=o;bx<T;bx+=16) ctx.fillRect(sx+bx,sy+5,1,6);
    ctx.fillRect(sx,sy+T/2-1,T,1);
  } else if(id===BRICK){
    ctx.fillStyle='#c84b0a'; ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle='#ffd080'; ctx.fillRect(sx,sy,T,2); ctx.fillRect(sx,sy,2,T);
    ctx.fillStyle='#8b2a00'; ctx.fillRect(sx+T-2,sy,2,T); ctx.fillRect(sx,sy+T-2,T,2);
    ctx.fillRect(sx,sy+T/2,T,1); ctx.fillRect(sx+(ty%2?0:T/2),sy,1,T/2); ctx.fillRect(sx+(ty%2?T/2:0),sy+T/2,1,T/2);
  } else if(id===QBLK){
    const used=!!brokenQ[`${tx},${ty}`];
    ctx.fillStyle=used?'#888':'#f0a000'; ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle=used?'#666':'#c07800'; ctx.fillRect(sx+T-3,sy,3,T); ctx.fillRect(sx,sy+T-3,T,3);
    ctx.fillStyle=used?'#aaa':'#ffd060'; ctx.fillRect(sx,sy,T,3); ctx.fillRect(sx,sy,3,T);
    if(!used){
      ctx.fillStyle='#fff'; ctx.font='bold 11px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('?',sx+T/2,sy+T/2+1);
    }
  } else if(id===PTOP||id===PBOT){
    ctx.fillStyle='#006600'; ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle='#44dd44'; ctx.fillRect(sx+1,sy,4,T);
    ctx.fillStyle='#004400'; ctx.fillRect(sx+T-3,sy,3,T);
    if(id===PTOP){
      ctx.fillStyle='#004400'; ctx.fillRect(sx-2,sy,T+4,5);
      ctx.fillStyle='#55ee55'; ctx.fillRect(sx-1,sy+1,T+2,2);
    }
  } else if(id===BFLOOR){
    ctx.fillStyle='#5a1a7a'; ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle='#7a2a9a'; ctx.fillRect(sx,sy,T,2);
    ctx.fillStyle='#3a0a5a'; ctx.fillRect(sx,sy+T-2,T,2);
    ctx.fillStyle='#6a1a8a'; ctx.fillRect(sx+(tx%2?0:8),sy+5,8,1); ctx.fillRect(sx,sy+T/2,T,1);
  } else if(id===SPRING){
    const comp=Math.sin(tick*.22+sx*.1)*.5+.5;
    ctx.fillStyle='#666'; ctx.fillRect(sx+3,sy+T-4,10,4);
    ctx.fillStyle='#999'; ctx.fillRect(sx+4,sy+T-3,8,2);
    const ch=Math.floor(5+comp*3);
    ctx.fillStyle='#ffcc00';
    for(let ci=0;ci<3;ci++) ctx.fillRect(sx+3,sy+T-5-ch+ci*Math.ceil(ch/3),10,2);
    ctx.fillStyle='#ff8800'; ctx.fillRect(sx+4,sy+T-5-ch-2,8,3);
    ctx.fillStyle='#ffe066'; ctx.fillRect(sx+5,sy+T-5-ch-1,4,2);
  } else if(id===WATER){
    // 水タイル（半透明ブルー）
    const wdepth=(ty-GR); // 深さ（0=水面）
    const alpha=0.55+wdepth*.06;
    ctx.fillStyle=`rgba(30,120,220,${Math.min(.85,alpha)})`;
    ctx.fillRect(sx,sy,T,T);
    if(ty===GR){ // 水面
      ctx.fillStyle=`rgba(120,200,255,${.45+Math.sin(tick*.08+sx*.05)*.12})`;
      ctx.fillRect(sx,sy,T,4);
      ctx.fillStyle='rgba(200,240,255,.25)';
      ctx.fillRect(sx+2,sy+1,T-4,2);
    }
    // 水中の光の揺らぎ
    if(tick%3===0&&Math.random()<.08){
      ctx.fillStyle='rgba(150,220,255,.18)';
      ctx.fillRect(sx+Math.floor(Math.random()*T),sy+Math.floor(Math.random()*T),2,3);
    }
  } else if(id===DASHPAD){
    ctx.fillStyle='#222244'; ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle='#ffdd00'; ctx.fillRect(sx,sy+T-2,T,2);
    ctx.fillStyle='rgba(255,220,0,.9)';
    for(let di=0;di<3;di++){
      const ax=sx+2+di*4, ay=sy+T/2-1;
      ctx.beginPath(); ctx.moveTo(ax,ay-3); ctx.lineTo(ax+4,ay); ctx.lineTo(ax,ay+3); ctx.fill();
      ctx.globalAlpha=.4+di*.25;
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle='#ffdd00'; ctx.lineWidth=1;
    ctx.strokeRect(sx+.5,sy+.5,T-1,T-1);
  } else if(id===SPIKE){
    ctx.fillStyle='#cc4422'; ctx.fillRect(sx,sy+T-4,T,4);
    ctx.fillStyle='#ff8866';
    for(let i=0;i<2;i++){
      ctx.beginPath(); ctx.moveTo(sx+2+i*7,sy+T); ctx.lineTo(sx+6+i*7,sy+4); ctx.lineTo(sx+10+i*7,sy+T); ctx.fill();
    }
    ctx.fillStyle='#ffaa88'; ctx.fillRect(sx+4,sy+4,2,2); ctx.fillRect(sx+11,sy+4,2,2);
  }
}

// Coin tile
function drawCoinTile(sx,sy){
  const b=Math.sin(tick*.09)*1.5;
  ctx.fillStyle='#ffd700'; ctx.fillRect(sx+4,sy+2+b,8,10);
  ctx.fillStyle='#ffee44'; ctx.fillRect(sx+5,sy+3+b,3,8);
  ctx.fillStyle='#c8a000'; ctx.fillRect(sx+9,sy+3+b,3,8);
}

// Player sprite
function drawPlayer(){
  const p=player;
  if(p.invT>0 && Math.floor(p.invT/4)%2) return;

  // Grow flash overlay
  if(p.growT>0){
    const f=Math.floor(p.growT/5)%2;
    ctx.globalAlpha=.55+f*.3;
    ctx.fillStyle=f?'#ffffff':'#ffcc00';
    const gsx=Math.round(p.x-camX+shakeX)-6, gsy=Math.round(p.y-camY+shakeY)-8;
    ctx.fillRect(gsx,gsy,p.w+12,p.h+14);
    ctx.globalAlpha=1;

    // Center-screen POWER UP!! banner
    const pulse=.5+Math.sin(tick*.35)*.5;
    ctx.globalAlpha=.85+pulse*.15;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(30,90,W-60,28);
    ctx.fillStyle=f?'#ffdd00':'#ff8800';
    ctx.font='bold 14px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('★ POWER UP!! ★',W/2,104);
    ctx.fillStyle='#fff'; ctx.font='7px monospace';
    ctx.fillText('スーパーマリオ風に変身！',W/2,116);
    ctx.globalAlpha=1;

    // Spark particles around player
    if(tick%2===0){
      const colors=['#ffdd00','#ff8800','#ff44aa','#44ffff'];
      for(let i=0;i<3;i++){
        const a=Math.random()*Math.PI*2;
        parts.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5-1,
          life:18,col:colors[Math.floor(Math.random()*colors.length)],sz:3});
      }
    }
  }

  // ── ハンマーグロー：体の周りを金色に光らせる ──
  if(p.hammerT>0){
    const hFlash=Math.floor(tick/4)%2;
    const hsx=Math.round(p.x-camX+shakeX), hsy=Math.round(p.y-camY+shakeY);
    // 外側のオーラ
    ctx.globalAlpha=0.35+hFlash*.2;
    ctx.fillStyle=hFlash?'#ffee00':'#ff8800';
    ctx.fillRect(hsx-5,hsy-5,p.w+10,p.h+10);
    // 残り少ない時は赤く点滅（残り60フレーム以下）
    if(p.hammerT<60){
      ctx.globalAlpha=0.5+hFlash*.3;
      ctx.fillStyle=hFlash?'#ff2200':'#ff8800';
      ctx.fillRect(hsx-3,hsy-3,p.w+6,p.h+6);
    }
    ctx.globalAlpha=1;
    // パーティクル（6フレームごと）
    if(tick%6===0){
      const hcols=['#ffee00','#ff8800','#ffcc44'];
      parts.push({x:p.x+Math.random()*p.w,y:p.y+Math.random()*p.h,
        vx:(Math.random()-.5)*1.5,vy:-1.5-Math.random(),
        life:14,col:hcols[Math.floor(Math.random()*3)],sz:2});
    }
  }

  // アイドルボブ（300F以上静止でゆらゆら）
  const idleBob = _idleT>300 ? Math.sin(_idleT*.06)*1.2 : 0;
  ctx.save();
  ctx.translate(Math.round(p.x-camX+shakeX), Math.round(p.y-camY+shakeY+idleBob));
  if(p.dead){ ctx.translate(p.w/2,p.h/2); ctx.rotate(tick*.3); ctx.translate(-p.w/2,-p.h/2); }
  if(p.facing===-1){ ctx.translate(p.w,0); ctx.scale(-1,1); }
  const BIG=p.big;
  // マント表示
  if(p.cape){
    ctx.save();
    const flap=Math.sin(tick*.35)*2;
    const isCapeLow = p.capeT > 0 && p.capeT < 120;
    const capeFlicker = isCapeLow && Math.floor(tick / 4) % 2 === 0;
    ctx.fillStyle = capeFlicker ? '#ff4444' : (p.spinT>0 ? '#ffd080' : '#c98b3c');
    if(p.facing===1){
      ctx.fillRect(-8,5+flap,9,p.h-4);
      ctx.fillStyle='#fff2aa'; ctx.fillRect(-6,7+flap,5,2);
    } else {
      ctx.fillRect(p.w-1,5+flap,9,p.h-4);
      ctx.fillStyle='#fff2aa'; ctx.fillRect(p.w+1,7+flap,5,2);
    }
    ctx.restore();
  }
  if(p.spinT>0){
    ctx.strokeStyle='#ffd080';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(p.w/2,p.h/2,p.w+5,p.h/2+3,0,0,Math.PI*2);
    ctx.stroke();
  }
  const rf=p.runF;
  // Legs
  const legY=BIG?14:11;
  ctx.fillStyle='#7a3510';
  if(rf===1){ ctx.fillRect(2,legY,4,5); ctx.fillRect(7,legY+2,4,5); }
  else if(rf===2){ ctx.fillRect(2,legY+2,4,5); ctx.fillRect(7,legY,4,5); }
  else { ctx.fillRect(2,legY+1,4,5); ctx.fillRect(7,legY+1,4,5); }
  // Shoes
  ctx.fillStyle='#4a1800';
  if(rf===1){ ctx.fillRect(1,legY+5,6,3); ctx.fillRect(6,legY+7,6,3); }
  else if(rf===2){ ctx.fillRect(1,legY+7,6,3); ctx.fillRect(6,legY+5,6,3); }
  else { ctx.fillRect(1,legY+6,6,3); ctx.fillRect(6,legY+6,6,3); }
  // 服の色：fire=白/赤、big=緑、通常=青
  const ov1 = p.fire?'#ffffff': p.big?'#118811':'#1155cc';
  const ov2 = p.fire?'#ffcccc': p.big?'#006600':'#0033aa';
  const btn = p.fire?'#ff4444': p.big?'#44ff44':'#88aaff';
  const hat = p.fire?'#ffffff': '#dd2222';
  // Body (overalls)
  ctx.fillStyle=ov1;
  ctx.fillRect(1,BIG?6:5,10,BIG?9:7);
  ctx.fillStyle=ov2;
  ctx.fillRect(3,BIG?8:7,6,BIG?5:4);
  // Buttons
  ctx.fillStyle=btn; ctx.fillRect(3,BIG?9:8,2,1); ctx.fillRect(7,BIG?9:8,2,1);
  // Head
  ctx.fillStyle='#ffcc88';
  ctx.fillRect(2,BIG?0:1,9,BIG?7:6);
  // Hair
  ctx.fillStyle='#5a2200'; ctx.fillRect(3,BIG?1:2,7,2);
  // Hat
  ctx.fillStyle=hat;
  ctx.fillRect(0,BIG?1:2,12,3); ctx.fillRect(2,BIG?-1:0,8,2);
  // Eyes（パワーアップで目の色変化）
  const eyePupil = p.fire?'#ff2200':p.hammerT>0?'#cc8800':p.cape?'#4488ff':'#000';
  const eyeHighlight = p.fire?'#ffaa00':p.hammerT>0?'#ffee44':'#fff';
  // アイドル時まばたき（300F以上静止 → 120Fごとに6Fだけ目を閉じる）
  const doBlink = _idleT>300 && (_idleT%120)<6;
  if(doBlink){
    // まばたき（目を閉じる）
    ctx.fillStyle='#ffcc88'; ctx.fillRect(5,BIG?3:4,4,2);
    ctx.fillStyle='#5a2200'; ctx.fillRect(5,BIG?4:5,4,1);
  } else {
    ctx.fillStyle='#fff'; ctx.fillRect(5,BIG?3:4,4,2);
    ctx.fillStyle=eyePupil; ctx.fillRect(7,BIG?3:4,2,2);
    ctx.fillStyle=eyeHighlight; ctx.fillRect(8,BIG?3:4,1,1);
  }
  // Nose
  ctx.fillStyle='#cc9966'; ctx.fillRect(8,BIG?5:6,2,1);
  // Mustache
  ctx.fillStyle='#7a3510'; ctx.fillRect(4,BIG?6:7,7,2);
  // 😢 死亡時：悲しい顔（×目・口下がり）
  if(p.dead){
    // × 目（赤）
    ctx.fillStyle='#ff2222';
    ctx.fillRect(5,BIG?3:4,1,1); ctx.fillRect(7,BIG?5:6,1,1); // \
    ctx.fillRect(5,BIG?5:6,1,1); ctx.fillRect(7,BIG?3:4,1,1); // /
    ctx.fillRect(9,BIG?3:4,1,1); ctx.fillRect(11,BIG?5:6,1,1);
    ctx.fillRect(9,BIG?5:6,1,1); ctx.fillRect(11,BIG?3:4,1,1);
    // 悲しい口（への字）
    ctx.fillStyle='#7a3510';
    ctx.fillRect(4,BIG?8:9,1,1); ctx.fillRect(5,BIG?7:8,4,1); ctx.fillRect(9,BIG?8:9,1,1);
  }
  // Arms
  const armY=BIG?7:6;
  if(rf===1){ ctx.fillStyle='#ffcc88'; ctx.fillRect(-2,armY+2,3,4); ctx.fillRect(12,armY,3,4); }
  else if(rf===2){ ctx.fillStyle='#ffcc88'; ctx.fillRect(-2,armY,3,4); ctx.fillRect(12,armY+2,3,4); }
  else { ctx.fillStyle='#ffcc88'; ctx.fillRect(-2,armY+2,3,4); ctx.fillRect(12,armY+2,3,4); }
  ctx.restore();

  // 💀 死亡演出：魂が上昇するエフェクト
  if(p.dead && p.deadT>0){
    const maxT=120;
    const prog=1-p.deadT/maxT; // 0→1
    const soulRise=prog*55;
    const soulAlpha=prog<0.15 ? prog/0.15 : p.deadT<30 ? p.deadT/30 : 1;
    const sx=Math.round(p.x-camX+shakeX);
    const sy=Math.round(p.y-camY+shakeY)-soulRise;
    const wave=Math.sin(tick*0.25)*3;
    ctx.save();
    ctx.globalAlpha=soulAlpha*0.82;
    // 魂の体（白い半透明シルエット）
    ctx.fillStyle='#e8f0ff';
    ctx.fillRect(sx+2,sy,8,7);       // 頭
    ctx.fillRect(sx+1,sy+6,10,8);    // 体
    // 波打つ裾
    ctx.fillRect(sx,sy+13+wave|0,3,3);
    ctx.fillRect(sx+4,sy+13-wave|0,4,3);
    ctx.fillRect(sx+9,sy+13+wave|0,3,3);
    // 魂の目（小さな黒点）
    ctx.fillStyle='rgba(30,30,80,0.7)';
    ctx.fillRect(sx+3,sy+2,2,2);
    ctx.fillRect(sx+7,sy+2,2,2);
    // 悲しい口
    ctx.fillRect(sx+3,sy+6,1,1); ctx.fillRect(sx+4,sy+5,4,1); ctx.fillRect(sx+8,sy+6,1,1);
    // 輝くオーラ（点滅）
    if(Math.floor(tick/6)%2){
      ctx.globalAlpha=soulAlpha*0.25;
      ctx.fillStyle='#aabbff';
      ctx.fillRect(sx-2,sy-2,16,20);
    }
    ctx.restore();
    // 魂パーティクル（8フレームごと）
    if(tick%8===0 && prog>0.15){
      parts.push({x:p.x+p.w/2+(Math.random()-.5)*8,y:p.y-soulRise+Math.random()*8,
        vx:(Math.random()-.5)*0.8,vy:-0.8-Math.random()*0.5,
        life:22,col:'#ccdcff',sz:2});
    }
  }

  // ── ハンマーアイコン：頭上に表示 ──
  if(p.hammerT>0){
    const hsx=Math.round(p.x-camX+shakeX), hsy=Math.round(p.y-camY+shakeY);
    const pulse=Math.floor(tick/8)%2;
    ctx.font=`${pulse?9:8}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // 影
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillText('🔨',hsx+p.w/2+1,hsy-7+1);
    // 本体
    ctx.fillText('🔨',hsx+p.w/2,hsy-7);
  }

  // 持ち上げ中の敵を頭の上に描く（氷ブロック状態）
  if(p.carrying){
    const e=p.carrying;
    const esx=Math.round(e.x-camX+shakeX), esy=Math.round(e.y-camY+shakeY);
    ctx.fillStyle='#aaddff'; ctx.fillRect(esx,esy,e.w,e.h);
    ctx.fillStyle='rgba(180,230,255,.75)'; ctx.fillRect(esx+1,esy+1,e.w-2,e.h-2);
    ctx.fillStyle='#fff'; ctx.fillRect(esx+2,esy+2,4,3); ctx.fillRect(esx+8,esy+2,4,3);
    ctx.strokeStyle='#66bbff'; ctx.lineWidth=1; ctx.strokeRect(esx,esy,e.w,e.h);
  }
}

// Enemy (mini crab)
function drawEnemy(e){
  if(e.fireType){
    // 火炎カニ：赤橙の配色
    const sx=Math.round(e.x-camX+shakeX), sy=Math.round(e.y-camY+shakeY);
    const bob=Math.sin(e.animT*.18)*1.2;
    const fc=Math.floor(e.animT/6)%2?'#cc2200':'#ff4400';
    ctx.fillStyle=fc; ctx.fillRect(sx+1,sy+bob,e.w-2,e.h-3);
    ctx.fillStyle='#ff8800'; ctx.fillRect(sx+3,sy+3+bob,e.w-6,3);
    // 炎エフェクト（頭上）
    ctx.fillStyle=`rgba(255,${100+Math.floor(Math.sin(e.animT*.3)*60)},0,.7)`;
    ctx.fillRect(sx+4,sy-3+bob,2,3); ctx.fillRect(sx+8,sy-4+bob,2,4); ctx.fillRect(sx+12,sy-2+bob,2,2);
    // 脚
    ctx.fillStyle='#aa1100';
    for(let i=0;i<3;i++) ctx.fillRect(sx+3+i*3,sy+e.h-2+bob+Math.sin(e.animT*.2+i)*1.5,2,3);
    // 目
    ctx.fillStyle='#ffcc00'; ctx.fillRect(sx+2,sy+1+bob,3,2); ctx.fillRect(sx+e.w-5,sy+1+bob,3,2);
    ctx.fillStyle='#000'; ctx.fillRect(sx+3,sy+1+bob,1,1); ctx.fillRect(sx+e.w-4,sy+1+bob,1,1);
    return;
  }
  if(!e.alive) return;
  if(e.carried) return; // 持ち上げ中はdrawPlayerで描画
  const sx=Math.round(e.x-camX+shakeX), sy=Math.round(e.y-camY+shakeY);

  // 凍結中：氷ブロック風レンダリング
  if(e.frozen>0){
    const blink=e.frozen<60&&Math.floor(e.frozen/4)%2;
    if(!blink){
      ctx.fillStyle='#aaddff'; ctx.fillRect(sx,sy,e.w,e.h);
      ctx.fillStyle='rgba(180,230,255,.7)'; ctx.fillRect(sx+1,sy+1,e.w-2,e.h-2);
      ctx.fillStyle='#ffffff'; ctx.fillRect(sx+2,sy+2,4,3); ctx.fillRect(sx+8,sy+2,4,3);
      ctx.strokeStyle='#66bbff'; ctx.lineWidth=1; ctx.strokeRect(sx,sy,e.w,e.h);
      // 氷の中のカニがうっすら見える
      ctx.globalAlpha=.4; ctx.fillStyle='#dd3300'; ctx.fillRect(sx+2,sy+3,e.w-4,e.h-5); ctx.globalAlpha=1;
    }
    return;
  }

  if(e.stomp>0){
    ctx.fillStyle='#aa2200'; ctx.fillRect(sx,sy+e.h-4,e.w,4);
    ctx.fillStyle='#ff6644'; ctx.fillRect(sx+2,sy+e.h-3,e.w-4,2); return;
  }
  const la=Math.sin(e.animT*.18)*2.5;
  // Claws
  ctx.fillStyle='#aa2200';
  ctx.fillRect(sx-4,sy+3+la,5,5); ctx.fillRect(sx-5,sy+2+la,3,2);
  ctx.fillRect(sx+e.w-1,sy+3-la,5,5); ctx.fillRect(sx+e.w+2,sy+2-la,3,2);
  // Body
  ctx.fillStyle='#dd3300'; ctx.fillRect(sx+1,sy+2,e.w-2,e.h-4);
  ctx.fillStyle='#ee5533'; ctx.fillRect(sx+2,sy+3,e.w-4,3);
  ctx.fillStyle='#ff8866'; ctx.fillRect(sx+3,sy+4,3,2); ctx.fillRect(sx+8,sy+4,3,2);
  // Legs
  ctx.fillStyle='#aa1100';
  for(let i=0;i<3;i++) ctx.fillRect(sx+3+i*3,sy+e.h-2+Math.sin(e.animT*.2+i)*1.5,2,3);
  // Eyes
  ctx.fillStyle='#000'; ctx.fillRect(sx+3,sy+1,2,2); ctx.fillRect(sx+e.w-5,sy+1,2,2);
  ctx.fillStyle='#fff'; ctx.fillRect(sx+4,sy+1,1,1); ctx.fillRect(sx+e.w-4,sy+1,1,1);
}

// Item sprites
function drawItem(it){
  const sx=Math.round(it.x-camX+shakeX), sy=Math.round(it.y-camY+shakeY);
  const b=Math.sin(it.animT*.09)*2;
  if(it.type==='mushroom'){
    ctx.fillStyle='#cc2200'; ctx.fillRect(sx+1,sy-2+b,12,8); ctx.fillRect(sx+3,sy-5+b,8,4);
    ctx.fillStyle='#ff8888'; ctx.fillRect(sx+3,sy-4+b,2,2); ctx.fillRect(sx+9,sy-4+b,2,2); ctx.fillRect(sx+6,sy-2+b,2,2);
    ctx.fillStyle='#ffddaa'; ctx.fillRect(sx+2,sy+5+b,10,7);
    ctx.fillStyle='#fff';    ctx.fillRect(sx+3,sy+6+b,3,2); ctx.fillRect(sx+8,sy+6+b,3,2);
    ctx.fillStyle='#000';    ctx.fillRect(sx+4,sy+6+b,2,2); ctx.fillRect(sx+8,sy+6+b,2,2);
  } else if(it.type==='star'){
    ctx.fillStyle='#ffd700';
    ctx.fillRect(sx+4,sy+b,6,12); ctx.fillRect(sx,sy+3+b,14,5);
    ctx.fillRect(sx+2,sy+1+b,2,3); ctx.fillRect(sx+10,sy+1+b,2,3);
    ctx.fillRect(sx+2,sy+8+b,2,3); ctx.fillRect(sx+10,sy+8+b,2,3);
    ctx.fillStyle='#ffee44'; ctx.fillRect(sx+5,sy+1+b,4,2);
    ctx.fillStyle='#000'; ctx.fillRect(sx+4,sy+5+b,2,2); ctx.fillRect(sx+8,sy+5+b,2,2);
    ctx.fillStyle='#fff'; ctx.fillRect(sx+5,sy+5+b,1,1); ctx.fillRect(sx+9,sy+5+b,1,1);
  } else if(it.type==='flower'){
    // 茎
    ctx.fillStyle='#22aa22'; ctx.fillRect(sx+6,sy+7+b,2,7);
    // 葉っぱ
    ctx.fillStyle='#33cc33'; ctx.fillRect(sx+3,sy+10+b,3,2); ctx.fillRect(sx+8,sy+11+b,3,2);
    // 花びら（5枚）
    const fc=Math.floor(it.animT/6)%2?'#ff4400':'#ff8800';
    ctx.fillStyle=fc;
    ctx.fillRect(sx+5,sy-2+b,4,4);   // 上
    ctx.fillRect(sx+5,sy+9+b,4,4);   // 下（茎との継ぎ目）
    ctx.fillRect(sx+1,sy+2+b,4,4);   // 左上
    ctx.fillRect(sx+9,sy+2+b,4,4);   // 右上
    ctx.fillRect(sx+1,sy+6+b,4,4);   // 左下
    ctx.fillRect(sx+9,sy+6+b,4,4);   // 右下
    // 中心
    ctx.fillStyle='#ffee00'; ctx.fillRect(sx+4,sy+3+b,6,6);
    ctx.fillStyle='#fff';    ctx.fillRect(sx+5,sy+4+b,4,4);
    ctx.fillStyle='#ffaa00'; ctx.fillRect(sx+6,sy+5+b,2,2);
  } else if(it.type==='djump'){
    // 2段ジャンプ靴（緑ブーツ風）
    const db=Math.sin(it.animT*.09)*2;
    ctx.fillStyle='#22aa22'; ctx.fillRect(sx+2,sy+2+db,10,8);
    ctx.fillStyle='#44ff44'; ctx.fillRect(sx+3,sy+3+db,8,4);
    ctx.fillStyle='#88ff88'; ctx.fillRect(sx+4,sy+4+db,3,2);
    ctx.fillStyle='#11aa11'; ctx.fillRect(sx+1,sy+8+db,12,6);
    ctx.fillStyle='#fff'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
    ctx.fillText('2↑',sx+7,sy+13+db);
  } else if(it.type==='hammer'){
    // ハンマー
    const hb=Math.sin(it.animT*.09)*2;
    ctx.fillStyle='#8b4513'; ctx.fillRect(sx+5,sy+4+hb,4,10);
    ctx.fillStyle='#555'; ctx.fillRect(sx+1,sy+1+hb,12,6);
    ctx.fillStyle='#888'; ctx.fillRect(sx+2,sy+2+hb,10,3);
    ctx.fillStyle='#ccc'; ctx.fillRect(sx+3,sy+2+hb,3,2);
  } else if(it.type==='mini'){
    // ミニキノコ（ピンク色の小さいキノコ）
    ctx.fillStyle='#ff88cc'; ctx.fillRect(sx+2,sy+7,10,7);
    ctx.fillStyle='#ff44aa'; ctx.beginPath(); ctx.arc(sx+7,sy+7,7,Math.PI,0,false); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(sx+4,sy+4,3,3); ctx.fillRect(sx+9,sy+5,2,2);
    ctx.fillStyle='#ff88cc'; ctx.fillRect(sx+5,sy+7,1,1);
  } else if(it.type==='magnet'){
    // 磁石アイテム（赤と青の蹄鉄型）
    ctx.fillStyle='#ff3333'; ctx.fillRect(sx+2,sy+3,4,8); ctx.fillRect(sx+2,sy+3,10,4);
    ctx.fillStyle='#3366ff'; ctx.fillRect(sx+8,sy+3,4,8);
    ctx.fillStyle='#ffcc00'; ctx.fillRect(sx+3,sy+11,3,3); ctx.fillRect(sx+8,sy+11,3,3);
    // スパーク
    if(it.animT%6<3){ ctx.fillStyle='#ffff44'; ctx.fillRect(sx+6,sy,2,3); ctx.fillRect(sx+1,sy+5,3,2); ctx.fillRect(sx+10,sy+5,3,2); }
  } else if(it.type==='ice'){
    // 氷の結晶
    const ic=Math.floor(it.animT/5)%2;
    ctx.fillStyle=ic?'#88ddff':'#ffffff'; ctx.fillRect(sx+3,sy+b,8,14);
    ctx.fillStyle=ic?'#ffffff':'#aaddff'; ctx.fillRect(sx,sy+3+b,14,8);
    ctx.fillRect(sx+2,sy+1+b,10,2); ctx.fillRect(sx+2,sy+11+b,10,2);
    ctx.fillStyle='#66bbff'; ctx.fillRect(sx+6,sy+2+b,2,10); ctx.fillRect(sx+2,sy+6+b,10,2);
    ctx.fillStyle='#fff'; ctx.fillRect(sx+5,sy+5+b,4,4);
    ctx.fillStyle='#aaeeff'; ctx.fillRect(sx+6,sy+6+b,2,2);
  }
}

function drawFireball(fb){
  const sx=Math.round(fb.x-camX+shakeX), sy=Math.round(fb.y-camY+shakeY);
  const f=Math.floor(tick/3)%2;
  ctx.fillStyle=f?'#ff4400':'#ffcc00'; ctx.fillRect(sx,sy,fb.w,fb.h);
  ctx.fillStyle=f?'#ffee00':'#ff8800'; ctx.fillRect(sx+2,sy+2,4,4);
  ctx.fillStyle='#fff'; ctx.fillRect(sx+3,sy+3,2,2);
}
function drawIceball(ib){
  const sx=Math.round(ib.x-camX+shakeX), sy=Math.round(ib.y-camY+shakeY);
  const f=Math.floor(tick/4)%2;
  ctx.fillStyle=f?'#88ddff':'#ffffff'; ctx.fillRect(sx,sy,ib.w,ib.h);
  ctx.fillStyle=f?'#ffffff':'#44aaff'; ctx.fillRect(sx+2,sy+2,4,4);
  ctx.fillStyle='#aaeeff'; ctx.fillRect(sx+1,sy+1,2,2); ctx.fillRect(sx+5,sy+5,2,2);
}
function drawThrownEnemy(te){
  // 投げられた凍った敵（氷ブロック状態）
  const sx=Math.round(te.x-camX+shakeX), sy=Math.round(te.y-camY+shakeY);
  ctx.fillStyle='#aaddff'; ctx.fillRect(sx,sy,te.w,te.h);

// Boss (Big Red Crab)
function drawBoss(){
  const b=boss;
  // ── デスアニメーション（撃破後90フレームかけて上に飛んで消える） ──
  if(!b.alive){
    const t=b._deadTimer||0;
    if(t>0 && t<=90){
      const alpha=Math.max(0,1-t/90);
      const spin=t*.15;
      const fly=-t*1.3;  // 上へ直線的に飛ぶ
      const sx=Math.round((b._dieX||b.x)-camX+shakeX+b.w/2);
      const sy=Math.round((b._dieY||b.y)-camY+shakeY+b.h/2+fly);
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(sx,sy);
      ctx.rotate(spin);
      const sc=1+t*.005;
      ctx.scale(sc,sc);
      // 簡易ボディ
      ctx.fillStyle='#cc3300'; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.fillStyle='#ee5533'; ctx.fillRect(-b.w/2+4,-b.h/2+2,b.w-8,6);
      ctx.restore();
      // 爆発パーティクルを追加（20フレームごと）
      if(t%20===0){
        addParts((b._dieX||b.x)+Math.random()*b.w,
                 (b._dieY||b.y)+Math.random()*b.h,
                 ['#ff4400','#ffd700','#ff8800'][Math.floor(Math.random()*3)],8);
      }
    }
    return;
  }
  const sx=Math.round(b.x-camX+shakeX), sy=Math.round(b.y-camY+shakeY);
  // HPによる段階カラー
  const hpR=b.hp/b.maxHp;
  const phase=b._phase||1;
  const rage=phase>=3;
  const flash=b.hitT>0 && Math.floor(b.hitT/5)%2;
  // フェーズ2+: 発光グロー
  if(phase>=2 && !flash){
    const glowAlpha=phase>=3?(.18+Math.sin(tick*.14)*.1):(.08+Math.sin(tick*.1)*.04);
    ctx.shadowColor=phase>=3?'#ff3300':'#ff8800'; ctx.shadowBlur=phase>=3?22:12;
  }
  if(flash){ ctx.globalAlpha=.35; }

  // ── CLAWS (激怒で大きく揺れる) ──
  const caBase=rage?0.35:0.22;
  const ca=Math.sin(b.clawA)*(caBase+(phase>=4?.15:0));
  // Left claw arm
  ctx.save(); ctx.translate(sx-2,sy+b.h/2-4); ctx.rotate(-Math.PI/4-ca);
  drawBossClaw(rage,false); ctx.restore();
  // Right claw arm
  ctx.save(); ctx.translate(sx+b.w+2,sy+b.h/2-4); ctx.rotate(Math.PI/4+ca);
  drawBossClaw(rage,true); ctx.restore();

  // ── BODY ── (HPによる色変化)
  const aimGlow = (b._aimWarn||0)>0 && tick%5<3; // 泡予備動作フラッシュ
  const bc=aimGlow?'#ff6633':(phase>=4?'#ff0000':phase>=3?'#ff1500':phase>=2?'#e82800':'#cc3300');
  const bh=aimGlow?'#ff9955':(phase>=4?'#ff6644':phase>=3?'#ff4422':phase>=2?'#ff5522':'#ee5533');
  const bd=phase>=4?'#aa0000':phase>=3?'#990000':phase>=2?'#aa1100':'#aa2200';
  // フェーズ2+ でシェル上に汗/泡ドット
  if(phase>=2 && tick%4<2){
    ctx.fillStyle=`rgba(150,200,255,${.25+phase*.08})`;
    ctx.fillRect(sx+5,sy+14,2,2); ctx.fillRect(sx+b.w-8,sy+20,2,2);
    if(phase>=3){ ctx.fillRect(sx+12,sy+18,2,2); ctx.fillRect(sx+b.w/2,sy+28,2,2); }
  }
  // Main oval
  ctx.fillStyle=bc; ctx.fillRect(sx+3,sy+10,b.w-6,b.h-10);
  ctx.fillRect(sx+7,sy+5,b.w-14,8); ctx.fillRect(sx+12,sy+2,b.w-24,5);
  // Highlights
  ctx.fillStyle=bh; ctx.fillRect(sx+7,sy+11,b.w-14,5);
  ctx.fillStyle=rage?'#ff7755':'#ff6644'; ctx.fillRect(sx+10,sy+12,b.w-20,3);
  // Shell ridges
  ctx.fillStyle=bd;
  ctx.fillRect(sx+3,sy+18,b.w-6,1); ctx.fillRect(sx+3,sy+24,b.w-6,1); ctx.fillRect(sx+3,sy+30,b.w-6,1);
  // Shell segment lines (vertical)
  ctx.fillRect(sx+b.w/2,sy+10,1,b.h-10);

  // ── EYES (3 stalks) ──
  [-16,0,16].forEach((ex,i)=>{
    const ew=Math.sin(b.eyeA+i*1.3)*.9;
    const ecx=sx+b.w/2+ex;
    ctx.fillStyle=bd; ctx.fillRect(ecx-1,sy-7+ew,3,10);
    const eyeCol=phase>=4?`hsl(${tick*8%60},100%,60%)`:phase>=3?'#ff4400':phase>=2?'#ff7700':'#ff5533';
    ctx.fillStyle=eyeCol; ctx.fillRect(ecx-5,sy-15+ew,10,10);
    ctx.fillStyle='#fff'; ctx.fillRect(ecx-4,sy-14+ew,8,6);
    const pd=player.x>b.x?1:-1;
    ctx.fillStyle='#000'; ctx.fillRect(ecx-1+pd,sy-12+ew,3,4);
    ctx.fillStyle='#fff'; ctx.fillRect(ecx+pd,sy-12+ew,1,1);
    // Eyelid top
    ctx.fillStyle=rage?'#ff8800':'#ff5533'; ctx.fillRect(ecx-5,sy-15+ew,10,3);
  });

  // ── LEGS ──
  ctx.fillStyle=bd;
  for(let i=0;i<4;i++){
    const lx=sx+8+i*(b.w-16)/3;
    const lw=Math.sin(b.clawA+i*.7)*2.5;
    ctx.fillRect(lx,sy+b.h-2+lw,4,6); ctx.fillRect(lx-2,sy+b.h+3+lw,7,3);
  }

  // ── HP BAR ──
  ctx.globalAlpha=1;
  ctx.fillStyle='#330';
  ctx.fillRect(sx-4,sy-24,b.w+8,8);
  ctx.fillStyle=phase>=4?`hsl(${tick*10%60+0},100%,50%)`:phase>=3?'#ff1100':phase>=2?'#ff6600':'#ff4400';
  ctx.fillRect(sx-4,sy-24,Math.round((b.w+8)*b.hp/b.maxHp),8);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1;
  ctx.strokeRect(sx-4,sy-24,b.w+8,8);
  ctx.fillStyle='#fff'; ctx.font='bold 5px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('KING CRAB',sx+b.w/2,sy-20);
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
}

function drawBossClaw(rage,right){

function drawPhotoOverlay(){
  if(!unusedPhotoOverlay || unusedPhotoOverlay.timer<=0) return;
  const t=unusedPhotoOverlay.timer;
  unusedPhotoOverlay.timer--;

  // フラッシュ（最初の8フレーム）
  if(t>82){
    ctx.fillStyle=`rgba(255,255,255,${(t-82)/8})`;
    ctx.fillRect(0,0,W,H);
  }

  // フェードアウト（残り20フレーム）
  const alpha = t<20 ? t/20 : 1;
  // ポップイン（最初の10フレームで拡大）
  const sc = t>80 ? 0.4+(1-((t-80)/10))*0.6 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H/2);
  ctx.rotate(unusedPhotoOverlay.rot);
  ctx.scale(sc, sc);

  const pw=170, ph=135, fr=10, bot=24;
  // ポラロイドフレーム
  ctx.fillStyle='#fffef5';
  ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=14;
  ctx.fillRect(-pw/2-fr,-ph/2-fr,pw+fr*2,ph+fr*2+bot);
  ctx.shadowBlur=0;
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  if(unusedPhotoOverlay.img){
    ctx.beginPath(); ctx.rect(-pw/2,-ph/2,pw,ph); ctx.clip();
    const im=unusedPhotoOverlay.img;
    const ir=im.width/im.height, pr=pw/ph;
    let dw=pw,dh=ph,dx=-pw/2,dy=-ph/2;
    if(ir>pr){ dh=ph; dw=ph*ir; dx=-dw/2; }
    else      { dw=pw; dh=pw/ir; dy=-dh/2; }
    ctx.drawImage(im,dx,dy,dw,dh);
  } else {
    ctx.fillStyle='#ddd'; ctx.fillRect(-pw/2,-ph/2,pw,ph);
  }
  ctx.restore();

  ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=1;
  ctx.strokeRect(-pw/2,-ph/2,pw,ph);

  // 下部テキスト
  ctx.fillStyle='#cc0077'; ctx.font='bold 7px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const pidx=loadedPhotos.indexOf(unusedPhotoOverlay.img)+1;
  ctx.fillText(`📷 かぞくのおもいで！ [${pidx}/${loadedPhotos.length}]  ❤️+1`,0,ph/2+bot/2);

  ctx.restore();
}

// ── 左上コレクションサムネイル ──────────────────────────
function drawPhotoCollection(){
  if(unusedPhotoCollection.length===0) return;
  const TW=22, TH=16, GAP=2, OX=2, OY=17;
  // 背景パネル
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.fillRect(OX-1,OY-1,unusedPhotoCollection.length*(TW+GAP)-GAP+2,TH+2);
  ctx.imageSmoothingEnabled=true;
  unusedPhotoCollection.forEach((img,i)=>{
    const tx=OX+i*(TW+GAP), ty=OY;
    // サムネイル描画
    ctx.save();
    ctx.beginPath(); ctx.rect(tx,ty,TW,TH); ctx.clip();
    const ir=img.width/img.height, pr=TW/TH;
    let dw=TW,dh=TH,dx=tx,dy=ty;
    if(ir>pr){ dh=TH; dw=TH*ir; dx=tx-(dw-TW)/2; }
    else      { dw=TW; dh=TW/ir; dy=ty-(dh-TH)/2; }
    ctx.drawImage(img,dx,dy,dw,dh);
    ctx.restore();
    // 金枠
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=1;
    ctx.strokeRect(tx,ty,TW,TH);
  });
  ctx.imageSmoothingEnabled=false;
  // ヒント（最初の1枚取った直後だけ少し表示）
  // ロード済み枚数表示（デバッグ兼ね）
  ctx.fillStyle='rgba(255,220,240,.85)'; ctx.font='5px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`${unusedPhotoCollection.length}/${loadedPhotos.length}枚`, OX, OY+TH+2);
  if(unusedPhotoCollection.length===1 && tick%120<60){
    ctx.fillStyle='rgba(255,200,220,.9)';
    ctx.fillText('↑クリックで見れる', OX+30, OY+TH+2);
  }
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,W,15);
  // Hearts（最大5個）
  const maxH=Math.max(3,player.hp);
  for(let i=0;i<maxH;i++){
    ctx.fillStyle=i<player.hp?'#ff4444':'#441111';
    ctx.fillRect(4+i*13,3,10,9);
    ctx.fillStyle=i<player.hp?'#ff8888':'#220000';
    ctx.fillRect(5+i*13,3,3,4); ctx.fillRect(10+i*13,3,3,4);
    ctx.fillRect(4+i*13,6,10,4); ctx.fillRect(5+i*13,10,8,2);
  }
  // Coins
  ctx.fillStyle='#ffd700'; ctx.fillRect(47,4,8,10);
  ctx.fillStyle='#ffee44'; ctx.fillRect(48,4,3,9);
  ctx.fillStyle='#c8a000'; ctx.fillRect(52,5,3,8);
  ctx.fillStyle='#fff'; ctx.font='bold 7px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(`×${player.coins}`,58,7);
  // Fire icon（フラワーパワー中）
  if(player.fire){
    const ff=Math.floor(tick/4)%2;
    ctx.fillStyle=ff?'#ff4400':'#ffcc00'; ctx.fillRect(75,3,8,10);
    ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='left';
    ctx.fillText('Z:🔥',84,8);
  }
  // Ice count
  if(player.iceReady>0){
    ctx.fillStyle='#88ddff'; ctx.fillRect(player.fire?116:75,3,8,10);
    ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='left';
    ctx.fillText(`X:❄×${player.iceReady}`,player.fire?125:84,8);
  }
  // Score
  ctx.textAlign='center';
  ctx.fillText(player.score,W/2,7);
  // Progress
  ctx.fillStyle='#555'; ctx.fillRect(W-50,4,46,5);
  ctx.fillStyle='#4488ff'; ctx.fillRect(W-50,4,Math.round(46*Math.min(1,player.x/(LW*T-W))),5);
  // ── ハンマー残時間バー（大型・秒数付き） ──
  if(player.hammerT>0){
    const barW=80, barH=8;
    const bx=W/2-barW/2, by=H-14;
    const hw=Math.round(barW*player.hammerT/400);
    const hpulse=Math.floor(player.hammerT/6)%2;
    const isLow=player.hammerT<60;

    // 背景
    ctx.fillStyle='rgba(0,0,0,.65)';
    ctx.fillRect(bx-2,by-2,barW+4,barH+4);
    // バー本体
    ctx.fillStyle=isLow?(hpulse?'#ff2200':'#ff6600'):(hpulse?'#ffee00':'#ff8800');
    ctx.fillRect(bx,by,hw,barH);
    // 枠線
    ctx.strokeStyle=isLow?'#ff4444':'#ffcc00';
    ctx.lineWidth=1; ctx.strokeRect(bx,by,barW,barH);

    // 🔨ラベル＋残り秒数
    const secLeft=Math.ceil(player.hammerT/60);
    ctx.font='bold 7px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillText(`🔨 HAMMER ${secLeft}s`,W/2+1,by+barH/2+1);
    ctx.fillStyle=isLow?'#ff8888':'#ffee88';
    ctx.fillText(`🔨 HAMMER ${secLeft}s`,W/2,by+barH/2);

    // 残り少ないとき「まもなく終了」警告
    if(isLow && hpulse){
      ctx.font='6px monospace'; ctx.fillStyle='#ff4444';
      ctx.fillText('もうすぐ終わるよ！',W/2,by-7);
    }
  }
  // ダブルジャンプ所持アイコン
  if(player.djump){
    ctx.fillStyle='#88ff44'; ctx.font='bold 6px monospace'; ctx.textAlign='left';
    const dx=player.fire?116:player.iceReady>0?116:75;
    ctx.fillText('2↑',dx,8);
  }

  // Boss warning
  if(bossWarn>0 && Math.floor(bossWarn/8)%2===0){
    ctx.fillStyle='rgba(200,0,0,.75)'; ctx.fillRect(0,15,W,11);
    ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
    ctx.fillText('⚠  BOSS INCOMING! ふんで倒せ！  ⚠',W/2,21);
  }
}

function drawFullClear(){
  fullClearT = Math.max(0, fullClearT-1);
  const t = fullClearT; // 420→0
  const elapsed = 420-t; // 0→420

  // ── 背景：宇宙から徐々に明るく ──
  const bgBright = Math.min(1, elapsed/120);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,`rgba(5,0,30,1)`);
  grad.addColorStop(1,`rgba(20,0,60,1)`);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // 星フィールド
  ctx.fillStyle=`rgba(255,255,255,${0.3+bgBright*.4})`;
  for(let i=0;i<40;i++){
    const sx=((i*137+elapsed*.3)%(W+20))%W;
    const sy=(i*73)%H;
    ctx.fillRect(sx,sy,i%5===0?2:1,i%5===0?2:1);
  }

  // 花火（elapsed>180から）
  if(elapsed>180 && tick%14===0){
    const fx=30+Math.random()*(W-60);
    const fy=15+Math.random()*(H*.55);
    const cols=['#ffd700','#ff44aa','#44ffff','#ff8800','#cc88ff','#88ff44'];
    const c=cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<18;i++){
      const a=i/18*Math.PI*2;
      parts.push({x:fx+camX,y:fy+camY,
        vx:Math.cos(a)*(2.5+Math.random()*1.5),
        vy:Math.sin(a)*(2.5+Math.random()*1.5),
        life:55+Math.random()*25,col:c,sz:2+Math.random()*2});
    }
  }

  ctx.textAlign='center'; ctx.textBaseline='middle';

  // ── ステージバッジ 1〜4（順番に登場）──
  const stageLabels=[
    {name:'STAGE  1  CLEAR',col:'#88ff88',icon:'🏖️'},
    {name:'STAGE  2  CLEAR',col:'#88aaff',icon:'🌤️'},
    {name:'STAGE  3  CLEAR',col:'#ff9944',icon:'🌋'},
    {name:'STAGE  4  CLEAR',col:'#cc88ff',icon:'💀'},
  ];
  const stageStartFrames=[30,90,150,210];
  stageLabels.forEach((s,i)=>{
    const start=stageStartFrames[i];
    if(elapsed<start) return;
    const prog=Math.min(1,(elapsed-start)/40);
    const slideX = i%2===0
      ? (1-prog)*(-W*.6)     // 左から
      : (1-prog)*(W*.6);     // 右から
    const y=50+i*30;
    ctx.save();
    ctx.globalAlpha=prog;
    ctx.translate(slideX,0);
    // バッジ背景
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(18,y-11,W-36,22);
    ctx.strokeStyle=s.col; ctx.lineWidth=1.2;
    ctx.strokeRect(18,y-11,W-36,22);
    // テキスト
    ctx.font='bold 10px monospace';
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.fillText(s.icon+' '+s.name+' ✅',W/2+1,y+1);
    ctx.fillStyle=s.col;
    ctx.fillText(s.icon+' '+s.name+' ✅',W/2,y);
    ctx.restore();
  });

  // ── FULL CLEAR!! 大文字（elapsed>270）──
  if(elapsed>270){
    const fcProg=Math.min(1,(elapsed-270)/50);
    const fcScale=fcProg<0.2?fcProg/0.2*1.1:fcProg<0.35?1.1-(fcProg-0.2)/.15*.1:1.0;
    const rainbow=`hsl(${tick*4%360},100%,62%)`;
    ctx.save();
    ctx.globalAlpha=Math.min(1,fcProg*2);
    ctx.translate(W/2,H*.70);
    ctx.scale(fcScale,fcScale);
    // 光彩
    ctx.shadowColor=rainbow; ctx.shadowBlur=18;
    ctx.font='bold 22px monospace';
    ctx.fillStyle='rgba(0,0,0,.9)';
    ctx.fillText('★ FULL CLEAR ★',2,2);
    ctx.fillStyle=rainbow;
    ctx.fillText('★ FULL CLEAR ★',0,0);
    ctx.shadowBlur=0;
    // サブ
    if(fcProg>0.6){
      ctx.font='bold 8px monospace';
      ctx.fillStyle='#ffffaa';
      ctx.fillText('ALL 4 STAGES COMPLETED!',0,20);
    }
    ctx.restore();
  }

  // ── タップ促し（elapsed>320）──
  if(elapsed>320){
    const tp=(elapsed-320)/100;
    const blink=Math.floor(tick/22)%2;
    ctx.globalAlpha=Math.min(1,tp)*( blink ? 0.9 : 0.4 );
    ctx.font='bold 7px monospace';
    ctx.fillStyle='#aaffaa'; ctx.textAlign='center';
    ctx.fillText('✨ タップで結果へ ✨',W/2,H-12);
    ctx.globalAlpha=1;
  }

  // タイムアップで自動的にwinへ
  if(t===0) gameState='win';
}
