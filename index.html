<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CRAB BOSS ADVENTURE v1.0 COMPLETE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
body { display:flex; justify-content:center; align-items:center; }
canvas {
  image-rendering:pixelated;
  display:block;
  width:min(100vw, 133.33vh);
  height:auto;
  max-height:100vh;
}
#touchControls {
  position:fixed;
  left:0;
  right:0;
  bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 18px;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}

#stickArea {
  width:118px;
  height:118px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.45);
  background:radial-gradient(circle, rgba(255,255,255,.18), rgba(0,0,0,.45));
  position:relative;
  pointer-events:auto;
  touch-action:none;
}

#stickKnob {
  width:52px;
  height:52px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.22);
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(255,255,255,.25);
}

#stickHint {
  position:absolute;
  left:0;
  right:0;
  top:8px;
  text-align:center;
  color:rgba(255,255,255,.55);
  font:bold 10px system-ui, sans-serif;
  pointer-events:none;
}

#touchControls .actions {
  display:grid;
  grid-template-columns:64px 78px;
  grid-template-rows:64px 64px;
  gap:10px;
  pointer-events:auto;
  align-items:center;
  justify-items:center;
}

#touchControls button {
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  background:rgba(0,0,0,.48);
  color:#fff;
  font:bold 18px system-ui, sans-serif;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}

#jumpBtn {
  grid-row:1 / span 2;
  grid-column:2;
  width:78px;
  height:78px;
  font-size:15px;
}

#fireBtn, #iceBtn {
  width:62px;
  height:62px;
  font-size:28px;
}

#fireBtn { grid-column:1; grid-row:1; }
#iceBtn  { grid-column:1; grid-row:2; }

@media (max-width:700px) and (orientation:portrait){
  canvas { width:100vw; height:auto; }
  #touchControls { padding:0 12px; bottom:calc(10px + env(safe-area-inset-bottom)); }
  #stickArea { width:104px; height:104px; }
  #stickKnob { width:46px; height:46px; }
  #touchControls .actions {
    grid-template-columns:58px 70px;
    grid-template-rows:58px 58px;
    gap:8px;
  }
  #jumpBtn { width:70px; height:70px; font-size:14px; }
  #fireBtn, #iceBtn { width:56px; height:56px; font-size:25px; }
}

/* ===== Final Upgrade UI ===== */
#touchControls {
  padding: 0 22px 4px 22px;
}

#stickArea {
  width: 132px;
  height: 132px;
  border: 4px solid rgba(255,255,255,.52);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), transparent 24%),
    radial-gradient(circle, rgba(90,90,90,.65), rgba(0,0,0,.55));
  box-shadow:
    inset 0 0 18px rgba(255,255,255,.15),
    0 0 18px rgba(0,0,0,.65);
}

#stickArea::before {
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:14px;
  height:14px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.32);
}

#stickKnob {
  width:58px;
  height:58px;
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.40), transparent 26%),
    radial-gradient(circle, rgba(35,35,35,.95), rgba(5,5,5,.88));
  border:3px solid rgba(255,255,255,.75);
  box-shadow:
    inset 0 0 10px rgba(255,255,255,.20),
    0 4px 14px rgba(0,0,0,.75);
}

#stickHint {
  top:9px;
  font-size:11px;
  letter-spacing:.8px;
  color:rgba(255,255,255,.62);
}

#touchControls .actions {
  grid-template-columns:72px 88px;
  grid-template-rows:72px 72px;
  gap:12px;
}

#touchControls button {
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,.25), transparent 25%),
    rgba(0,0,0,.56);
  transition: transform .04s ease, filter .04s ease;
}

#touchControls button:active {
  transform: scale(.94);
  filter: brightness(1.3);
}

#jumpBtn {
  width:88px;
  height:88px;
  font-size:16px;
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,.30), transparent 25%),
    rgba(40,80,180,.62);
}

#fireBtn {
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,.30), transparent 25%),
    rgba(180,45,15,.66);
}

#iceBtn {
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,.34), transparent 25%),
    rgba(20,120,190,.66);
}

#pauseBtn {
  position:fixed;
  top: calc(10px + env(safe-area-inset-top));
  right: 14px;
  z-index: 25;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.75);
  background: rgba(0,0,0,.52);
  color: #fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  box-shadow: 0 2px 10px rgba(0,0,0,.4);
  transition: transform .08s, filter .08s;
}
#pauseBtn:active { transform: scale(.92); filter: brightness(1.3); }

#startOverlay {
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-family:system-ui, sans-serif;
  text-align:center;
  pointer-events:auto;
  cursor:pointer;
}
#startOverlayInner {
  border:2px solid rgba(255,255,255,.75);
  border-radius:18px;
  padding:22px 28px;
  background:rgba(0,0,0,.72);
  box-shadow:0 0 30px rgba(255,255,255,.18);
}
#startOverlay h1 {
  font-size:28px;
  margin-bottom:8px;
}
#startOverlay p {
  font-size:15px;
  opacity:.9;
}
#startOverlay.hidden { display:none; }

@media (max-width:700px) and (orientation:portrait){
  #stickArea { width:138px; height:138px; }
  #stickKnob { width:62px; height:62px; }
  #touchControls .actions {
    grid-template-columns:66px 80px;
    grid-template-rows:66px 66px;
    gap:9px;
  }
  #jumpBtn { width:80px; height:80px; }
}


#tapStart {
  margin: 14px auto 12px auto;
  padding: 12px 18px;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,.9);
  background: rgba(255, 215, 0, .18);
  color: #ffef5a;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: .5px;
  animation: tapPulse 1.05s infinite;
  box-shadow: 0 0 18px rgba(255,215,0,.35);
}
@keyframes tapPulse {
  0% { transform: scale(1); opacity: .75; }
  50% { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); opacity: .75; }
}
#startOverlayInner {
  max-width: 92vw;
}
#startOverlayInner p {
  margin-top: 6px;
}


#stageSelectOverlay {
  position:fixed;
  inset:0;
  z-index:32;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.70);
  color:#fff;
  font-family:system-ui, sans-serif;
  text-align:center;
  pointer-events:auto;
}
#stageSelectInner {
  border:2px solid rgba(255,255,255,.85);
  border-radius:18px;
  padding:22px 24px;
  background:rgba(0,0,0,.78);
  box-shadow:0 0 30px rgba(255,255,255,.18);
  max-width:92vw;
}
.stageBtn {
  display:block;
  width:min(280px,80vw);
  margin:12px auto;
  padding:14px 16px;
  border-radius:14px;
  border:2px solid rgba(255,255,255,.82);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:18px;
  font-weight:900;
}
.stageBtn.stage2 {
  background:rgba(255,215,0,.20);
  color:#ffef5a;
  box-shadow:0 0 18px rgba(255,215,0,.28);
}
.stageBtn.locked {
  opacity:.40;
  cursor:not-allowed;
}
.stageBtn:disabled {
  opacity:.40;
  cursor:not-allowed;
}
.stageBtn.stage3 {
  background:rgba(255,80,0,.22);
  color:#ff9944;
  box-shadow:0 0 18px rgba(255,80,0,.28);
}
.stageBtn.stage4 {
  background:rgba(180,0,255,.22);
  color:#cc88ff;
  box-shadow:0 0 18px rgba(180,0,255,.28);
}

</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" aria-label="ポーズ">⏸</button>
<div id="startOverlay">
  <div id="startOverlayInner">
    <h1>🦀 CRAB BOSS</h1>
    <div id="tapStart">▶ ここをタップしてスタート</div>
    <p>画面中央をタップすると始まります</p>
    <p>🕹️ MOVE　JUMP　🔥くるくる　❄️こおり</p>
    <p style="line-height:1.7;text-align:left;display:inline-block;">
      🌊 <b>1面</b>：地上と水の冒険<br>
      🪶 <b>2面</b>：モモンガで空を飛べ<br>
      🌋 <b>3面</b>：氷で溶岩王を弱体化<br>
      ⭐ <b>4面</b>：すべての力で最終決戦
    </p>
  </div>
</div>

<div id="stageSelectOverlay">
  <div id="stageSelectInner">
    <h1>🦀 STAGE SELECT</h1>
    <p id="stageSelectDesc">クリアしたステージから選べます</p>
    <p style="font-size:11px;opacity:.75;margin:0 0 6px;">🌊1面 🪶2面 🌋3面 ⭐4面（最終）</p>
    <button id="stage1Btn" class="stageBtn">
      🌊 1面 <span id="s1badge"></span><br>
      <span style="font-size:11px;opacity:.8;">地上と水の冒険</span>
    </button>
    <button id="stage2Btn" class="stageBtn stage2">
      🪶 2面 <span id="s2badge"></span><br>
      <span style="font-size:11px;opacity:.8;">モモンガで空を飛べ</span>
    </button>
    <button id="stage3Btn" class="stageBtn stage3">
      🌋 3面 <span id="s3badge"></span><br>
      <span style="font-size:11px;opacity:.8;">氷で溶岩王を弱体化</span>
    </button>
    <button id="stage4Btn" class="stageBtn stage4">
      ⭐ 4面 <span id="s4badge"></span><br>
      <span style="font-size:11px;opacity:.8;">すべての力で最終決戦</span>
    </button>
    <p style="font-size:11px;opacity:.7;margin-top:6px;">ハートが全部なくなったら1面からやり直し</p>
  </div>
</div>

<div id="touchControls" aria-label="スマホ操作ボタン">
  <div id="stickArea" aria-label="移動スティック">
    <div id="stickHint">MOVE</div>
    <div id="stickKnob"></div>
  </div>
  <div class="actions">
    <button id="fireBtn" aria-label="ファイア">🔥</button>
    <button id="iceBtn" aria-label="こおり">❄️</button>
    <button id="jumpBtn" aria-label="ジャンプ">JUMP</button>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════════
//  CRAB BOSS ADVENTURE
//  横スクロールアクション  ラスボス: BIG RED CRAB
// ═══════════════════════════════════════════════════
const SCALE = 3;
const W = 320, H = 240;
const canvas = document.getElementById('c');
canvas.width  = W * SCALE;
canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
ctx.scale(SCALE, SCALE);
ctx.imageSmoothingEnabled = false;

const T  = 16;   // tile size px
const LW = 220;  // level width (tiles)
const LH = 15;   // level height (tiles)
const GR = 11;   // ground row

const GRAVITY = 0.46;
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const JUMP_V  = IS_TOUCH ? -7.0 : -8.5;
const RUN_SPD = 2.3;

// Tile IDs
const AIR=0,SOLID=1,BRICK=2,QBLK=3,COIN=4,PTOP=5,PBOT=6,BFLOOR=7,SPIKE=8,SPRING=9,DASHPAD=10,WATER=11;


// ── PIPE SPAWN SYSTEM ─────────────────────────────────────
const PIPE_DEFS = [
  {x: 52*T+8, pipeTopY: (GR-1)*T},   // パイプ1
  {x: 80*T+8, pipeTopY: (GR-2)*T},   // パイプ2
  {x:140*T+8, pipeTopY: (GR-1)*T},   // パイプ3
  {x:145*T+8, pipeTopY: (GR-2)*T},   // パイプ4
];
let pipeTimers=[], pipeWarn=[];
let geyserTimers=[]; // 3面溶岩火柱タイマー
const sndPipePop = ()=>{
  tone(180,.05,'square',.22);
  tone(280,.07,'square',.20,.05);
  tone(140,.12,'sawtooth',.28,.10);
};

// ── AUDIO ──────────────────────────────────────────
let AC=null;
function initAudio(){ 
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); 
  if(AC && AC.state==='suspended') AC.resume();
}
function tone(f,d=.1,type='square',vol=.18,delay=0){
  if(!AC) return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value=f; o.type=type;
    const t=AC.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
const sndJump    = ()=>{ tone(330,.08,'square',.2); tone(440,.08,'square',.18,.08); };
const sndCoin    = ()=>{ tone(1047,.06,'square',.2); tone(1319,.1,'square',.18,.06); };
const sndStomp   = ()=>{ tone(200,.12,'sawtooth',.25); };

// ── HAPTICS ───────────────────────────────────────
const vib = (p) => { try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };
const vibStomp   = ()=> vib(40);
const vibCoin    = ()=> vib(18);
const vibHurt    = ()=> vib([60,30,60]);
const vibDie     = ()=> vib([80,40,80,40,120]);
const vibBossHit = ()=> vib(55);
const vibWin     = ()=> vib([40,20,40,20,40,20,200]);
const sndBreak   = ()=>{ tone(180,.07,'sawtooth',.2); tone(120,.1,'sawtooth',.18,.07); };
const sndItem    = ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.08,'square',.22,i*.08)); };
const sndHurt    = ()=>{ tone(220,.15,'sawtooth',.3); tone(180,.15,'sawtooth',.25,.1); };
const sndBossHit = ()=>{ tone(150,.2,'sawtooth',.35); tone(100,.2,'sawtooth',.3,.15); };
const sndBubble = ()=>{ tone(900,.04,'sine',.10); tone(1200,.05,'sine',.08,.04); };
const sndShockWave = ()=>{ tone(90,.18,'sawtooth',.24); tone(55,.22,'sawtooth',.20,.08); };

const sndDie     = ()=>{ [440,330,220,110].forEach((f,i)=>tone(f,.1,'square',.25,i*.1)); };
const sndWin     = ()=>{ [523,659,784,523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.28,i*.12)); };
const sndQBlk      = ()=>{ tone(660,.06,'square',.18); tone(880,.08,'square',.18,.06); };
const sndShock     = ()=>{ tone(80,.25,'sawtooth',.3); };
const sndFireShoot = ()=>{ tone(1200,.04,'sawtooth',.14); tone(800,.06,'sawtooth',.12,.04); };
const sndFreeze    = ()=>{ tone(1600,.06,'square',.15); tone(1200,.08,'square',.13,.06); tone(900,.1,'square',.12,.13); };
const sndPickup    = ()=>{ tone(880,.05,'square',.2); tone(1100,.07,'square',.18,.05); };
const sndThrow     = ()=>{ tone(400,.08,'sawtooth',.22); };
const sndEnemyDie  = ()=>{
  // ヘンな効果音：ズシャーン
  tone(600,.04,'square',.2);
  tone(400,.05,'sawtooth',.22,.04);
  tone(200,.08,'sawtooth',.25,.08);
  tone(80,.1,'sawtooth',.2,.14);
};

// カメラシャッター音
const sndCamera = ()=>{
  tone(1800,.015,'square',.35);
  tone(400,.04,'sawtooth',.25,.015);
  tone(200,.06,'sawtooth',.15,.04);
};



const sndSpring = ()=>{ tone(300,.03,'square',.15); tone(600,.04,'square',.18,.03); tone(1000,.05,'square',.20,.07); tone(1500,.10,'square',.18,.11); };
const sndBarrel = ()=>{ tone(160,.07,'sawtooth',.22); tone(110,.05,'sawtooth',.18,.06); };
const sndHammer = ()=>{ tone(200,.05,'sawtooth',.32); tone(140,.09,'sawtooth',.28,.04); tone(80,.12,'sawtooth',.22,.10); };
const sndCape = ()=>{ tone(520,.05,'square',.18); tone(720,.06,'square',.16,.04); tone(980,.08,'square',.14,.10); };
const sndSpin = ()=>{ tone(700,.035,'square',.12); tone(500,.04,'sawtooth',.10,.035); };


function startBGM(){
  bgmOn=true;
}
function stopBGM(){
  bgmOn=false;
}
function updateBGM(){
  if(!AC || !bgmOn || gameState!=='play') return;
  bgmTimer--;
  if(bgmTimer>0) return;
  const melody=[262,330,392,523,392,330,294,349,440,587,440,349];
  const idx=Math.floor(tick/18)%melody.length;
  const f=melody[idx];
  tone(f,.08,'square',.035);
  if(idx%4===0) tone(f/2,.10,'triangle',.025,.02);
  bgmTimer=18;
}
function fmtTime(ms){
  if(!ms || ms<0) return '--:--';
  const s=Math.floor(ms/1000);
  const m=Math.floor(s/60);
  const r=s%60;
  const cs=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function saveProgress(){
  if(!player || gameState!=='play') return;
  const data={
    stage:currentStage,
    x:player.x, y:player.y, hp:player.hp, big:player.big, fire:player.fire,
    coins:player.coins, score:player.score, iceReady:player.iceReady, cape:player.cape, capeT:player.capeT,
    t:Date.now()
  };
  localStorage.setItem('crabSave',JSON.stringify(data));
}
function loadProgressIntoPlayer(){
  const data=JSON.parse(localStorage.getItem('crabSave')||'null');
  if(!data || !player) return;
  player.x=data.x||player.x;
  player.y=data.y||player.y;
  player.hp=data.hp||player.hp;
  player.big=!!data.big;
  player.fire=!!data.fire;
  player.coins=data.coins||0;
  player.score=data.score||0;
  player.iceReady=data.iceReady||0;
  player.cape=!!data.cape;
  player.capeT=data.capeT||0;
  if(data.stage===2){ player.cape=true; player.capeT=Math.max(player.capeT||0,900); }
}
function clearSavedProgress(){
  localStorage.removeItem('crabSave');
  savedProgress=null;
}
function hideStartOverlay(){
  const el=document.getElementById('startOverlay');
  if(el){
    el.classList.add('hidden');
    el.style.display='none';
    el.style.pointerEvents='none';
  }
}


// スマホ音声ロック解除：最初のタップでAudioContextを必ず復帰
function unlockAudioOnce(){
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
}
['touchstart','pointerdown','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, unlockAudioOnce, {passive:true});
});


function startGameFromUserAction(){
  initAudio();
  startBGM();
  hideStartOverlay();
  // ゲームオーバーまたはタイトルで、2面が解放済みなら必ずステージ選択を挟む
  if((gameState==='title' || gameState==='gameover') && stage2Unlocked){
    if(gameState==='gameover'){
      // ゲームオーバー後: セーブ消去してからステージ選択へ
      currentStage=1;
      clearSavedProgress();
      gameState='title';
    }
    showStageSelect();
    return;
  }
  if(gameState==='title' || gameState==='gameover'){
    resetGame();
    gameState='play';
  }
}


function setupStartOverlay(){
  const el=document.getElementById('startOverlay');
  if(!el) return;
  const start=(e)=>{
    if(e) e.preventDefault();
    startGameFromUserAction();
  };
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('pointerdown',start,{passive:false});
  el.addEventListener('click',start);
}


function showStageSelect(){
  // CLEARバッジを更新
  const b1b=document.getElementById('s1badge');
  const b2b=document.getElementById('s2badge');
  const b3b=document.getElementById('s3badge');
  const b4b=document.getElementById('s4badge');
  if(b1b) b1b.textContent = stage2Unlocked ? '✅ CLEAR' : '';
  if(b2b) b2b.textContent = stage3Unlocked ? '✅ CLEAR' : stage2Unlocked ? '' : '🔒';
  if(b3b) b3b.textContent = stage4Unlocked ? '✅ CLEAR' : stage3Unlocked ? '' : '🔒';
  if(b4b) b4b.textContent = stage4Unlocked ? '⭐ CLEAR' : '🔒';

  const el=document.getElementById('stageSelectOverlay');
  const b2=document.getElementById('stage2Btn');
  const b3=document.getElementById('stage3Btn');
  if(!el) return;
  stageSelectMode=true;
  el.style.display='flex';
  // ── textContent上書きをやめてclassとdisabledだけ更新 ──
  if(b2){
    if(stage2Unlocked){
      b2.classList.remove('locked'); b2.disabled=false;
    } else {
      b2.classList.add('locked'); b2.disabled=true;
    }
  }
  if(b3){
    if(stage3Unlocked){
      b3.style.display='block'; b3.classList.remove('locked'); b3.disabled=false;
    } else {
      b3.style.display='none';
    }
  }
  const b4=document.getElementById('stage4Btn');
  if(b4){
    if(stage4Unlocked){
      b4.style.display='block'; b4.classList.remove('locked'); b4.disabled=false;
    } else {
      b4.style.display='none';
    }
  }
}
function hideStageSelect(){
  const el=document.getElementById('stageSelectOverlay');
  if(el) el.style.display='none';
  stageSelectMode=false;
}
function startFromStage(stageNo){
  initAudio();
  if(stageNo===3) startBGM(); else startBGM(); // BGMは共通
  hideStartOverlay();
  hideStageSelect();

  // 明示的に選んだステージから開始する。
  // ここで古いセーブに引っ張られないように savedProgress を消す。
  clearSavedProgress();

  if(stageNo===4){
    if(!stage4Unlocked) return;
    currentStage=4;
    resetGame();
    if(typeof startStage4 === 'function') startStage4();
    gameState='play';
    return;
  }
  if(stageNo===3){
    if(!stage3Unlocked) return;
    currentStage=3;
    resetGame();
    if(typeof startStage3 === 'function') startStage3();
    gameState='play';
    return;
  }
  if(stageNo===2){
    if(!stage2Unlocked) return;
    currentStage=2;
    resetGame();
    if(typeof startStage2 === 'function'){
      startStage2();
    } else {
      player.x=48;
      player.y=0;
      player.cape=true;
      player.capeT=1200;
    }
  } else {
    currentStage=1;
    resetGame();
  }
  gameState='play';
}
function setupStageSelect(){
  const b1=document.getElementById('stage1Btn');
  const b2=document.getElementById('stage2Btn');
  const b3=document.getElementById('stage3Btn');
  if(b1) b1.addEventListener('click',e=>{e.preventDefault(); startFromStage(1);});
  if(b2) b2.addEventListener('click',e=>{e.preventDefault(); if(stage2Unlocked) startFromStage(2);});
  if(b3) b3.addEventListener('click',e=>{e.preventDefault(); if(stage3Unlocked) startFromStage(3);});
  const b4s=document.getElementById('stage4Btn');
  if(b4s) b4s.addEventListener('click',e=>{e.preventDefault(); if(stage4Unlocked) startFromStage(4);});
  if(b1) b1.addEventListener('touchstart',e=>{e.preventDefault(); startFromStage(1);},{passive:false});
  if(b2) b2.addEventListener('touchstart',e=>{e.preventDefault(); if(stage2Unlocked) startFromStage(2);},{passive:false});
  if(b3) b3.addEventListener('touchstart',e=>{e.preventDefault(); if(stage3Unlocked) startFromStage(3);},{passive:false});
  if(b4s) b4s.addEventListener('touchstart',e=>{e.preventDefault(); if(stage4Unlocked) startFromStage(4);},{passive:false});
}

let tiles = [];
function getTile(x,y){ if(x<0||x>=LW||y<0||y>=LH) return SOLID; return tiles[y*LW+x]; }
function setTile(x,y,id){ if(x>=0&&x<LW&&y>=0&&y<LH) tiles[y*LW+x]=id; }
function isSolid(id){ return id===SOLID||id===BRICK||id===QBLK||id===PTOP||id===PBOT||id===BFLOOR||id===SPRING; }

function fillRect(x,y,w,h,id){ for(let dy=0;dy<h;dy++) for(let dx=0;dx<w;dx++) setTile(x+dx,y+dy,id); }
function fillRow(y,x0,x1,id){ for(let x=x0;x<x1;x++) setTile(x,y,id); }

const RANK_KEY='crabRankings';
function loadRankings(){ return JSON.parse(localStorage.getItem(RANK_KEY)||'[]'); }
function saveRanking(name,score){
  const list=loadRankings();
  const entry={
    name:name.slice(0,6)||'???',
    score,
    time:clearTimeMs||0,
    date:new Date().toLocaleDateString('ja-JP'),
    current:true
  };
  list.push(entry);
  list.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    if((a.time||999999999)!==(b.time||999999999)) return (a.time||999999999)-(b.time||999999999);
    return 0;
  });
  const rank=list.indexOf(entry)+1;
  lastClearRank=rank;
  lastClearRankIn=rank>0 && rank<=5;
  list.forEach(r=>delete r.current);
  list.splice(5);
  localStorage.setItem(RANK_KEY,JSON.stringify(list));
  return rank;
}

// ── ボス撃破共通処理 ─────────────────────────────────────
function killBoss(pts){
  const b=boss; const p=player;
  hitStopT=22;
  b.alive=false; b._dieX=b.x; b._dieY=b.y;
  // ド派手爆発パーティクル
  addParts(b.x+b.w/2,b.y+b.h/2,'#ff4400',40);
  addParts(b.x+b.w/2,b.y+b.h/2,'#ffd700',35);
  addParts(b.x+b.w/2,b.y+b.h/2,'#ffffff',25);
  addParts(b.x+b.w/2,b.y+b.h/2,'#ff88ff',20);
  addParts(b.x+b.w/2,b.y+b.h/2,'#88ffff',15);
  // 周囲にも爆発
  for(let i=0;i<8;i++){
    const ang=i/8*Math.PI*2;
    const ox=Math.cos(ang)*b.w*.7, oy=Math.sin(ang)*b.h*.7;
    addParts(b.x+b.w/2+ox,b.y+b.h/2+oy,'#ff8800',8);
    addParts(b.x+b.w/2+ox,b.y+b.h/2+oy,'#ffd700',6);
  }
  spawnFloat(b.x+b.w/2,b.y-10,'+'+pts,'#ffee00');
  p.score+=pts; shakeX=20; shakeY=20;
  // 撃破SE（ファンファーレ）
  [262,330,392,523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.28,i*.10));
  // 実績チェック
  if(p.hammerT>0) unlockAchievement('hammerBoss');
  if(p.hp<=1) unlockAchievement('survivor');
  if(currentStage===4) unlockAchievement('allclear');
  if(currentStage===1 && _ach1NoDmg) unlockAchievement('nohurt1');
}

function calcRank(){
  const rs = player.score + player.coins*200
    + (clearTimeMs>0 ? Math.max(0, 60000-clearTimeMs) : 0);
  return rs>=80000?'S':rs>=55000?'A':rs>=35000?'B':rs>=15000?'C':'D';
}
function submitScore(){
  if(scoreSubmitted) return; 
  scoreSubmitted=true;
  lastClearScore=player.score;
  const name=prompt('なまえをにゅうりょく（6もじまで）','プレイヤー')||'???';
  saveRanking(name, player.score);
}
function drawRanking(ox,oy,bw){
  const list=loadRankings();
  const bh=14+Math.max(1,list.length)*11+4;
  ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(ox,oy,bw,bh);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1; ctx.strokeRect(ox,oy,bw,bh);
  ctx.fillStyle='#ffd700'; ctx.font='bold 6px monospace';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText('🏆  RANKING  🏆',ox+bw/2,oy+9);
  if(!list.length){
    ctx.fillStyle='#aaa'; ctx.font='6px monospace';
    ctx.fillText('まだきろくがありません',ox+bw/2,oy+20); return;
  }
  const medals=['🥇','🥈','🥉','4.','5.'];
  list.forEach((r,i)=>{

    ctx.fillStyle=['#ffd700','#dddddd','#e8a060','#cccccc','#cccccc'][i];

    ctx.fillText((r.time?fmtTime(r.time)+' ':'')+r.date,ox+bw-4,ry+7);

// ── MAP LOADER（データ駆動レベル読み込み） ────────────────
// 文字 → タイルID 変換テーブル
const MAP_CHARS = {
  '.':AIR, '#':SOLID, 'B':BRICK, '?':QBLK, 'C':COIN,
  'P':PTOP, 'p':PBOT, 'F':BFLOOR, 'X':SPIKE,
  'S':SPRING, 'D':DASHPAD, 'W':WATER,
};
// 逆引き（エディタ用）
const CHAR_FROM_TILE = {};
Object.entries(MAP_CHARS).forEach(([c,id])=>{ if(!(id in CHAR_FROM_TILE)) CHAR_FROM_TILE[id]=c; });
CHAR_FROM_TILE[AIR]='.';

/**
 * loadMap(rows)
 * 文字列配列からタイルグリッドを構築する。
 * rows[0] が y=0（一番上）、rows[rows.length-1] が最終行。
 * 行の長さが LW より短い場合は右を AIR で埋める。
 */
function loadMap(rows){
  tiles = new Uint8Array(LW*LH);
  rows.forEach((row, y)=>{
    if(y>=LH) return;
    for(let x=0;x<LW;x++){
      const ch = x<row.length ? row[x] : '.';
      tiles[y*LW+x] = MAP_CHARS[ch] ?? AIR;
    }
  });
}

/**
 * exportMap()
 * 現在のタイルグリッドを文字列配列として返す（エディタ連携用）
 */
function exportMap(){
  const rows=[];
  for(let y=0;y<LH;y++){
    let row='';
    for(let x=0;x<LW;x++) row+=CHAR_FROM_TILE[tiles[y*LW+x]]??'.';
    // 末尾の '.' を省略（コンパクト化）
    row=row.replace(/\.+$/,'');
    rows.push(row);
  }
  return rows;
}

function unlockAchievement(id){
  if(_achUnlocked.has(id)) return;
  _achUnlocked.add(id);
  localStorage.setItem(ACH_KEY, JSON.stringify([..._achUnlocked]));
  _achNotifQueue.push({id, timer:200}); // 200フレーム表示
  const ach=ACHIEVEMENTS.find(a=>a.id===id);
  if(ach) tone(880,.08,'square',.2,0), tone(1320,.12,'square',.18,.08), tone(1760,.20,'square',.15,.18);
}

function checkAchievements(){
  const p=player;
  if(!p || gameState!=='play') return;
  // コイン50枚
  if(_achSessionCoins>=50) unlockAchievement('coinmaster');
  // コンボ5
  if(p.combo>=5) unlockAchievement('combo5');
  // 踏み10体
  if(_achStompCount>=10) unlockAchievement('stomp10');
  // アイス5回
  if(_achIceHitCount>=5) unlockAchievement('icehit5');
  // 死亡7回
  if(_achDeathCount>=7) unlockAchievement('diehard');
}

function drawAchievementNotif(){
  if(_achNotifQueue.length===0) return;
  const notif=_achNotifQueue[0];
  notif.timer--;
  if(notif.timer<=0){ _achNotifQueue.shift(); return; }
  const ach=ACHIEVEMENTS.find(a=>a.id===notif.id);
  if(!ach) return;
  const alpha = notif.timer>170 ? (200-notif.timer)/30 :
                notif.timer<40  ? notif.timer/40 : 1;
  const slideY = notif.timer>170 ? (170-notif.timer)*1.2 : 0;
  ctx.save();
  ctx.globalAlpha=alpha;
  const bx=W/2-90, by=4+slideY;
  // 背景
  ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(bx,by,180,26);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.5; ctx.strokeRect(bx,by,180,26);
  // テキスト
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font='11px monospace';
  ctx.fillStyle='#ffd700'; ctx.fillText('🏅 実績解除！',bx+6,by+3);
  ctx.font='bold 10px monospace';
  ctx.fillStyle='#ffffff'; ctx.fillText(ach.icon+' '+ach.name,bx+6,by+14);
  ctx.restore();
}

// N64風スティック：左・右・下をアナログ感覚で入力
function setupVirtualStick(){
  const area=document.getElementById('stickArea');
  const knob=document.getElementById('stickKnob');
  if(!area||!knob) return;

  const resetStick=()=>{
    keys['ArrowLeft']=false;
    keys['ArrowRight']=false;
    keys['ArrowDown']=false;
    stickPowerX=0;
    knob.style.left='50%';
    knob.style.top='50%';
  };

  const moveStick=(clientX,clientY)=>{
    if(stageSelectMode) return;
    startGameFromUserAction();
    if(gameState==='title'||gameState==='gameover'){
      resetGame(); gameState='play';
    } else if(gameState==='win'){
      gameState='title';
    }

    const r=area.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    let dx=clientX-cx;
    let dy=clientY-cy;
    const max=r.width*0.32;
    const len=Math.hypot(dx,dy);
    if(len>max){
      dx=dx/len*max;
      dy=dy/len*max;
    }

    knob.style.left=`calc(50% + ${dx}px)`;
    knob.style.top =`calc(50% + ${dy}px)`;

    const threshold=max*0.35;
    keys['ArrowLeft']  = dx < -threshold;
    keys['ArrowRight'] = dx >  threshold;
    keys['ArrowDown']  = dy >  threshold;
    stickPowerX = Math.max(-1, Math.min(1, dx / max));
  };

  area.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    moveStick(t.clientX,t.clientY);
  },{passive:false});

  area.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    moveStick(t.clientX,t.clientY);
  },{passive:false});

  area.addEventListener('touchend',e=>{
    e.preventDefault();
    resetStick();
  },{passive:false});

  area.addEventListener('touchcancel',e=>{
    e.preventDefault();
    resetStick();
  },{passive:false});

  let mouseDown=false;
  area.addEventListener('mousedown',e=>{
    mouseDown=true;
    moveStick(e.clientX,e.clientY);
  });
  window.addEventListener('mousemove',e=>{
    if(mouseDown) moveStick(e.clientX,e.clientY);
  });
  window.addEventListener('mouseup',()=>{
    mouseDown=false;
    resetStick();
  });
}

// ── COLLISION ──────────────────────────────────────
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function movePlayer(){
  const p=player, ph=p.big?20:16; p.h=ph;
  p.x+=p.vx;
  // X collision
  const y0=Math.floor(p.y/T), y1=Math.floor((p.y+ph-1)/T);
  if(p.vx<0){
    const tx=Math.floor(p.x/T);
    if(isSolid(getTile(tx,y0))||isSolid(getTile(tx,y1))){ p.x=(tx+1)*T; p.vx=0; }
  }
  if(p.vx>0){
    const tx=Math.floor((p.x+p.w-1)/T);
    if(isSolid(getTile(tx,y0))||isSolid(getTile(tx,y1))){ p.x=tx*T-p.w; p.vx=0; }
  }
  p.y+=p.vy;
  p.onGround=false;
  const x0=Math.floor(p.x/T), x1=Math.floor((p.x+p.w-1)/T);
  // Fall
  if(p.vy>=0){
    const ty=Math.floor((p.y+ph)/T);
    const ta=getTile(x0,ty), tb=getTile(x1,ty);
    if(ta===SPIKE||tb===SPIKE){ hurtPlayer(); return; }
    if(isSolid(ta)||isSolid(tb)){
      p.y=ty*T-ph;
      if(ta===SPRING||tb===SPRING){
        p.vy=-15; p.djumpUsed=false;
        sndSpring(); shakeX=3; shakeY=2;
        addParts(p.x+p.w/2,p.y+ph,'#ffdd00',14);
        addParts(p.x+p.w/2,p.y+ph,'#ff8800',8);
        spawnFloat(p.x+p.w/2,p.y,'BOING!','#ffdd00');
      } else { p.vy=0; p.onGround=true; }
    }
  }
  // Rise
  // ミニ・磁石・コンボタイマー
  if(p.miniT>0){ p.miniT--; if(!p.miniT){ p.mini=false; p.w=p.big?14:12; p.h=p.big?22:16; } }
  if(p.magnetT>0){
    p.magnetT--;
    if(!p.magnetT) p.magnet=false;
    // コインアイテムを引き寄せる
    items.forEach(it=>{
      if(it.collected||it.type!=='coin') return;
      const dx=p.x+p.w/2-(it.x+7), dy=p.y+p.h/2-(it.y+7);
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){ it.x+=dx*.12; it.y+=dy*.12; }
    });
    // コインタイル: 半径内を自動回収
    const mx0=Math.floor((p.x-120)/T), mx1=Math.floor((p.x+120)/T);
    const my0=Math.floor((p.y-120)/T), my1=Math.floor((p.y+120)/T);
    for(let ty=my0;ty<=my1;ty++) for(let tx=mx0;tx<=mx1;tx++){
      if(getTile(tx,ty)===COIN){
        const k=`${tx},${ty}`;
        if(!coinsDone[k]){ coinsDone[k]=true; p.coins++; p.score+=100; _achSessionCoins++; addParts(tx*T+8,ty*T,'#ffd700',4); }
      }
    }
  }
  if(p.comboT>0){ p.comboT--; if(!p.comboT) p.combo=0; }
  // 水中泡エフェクト
  if(p.inWater){
    p.swimT=(p.swimT||0)+1;
    if(p.swimT%12===0){
      parts.push({x:p.x+4+Math.random()*8,y:p.y+4,vx:(Math.random()-.5)*.5,vy:-1,life:18,sz:2,col:'rgba(200,235,255,.75)'});
    }
  } else { p.swimT=0; }
  if(p.vy<0){
    const ty=Math.floor(p.y/T);
    const ta=getTile(x0,ty), tb=getTile(x1,ty);
    if(isSolid(ta)||isSolid(tb)){
      hitBlock(x0,ty); hitBlock(x1,ty);
      p.y=ty*T+T; p.vy=Math.max(0,p.vy);
    }
  }
  // Coin collect
  [[x0,Math.floor(p.y/T)],[x1,Math.floor(p.y/T)],
   [x0,Math.floor((p.y+ph-1)/T)],[x1,Math.floor((p.y+ph-1)/T)]].forEach(([tx,ty])=>{
    const k=`${tx},${ty}`;
    if(getTile(tx,ty)===COIN && !coinsDone[k]){
      coinsDone[k]=true; player.coins++; player.score+=100;
      spawnFloat(tx*T+8,(ty+.5)*T,'100','#ffd700');
      addParts(tx*T+8,ty*T+8,'#ffd700',4); sndCoin(); vibCoin();
    }
  });
  if(p.x<0) p.x=0;
  // 溝死亡：全部の溝で一貫してGR+4px落下でダメージ
  {
    const cx=Math.floor((p.x+p.w/2)/T);
    const footY=Math.floor((p.y+p.h-1)/T);
    const midY=Math.floor((p.y+p.h/2)/T);
    const inWaterNow=(getTile(cx,midY)===WATER || getTile(cx,footY)===WATER);

    // 水中はかなり深く沈むまで死亡扱いにしない。
    // 1面の水は「泳げる場所」として扱い、底まで沈んだらダメージ＋水面へ戻す。
    if(inWaterNow){
      const waterDangerY=(LH-1)*T - 6;  // 画面下ギリギリまで沈んだら危険
      if(p.y+p.h > waterDangerY && p.invT===0){
        hurtPlayer();
        p.x=Math.max(p.x-24, 55*T);
        p.y=(GR-2)*T;
        p.vy=-4;
        p.invT=90;
        spawnFloat(p.x+p.w/2,p.y-8,'深すぎる!','#9ee7ff');
        addParts(p.x+p.w/2,p.y+p.h/2,'#9ee7ff',18);
      }
    } else {
      // 空中ステージでは、画面下まで完全に落ちてからダメージにする
      const deathY = (LH * T) + 4;
      if(p.y > deathY){
        hurtPlayer();
      }
    }
  }
}

function hitBlock(tx,ty){
  const id=getTile(tx,ty);
  if(id===BRICK){
    if(player.big && !player.mini){
      brokenQ[`${tx},${ty}`]=true; setTile(tx,ty,AIR);
      addParts(tx*T+8,ty*T+8,'#c84b0a',8); player.score+=50; sndBreak();
    } else { shakeX=2; shakeY=2; sndHurt(); vibHurt(); }
  } else if(id===QBLK){
    const k=`${tx},${ty}`;
    if(!brokenQ[k]){
      brokenQ[k]=true; setTile(tx,ty,SOLID);
      spawnItem(tx,ty,getQItem(tx)); sndQBlk();
    }}
}

function spawnItem(tx,ty,type){
  if(type==='coin'){
    player.coins++; player.score+=200; _stageCoinsCollected++;
    spawnFloat(tx*T+8,(ty-1)*T,'200','#ffd700');
    addParts(tx*T+8,ty*T,'#ffd700',5); sndCoin(); vibCoin();
  } else {
    items.push({x:tx*T+1,y:(ty-1)*T,vx:(type==='star'||type==='flower')?1.2:0.8,vy:-2,
      w:14,h:14,type,animT:0,collected:false,life:480});
    sndItem();
  }
}

function hurtPlayer(){
  if(player.mini){ player.mini=false; player.miniT=0; player.dead=true; player.deadT=90; sndHurt(); vibHurt(); hitStopT=5; return; }
  if(player.invT>0) return;
  if(player.hammerT>0) return; // ハンマー中は無敵
  if(player.fire){ player.fire=false; player.big=true; player.invT=120; sndHurt(); vibHurt(); _ach1NoDmg=false;
    spawnFloat(player.x+player.w/2,player.y-16,'🔥→🍄','#ff8844');
    addParts(player.x+player.w/2,player.y+player.h/2,'#ff4400',12);
    return; }
  if(player.cape){ player.cape=false; player.capeT=0; player.invT=120; sndHurt(); vibHurt(); _ach1NoDmg=false; return; }
  if(player.big){ player.big=false; player.invT=120; sndHurt(); vibHurt(); hitStopT=5; _ach1NoDmg=false; }
  else {
    player.dead=true; player.vy=-8; player.vx=0; player.deadT=120;
    player.hp--; sndDie(); vibDie(); hitStopT=8; _achDeathCount++; _ach1NoDmg=false;
    logDeath('enemy/spike');
  }
}

// 安全なリスポーン位置を探す（地面が固く、その上2タイルが空中）
function findSafeRespawnX(nearX){
  const startTX = Math.max(0, Math.floor(nearX/T));
  for(let d=0; d<60; d++){
    for(const sign of [-1,1]){
      const tx = startTX + d*sign;
      if(tx<0||tx>=LW) continue;
      if(isSolid(getTile(tx,GR)) && !isSolid(getTile(tx,GR-1)) && !isSolid(getTile(tx,GR-2))){
        return tx*T+2;
      }
    }
  }
  return 48; // 最終フォールバック
}
