// ── MAIN LOOP ──────────────────────────────────────
gameState='title';
buildLevel(); // initial build for title screen background

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#5c94fc'; ctx.fillRect(0,0,W,H);

  if(gameState==='title')   { drawTitle(); return; }
  if(gameState==='win')     { drawWin(); return; }
  if(gameState==='fullclear'){ drawFullClear(); return; }
  if(gameState==='gameover'){ drawGameOver(); return; }

  if(!unusedPhotoViewing && !paused) update();

  // ── パラックス背景（視差スクロール） ────────────────────

  if(currentStage===4){
    // 4面：宇宙＋溶岩の総合背景
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#0a0020');
    grad.addColorStop(0.5,'#1a0040');
    grad.addColorStop(1,'#3a0a10');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    // 星（散らばり）
    ctx.fillStyle='rgba(255,255,255,.7)';
    for(let i=0;i<30;i++){
      const sx=((i*137-camX*.02)%(W+20)+W+20)%(W+20)-10;
      const sy=(i*73)%H;
      ctx.fillRect(sx,sy,i%3===0?2:1,i%3===0?2:1);
    }
    // 流れ星
    for(let i=0;i<4;i++){
      const period=240+i*80;
      const phase=(tick+i*173)%period;
      if(phase<50){
        const prog=phase/50; // 0→1
        const sx=((i*211+phase*4)%(W+60))-30;
        const sy=((i*97)%(H*.45))+8;
        const len=20+i*5;
        ctx.save();
        ctx.globalAlpha=(1-prog)*.9;
        ctx.strokeStyle='#ffffcc'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx-len*(1-prog)*.8, sy+len*(1-prog)*.5);
        ctx.stroke();
        // 星の先端
        ctx.fillStyle='#ffffff';
        ctx.fillRect(sx-1,sy-1,3,3);
        ctx.restore();
      }
    }
    // 下部溶岩光
    ctx.fillStyle=`rgba(200,0,100,${.2+Math.sin(tick*.04)*.06})`;
    ctx.fillRect(0,H-30,W,30);
    ctx.fillStyle=`rgba(180,0,255,${.08+Math.sin(tick*.03)*.04})`;
    ctx.fillRect(0,H*.6,W,H*.3);
  } else if(currentStage===3){
    // 3面：溶岩洞窟背景
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a0800');
    grad.addColorStop(0.65,'#2d0e00');
    grad.addColorStop(1,'#4a1800');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    // 溶岩光ゆらめき（下部）
    const lavaAlpha=0.28+Math.sin(tick*.04)*0.08;
    ctx.fillStyle=`rgba(255,80,0,${lavaAlpha})`;
    ctx.fillRect(0,H-22,W,22);
    ctx.fillStyle=`rgba(255,120,0,${lavaAlpha*.5})`;
    ctx.fillRect(0,H-44,W,22);
    // 岩肌（遠景）
    ctx.fillStyle='rgba(60,18,0,.5)';
    for(let i=0;i<6;i++){
      const rx=((i*113-camX*.05)%(W+80)+W+80)%(W+80)-40;
      ctx.fillRect(rx,H*.25+Math.sin(i*.9)*18, 40+i*10, 12+i*5);
    }
    // ── 溶岩バブル ──
    for(let i=0;i<10;i++){
      const period=80+i*17;
      const phase=(tick+i*43)%period;
      const bx=((i*79+60)%(W-20))+10;
      if(phase<period*.75){
        const prog=phase/(period*.75);
        const by=H-4-prog*16;
        const br=1.5+prog*3;
        ctx.fillStyle=`rgba(255,${Math.floor(50+prog*100)},0,${0.7+prog*.2})`;
        ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
      } else {
        // バブル破裂
        const popP=(phase-period*.75)/(period*.25);
        ctx.strokeStyle=`rgba(255,150,0,${1-popP})`;
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(bx,H-4-16,(1.5+3)+(popP*6),0,Math.PI*2); ctx.stroke();
        // 飛沫2粒
        const sp=popP*8;
        ctx.fillStyle=`rgba(255,120,0,${(1-popP)*.7})`;
        ctx.fillRect(bx-sp,H-8-sp,2,2);
        ctx.fillRect(bx+sp-2,H-8-sp*.7,2,2);
      }
    }
  } else {
  // 空グラデーション（1/2面）
  {const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#2a80ee'); grd.addColorStop(.6,'#60b0f8'); grd.addColorStop(1,'#a0d8ff');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);}

  // Layer1: 遠い山（視差 0.06）
  {const ox=(-camX*.06)%(W*2);
  ctx.fillStyle='#6a9ad8';
  for(let mx=Math.floor(ox/64)*64-64;mx<W+64;mx+=64){
    ctx.beginPath(); ctx.moveTo(mx,H*.75);
    ctx.lineTo(mx+12,H*.42); ctx.lineTo(mx+24,H*.62); ctx.lineTo(mx+36,H*.36);
    ctx.lineTo(mx+48,H*.54); ctx.lineTo(mx+64,H*.75); ctx.fill();
  }
  // 山の雪冠
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let mx=Math.floor(ox/64)*64-64;mx<W+64;mx+=64){
    ctx.beginPath(); ctx.moveTo(mx+32,H*.42); ctx.lineTo(mx+36,H*.36); ctx.lineTo(mx+40,H*.42); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mx+8,H*.5); ctx.lineTo(mx+12,H*.42); ctx.lineTo(mx+16,H*.5); ctx.fill();
  }}

  // Layer2: 中景の丘（視差 0.18）
  {const ox2=(-camX*.18)%(W*2);
  ctx.fillStyle='#3a9e3a';
  for(let mx=Math.floor(ox2/48)*48-48;mx<W+48;mx+=48){
    ctx.beginPath(); ctx.moveTo(mx,H*.78);
    ctx.quadraticCurveTo(mx+12,H*.60,mx+24,H*.68);
    ctx.quadraticCurveTo(mx+36,H*.58,mx+48,H*.78); ctx.fill();
  }
  // ヤシの木シルエット
  ctx.fillStyle='#2a7e2a';
  for(let mx=Math.floor(ox2/96)*96+20;mx<W+96;mx+=96){
    ctx.fillRect(mx,H*.58,3,20); // 幹
    ctx.beginPath(); ctx.arc(mx+1,H*.58,10,0,Math.PI*2); ctx.fill(); // 葉
    ctx.fillRect(mx-8,H*.56,8,2); ctx.fillRect(mx+4,H*.56,8,2);
  }}

  // Layer3: 雲（視差 0.35 + 自律移動）
  {const cbase=(-camX*.35+tick*.18);
  [[0,22,55,13],[180,40,68,11],[300,18,42,14],[440,35,60,12]].forEach(([bcx,cy,cw,ch])=>{
    const cx=((cbase+bcx)%(W+100)+W+100)%(W+100)-100;
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.fillRect(cx,cy,cw,ch); ctx.fillRect(cx+8,cy-ch*.5,cw-16,ch*.6);
    ctx.fillRect(cx+16,cy-ch,cw-32,ch*.5);
  });}
  // ── 波アニメ（Stage 1/2） ──
  {const waveY=H*0.842;
  ctx.fillStyle='rgba(20,80,200,0.45)';
  ctx.beginPath(); ctx.moveTo(0,waveY);
  for(let x=0;x<=W;x+=3){
    const y=waveY+Math.sin((x+tick*2.2)*0.10)*3.0+Math.sin((x+tick*1.4)*0.22)*1.5;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // 2層目（明るく）
  ctx.fillStyle='rgba(80,160,255,0.22)';
  ctx.beginPath(); ctx.moveTo(0,waveY+4);
  for(let x=0;x<=W;x+=3){
    const y=waveY+4+Math.sin((x-tick*1.8)*0.12)*2.0+Math.sin((x+tick*2.5)*0.18)*1.2;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();}
  } // end stage1/2 parallax

  // World tiles
  const tx0=Math.max(0,Math.floor(camX/T)-1), tx1=Math.min(LW,tx0+22);
  const ty0=Math.max(0,Math.floor(camY/T)-1), ty1=Math.min(LH,ty0+17);
  for(let ty=ty0;ty<ty1;ty++) for(let tx=tx0;tx<tx1;tx++){
    const id=getTile(tx,ty);
    if(id===AIR) continue;
    const k=`${tx},${ty}`;
    if(brokenQ[k]&&id!==SOLID&&id!==BFLOOR) continue;
    const sx=tx*T-camX+shakeX, sy=ty*T-camY+shakeY;
    if(id===COIN){ if(!coinsDone[k]) drawCoinTile(sx,sy); }
    else drawTile(id,sx,sy,tx,ty);
  }

  drawFlag();
  drawCheckpoint();
  items.forEach(it=>{ if(!it.collected) drawItem(it); });
  enemies.forEach(e=>drawEnemy(e));
  fireballs.forEach(fb=>drawFireball(fb));
  iceballs.forEach(ib=>drawIceball(ib));
  thrownEnemies.forEach(te=>drawThrownEnemy(te));
  movPlats.forEach(mp=>drawMovPlat(mp));
  barrels.forEach(br=>{ if(br.alive) drawBarrel(br); });
  projs.forEach(p=>drawProj(p));
  drawBoss();

  // Particles
  parts.forEach(pt=>{
    ctx.globalAlpha=pt.life/30;
    ctx.fillStyle=pt.col;
    ctx.fillRect(Math.round(pt.x-camX+shakeX-pt.sz/2),Math.round(pt.y-camY+shakeY-pt.sz/2),pt.sz,pt.sz);
    ctx.globalAlpha=1;
  });
  // Float texts
  floatTxts.forEach(ft=>{
    ctx.globalAlpha=ft.life/55;
    ctx.fillStyle=ft.col; ctx.font='bold 7px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ft.txt,Math.round(ft.x-camX+shakeX),Math.round(ft.y-camY+shakeY));
    ctx.globalAlpha=1;
  });


  // パイプ警告「！」表示
  PIPE_DEFS.forEach((pd,i)=>{
    if(pipeWarn[i]>0 && Math.floor(pipeWarn[i]/7)%2===0){
      const sx=Math.round(pd.x-camX+shakeX);
      const sy=Math.round(pd.pipeTopY-camY+shakeY)-14;
      ctx.fillStyle='#ffe000';
      ctx.strokeStyle='#cc0000';
      ctx.lineWidth=1;
      ctx.font='bold 13px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.strokeText('!',sx,sy);
      ctx.fillText('!',sx,sy);
    }
  });

  drawPlayer();
  drawPhotoOverlay();
  drawPhotoCollection();
  if(unusedPhotoViewing) drawPhotoViewerFull();
  drawHUD();
  if(currentStage===2) drawStage2Hint();
  drawSkyBossProjectiles();
  drawUpgradeHUD();
  if(paused) drawPauseOverlay();
  drawAchievementNotif();
}

loop();

function drawUpgradeHUD(){
  const p=player;
  if(!p) return;
  // top panel
  ctx.save();
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.fillStyle='rgba(0,0,0,.50)';
  ctx.fillRect(2,2,166,30);
  ctx.strokeStyle='rgba(255,255,255,.55)';
  ctx.lineWidth=1;
  ctx.strokeRect(2,2,166,30);

  // 水中オーバーレイ
  if(player && player.inWater){
    ctx.fillStyle='rgba(20,80,180,.18)';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(80,160,255,.35)';
    ctx.lineWidth=8;
    ctx.strokeRect(0,0,W,H);
  }
  // コンボ表示
  if(p.combo>1&&p.comboT>0){
    const calpha=Math.min(1,p.comboT/20);
    ctx.globalAlpha=calpha;
    ctx.font='bold 11px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    const cmul=Math.pow(2,Math.min(p.combo-1,5));
    ctx.fillStyle='#ff9900'; ctx.fillText(`${p.combo}COMBO ×${cmul}`,4,24);
    ctx.globalAlpha=1;
  }
  // 磁石エフェクト（プレイヤー周囲にリング）
  if(p.magnet&&p.magnetT>0){
    const rx=Math.round(p.x+p.w/2-camX+shakeX), ry=Math.round(p.y+p.h/2-camY+shakeY);
    for(let ri=0;ri<3;ri++){
      const ang=tick*.09+ri*(Math.PI*2/3);
      const mr=58+Math.sin(tick*.14+ri)*7;
      ctx.strokeStyle=`rgba(255,200,0,${.35-ri*.1})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(rx,ry,mr,ang,ang+Math.PI*1.3); ctx.stroke();
    }
  }
  // hearts
  ctx.font='bold 12px monospace';
  ctx.textAlign='left';
  ctx.textBaseline='top';
  let hx=7;
  for(let i=0;i<5;i++){
    ctx.fillStyle=i<p.hp?'#ff3158':'rgba(255,255,255,.22)';
    ctx.fillText('♥',hx,7);
    hx+=13;
  }

  // power
  ctx.fillStyle='#fff';
  ctx.font='bold 7px monospace';
  const pow = p.cape ? '🪶 CAPE' : (p.fire ? '🔥 FIRE' : (p.big ? '⬆ BIG' : 'NORMAL'));
  ctx.fillText(pow, 7, 21);
  if(p.cape && p.capeT>0 && p.capeT<120){
    ctx.fillStyle = Math.floor(tick/8)%2===0 ? '#ff4444' : '#ffef5a';
    ctx.font='bold 7px monospace';
    ctx.fillText('MOMONGA LOW!', 54, 21);
  }

  // time / best
  const nowTime = gameState==='play' ? Date.now()-gameStartTime : (clearTimeMs || bestClearTime);
  ctx.textAlign='right';
  ctx.fillStyle='#ffe66d';
  ctx.fillText('TIME '+fmtTime(nowTime), 164, 7);
  ctx.fillStyle='#9ee7ff';
  ctx.fillText('BEST '+fmtTime(bestClearTime), 164, 21);
  const stageCol=currentStage===4?'#cc88ff':currentStage===3?'#ff9944':currentStage===2?'#ffef5a':'#ffffff';
  const stageLbl=currentStage===4?'STAGE 4':currentStage===3?'STAGE 3':currentStage===2?'STAGE 2':'STAGE 1';
  ctx.textAlign='left'; ctx.fillStyle=stageCol; ctx.fillText(stageLbl,70,21);
  ctx.restore();

  // ⚔️ FINAL BATTLE! 演出
  if(finalBattleT>0){
    finalBattleT--;
    const ft=finalBattleT; // 200→0
    // フェードイン・アウト
    const alpha = ft>160 ? Math.min(1,(200-ft)/40) : ft<40 ? ft/40 : 1;
    ctx.save();
    // 背景オーバーレイ
    ctx.fillStyle=`rgba(0,0,0,${alpha*0.6})`;
    ctx.fillRect(0,0,W,H);
    // ⚔️ FINAL BATTLE! テキスト
    const pulse=1+Math.sin(tick*.18)*.06;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // 影
    ctx.font=`bold ${Math.round(22*pulse)}px monospace`;
    ctx.fillStyle=`rgba(0,0,0,${alpha*0.85})`;
    ctx.fillText('⚔️ FINAL BATTLE!',W/2+2,H/2-8+2);
    // 本体（虹グラデ）
    const r=Math.floor(255), g=Math.floor(180+Math.sin(tick*.15)*75), b=Math.floor(0);
    ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
    ctx.fillText('⚔️ FINAL BATTLE!',W/2,H/2-8);
    // サブ
    if(ft<170){
      ctx.font=`bold 8px monospace`;
      ctx.fillStyle=`rgba(0,0,0,${alpha*0.7})`;
      ctx.fillText('全力で倒せ！',W/2+1,H/2+13+1);
      ctx.fillStyle=`rgba(255,255,180,${alpha})`;
      ctx.fillText('全力で倒せ！',W/2,H/2+13);
    }
    ctx.restore();
  }

  // boss intro
  if(bossIntroT>0){
    bossIntroT--;
    const t=bossIntroT; // 240→0
    ctx.save();

    // ═══ ボスイントロ 4段階シネマ演出 ═══
    // 段階定義: t=240→210黒幕, t=210→155WARNING, t=155→90巨大な目, t=90→30BOSS BATTLE, t=30→0フェードアウト

    // Phase1: 黒幕フェードイン（240→210）
    const blackAlpha = t>210 ? Math.min(0.97,(240-t)/30*0.97)
                     : t>30  ? 0.97
                     : t/30*0.97;
    ctx.fillStyle=`rgba(0,0,0,${blackAlpha})`;
    ctx.fillRect(0,0,W,H);

    // ステージ別オーラ色
    const auraCol = currentStage===4 ? '140,0,255'
                  : currentStage===3 ? '255,80,0'
                  : '255,60,60';
    if(t<210 && t>30){
      const auraA = Math.sin(tick*.10)*.12+.10;
      ctx.fillStyle=`rgba(${auraCol},${auraA})`;
      ctx.fillRect(0,0,W,H);
    }

    ctx.textAlign='center'; ctx.textBaseline='middle';

    // Phase2: ⚠ WARNING ⚠（210→155）
    if(t<=210 && t>155){
      const wProg=(210-t)/55; // 0→1
      const wFlash=Math.floor(tick/5)%2;
      const wAlpha=wProg<0.2?wProg/0.2:1;
      const wScale=1+Math.sin(tick*.25)*.06;
      ctx.save();
      ctx.globalAlpha=wAlpha;
      ctx.translate(W/2,H/2);
      ctx.scale(wScale,wScale);
      ctx.font='bold 28px monospace';
      ctx.fillStyle=wFlash?'#ff2222':'#ff8800';
      ctx.fillText('⚠  WARNING  ⚠',1,1);
      ctx.fillStyle=wFlash?'#ff6666':'#ffcc44';
      ctx.fillText('⚠  WARNING  ⚠',0,0);
      // サブ
      if(wProg>0.4){
        ctx.font='bold 9px monospace';
        ctx.fillStyle='rgba(255,200,200,0.9)';
        ctx.fillText('BOSS IS APPROACHING',0,24);
      }
      ctx.restore();
    }

    // Phase3: 巨大な目（155→90）
    if(t<=155 && t>90){
      const eProg=(155-t)/65; // 0→1
      const eScale=eProg<0.3?eProg/0.3:1;
      const eyePulse=Math.sin(tick*.2)*.04;
      ctx.save();
      ctx.globalAlpha=Math.min(1,eProg*2);
      ctx.translate(W/2,H/2);
      ctx.scale(eScale+eyePulse,eScale+eyePulse);
      // 目の白目
      const eyeW=70, eyeH=38;
      ctx.fillStyle='#e8e8ff';
      ctx.beginPath(); ctx.ellipse(0,0,eyeW,eyeH,0,0,Math.PI*2); ctx.fill();
      // 虹彩（ステージ別色）
      const irisCol=currentStage===4?'#6600ff':currentStage===3?'#ff4400':'#cc0000';
      ctx.fillStyle=irisCol;
      ctx.beginPath(); ctx.ellipse(0,0,eyeH*.75,eyeH*.75,0,0,Math.PI*2); ctx.fill();
      // 瞳孔
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(0,0,eyeH*.38,eyeH*.38,0,0,Math.PI*2); ctx.fill();
      // 光（ハイライト）
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(-eyeH*.25,-eyeH*.28,eyeH*.12,eyeH*.10,-.4,0,Math.PI*2); ctx.fill();
      // まぶた（上下）
      const lidOpen=Math.min(1,eProg*3);
      ctx.fillStyle='rgba(0,0,0,0.97)';
      ctx.fillRect(-eyeW-4,-eyeH-4,eyeW*2+8,eyeH*(1-lidOpen)+4);
      ctx.fillRect(-eyeW-4,eyeH*lidOpen,eyeW*2+8,eyeH*(1-lidOpen)+4);
      ctx.restore();
    }

    // Phase4: BOSS BATTLE!（90→30）
    if(t<=90 && t>30){
      const bProg=(90-t)/60; // 0→1
      const bScale=bProg<0.15?0.3+bProg/0.15*.7:bProg<0.25?1.12-(bProg-0.15)/.10*.12:1.0;
      const bAlpha=Math.min(1,bProg*3);
      ctx.save();
      ctx.globalAlpha=bAlpha;
      ctx.translate(W/2,H/2-14);
      ctx.scale(bScale,bScale);
      // 背景パネル
      ctx.fillStyle='rgba(0,0,0,0.85)';
      ctx.fillRect(-105,-22,210,44);
      const bossStroke=currentStage===4?'#cc44ff':currentStage===3?'#ff6600':'#ff4444';
      ctx.strokeStyle=bossStroke; ctx.lineWidth=2.5;
      ctx.strokeRect(-105,-22,210,44);
      // ボス名
      const bossName=currentStage===4?'OMEGA CRAB KING'
                    :currentStage===3?'MAGMA CRAB KING'
                    :currentStage===2?'SKY CRAB KING':'KING CRAB';
      const pulse=.5+Math.sin(tick*.22)*.5;
      ctx.font='bold 14px monospace';
      ctx.fillStyle='rgba(0,0,0,0.8)';
      ctx.fillText(bossName,1,1);
      if(currentStage===4){
        const r=Math.floor(200+pulse*55),g=Math.floor(80+pulse*60),b=255;
        ctx.fillStyle=`rgb(${r},${g},${b})`;
      } else if(currentStage===3){
        ctx.fillStyle=`rgb(255,${Math.floor(100+pulse*80)},0)`;
      } else {
        ctx.fillStyle=`rgb(255,${Math.floor(60+pulse*60)},${Math.floor(60+pulse*60)})`;
      }
      ctx.fillText(bossName,0,0);
      ctx.restore();
      // BOSS BATTLE! サブ
      if(bProg>0.5){
        const bbA=Math.min(1,(bProg-0.5)*2);
        ctx.save();
        ctx.globalAlpha=bbA;
        ctx.translate(W/2,H/2+16);
        ctx.font='bold 9px monospace';
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillText('⚔️  BOSS BATTLE  ⚔️',1,1);
        ctx.fillStyle=Math.floor(tick/8)%2?'#ffee44':'#ffffff';
        ctx.fillText('⚔️  BOSS BATTLE  ⚔️',0,0);
        ctx.restore();
      }
    }

    // ボスイントロ中もパーティクル演出
    if(t<210 && t>30 && tick%4===0){
      const col=currentStage===4?'#aa44ff':currentStage===3?'#ff6600':'#ff4444';
      parts.push({x:Math.random()*W+camX,y:Math.random()*H+camY,
        vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,
        life:25,col,sz:2});
    }

    ctx.restore();
  }

  // ══ BOSS HP BAR (大型版) ══
  if(boss && boss.active && boss.alive){
    ctx.save();
    const bw=W-20, bh=10, bx=10, by=6;
    const hpRatio=Math.max(0,boss.hp/boss.maxHp);
    const phase=boss.omegaMode?4:boss.magmaMode?3:boss.skyMode?2:boss.phase2?2:1;

    // 背景パネル
    ctx.fillStyle='rgba(0,0,0,0.80)';
    ctx.fillRect(bx-2, by-12, bw+4, bh+20);
    // パネルボーダー（ステージ別色）
    const borderCol=currentStage===4?'#cc44ff':currentStage===3?'#ff6622':'#ff4444';
    ctx.strokeStyle=borderCol; ctx.lineWidth=1.5;
    ctx.strokeRect(bx-2, by-12, bw+4, bh+20);

    // ボス名（左揃え + フェーズ表示）
    ctx.textBaseline='middle'; ctx.font='bold 7px monospace';
    const bname=currentStage===4?'OMEGA CRAB KING'
               :currentStage===3?'MAGMA CRAB KING'
               :currentStage===2?'SKY CRAB KING':'KING CRAB';
    // フェーズ2は点滅
    const p2flash=boss.phase2&&Math.floor(tick/6)%2;
    ctx.fillStyle=p2flash?'#ff2222':boss.phase2?'#ff8888':
                  currentStage===4?'#dd88ff':currentStage===3?'#ff9944':'#ffdddd';
    ctx.textAlign='left';
    ctx.fillText((boss.phase2?'⚠ ':'')+bname, bx+2, by-5);

    // HP数値（右揃え）
    ctx.textAlign='right';
    ctx.fillStyle='#cccccc'; ctx.font='6px monospace';
    ctx.fillText(boss.hp+'/'+boss.maxHp, bx+bw-2, by-5);

    // HP バー本体（背景）
    ctx.fillStyle='#220000';
    ctx.fillRect(bx, by, bw, bh);

    // HP バー（グラデーション風 2段描画）
    const barW=Math.round(bw*hpRatio);
    if(barW>0){
      // 下地
      const barMainCol=hpRatio<0.25?'#ff1100':hpRatio<0.5?'#ff6600':'#ff3333';
      ctx.fillStyle=barMainCol;
      ctx.fillRect(bx, by, barW, bh);
      // 上ハイライト
      ctx.fillStyle='rgba(255,200,200,0.3)';
      ctx.fillRect(bx, by, barW, Math.floor(bh/2));
      // フェーズ2: 点滅エフェクト
      if(boss.phase2 && Math.floor(tick/4)%2){
        ctx.fillStyle='rgba(255,80,0,0.35)';
        ctx.fillRect(bx, by, barW, bh);
      }
    }
    // セグメント区切り線（20等分）
    ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=0.5;
    for(let i=1;i<20;i++){
      const sx=bx+Math.round(bw*i/20);
      ctx.beginPath(); ctx.moveTo(sx,by); ctx.lineTo(sx,by+bh); ctx.stroke();
    }
    // 枠
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.restore();
  }

  // ── フェーズ変化フラッシュオーバーレイ ──
  if(phaseFlashT>0){
    const fa=phaseFlashT/30*.55;
    ctx.fillStyle=phaseFlashCol+fa+')';
    ctx.fillRect(0,0,W,H);
    phaseFlashT--;
  }
  // FINAL PHASE バナー
  if(finalPhaseT>0){
    finalPhaseT--;
    const ft=finalPhaseT;
    const alpha=ft>90?1:ft/90;
    const pulse=Math.floor(ft/8)%2;
    ctx.save();
    ctx.globalAlpha=alpha*0.92;
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(0,H/2-22,W,42);
    ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=pulse?'#ff2222':'#ff8800';
    ctx.fillText('⚠ FINAL PHASE! ⚠',W/2,H/2-7);
    ctx.font='8px monospace'; ctx.fillStyle='#ffee88';
    ctx.fillText('ラスボス 最終形態！',W/2,H/2+11);
    ctx.globalAlpha=1; ctx.restore();
  }

  if(bossDefeatT>0){
    bossDefeatT--;
    ctx.save();
    const t=bossDefeatT; // 300→0

    // ═══════════════════════════════════════════
    //  STAGE CLEAR リザルト画面（ステージ1〜3）
    // ═══════════════════════════════════════════
    if(currentStage!==4){
      const cd=_stageClearData||{tBonus:5000,cBonus:0,total:5000,rank:'B',rankCol:'#88ff88',elapsedSec:60};

      // ── 紙吹雪パーティクル（継続）──
      if(tick%2===0){
        const cols=['#ffef5a','#ff8800','#ff4488','#44ffaa','#44aaff','#cc88ff'];
        parts.push({x:Math.random()*W+camX,y:camY-8,
          vx:(Math.random()-.5)*2,vy:1.0+Math.random()*1.5,
          life:160,sz:3,col:cols[Math.floor(Math.random()*cols.length)]});
      }

      // ── パネル背景（全フェーズ共通）──
      const panelY=H/2-75;
      const panelH=150;
      const panelAlpha=t>280?(300-t)/20:t<20?t/20:1;
      ctx.fillStyle=`rgba(0,0,10,${panelAlpha*.88})`;
      ctx.fillRect(18,panelY,W-36,panelH);
      const strokeCol=currentStage===3?'#ff6622':'#ffd700';
      ctx.strokeStyle=`rgba(${currentStage===3?'255,102,34':'255,215,0'},${panelAlpha})`;
      ctx.lineWidth=2; ctx.strokeRect(18,panelY,W-36,panelH);

      ctx.textAlign='center'; ctx.textBaseline='middle';

      // ─── Phase1: STAGE CLEAR バナー（300→240）───
      {
        const show=t<=300;
        const prog=t>240?(300-t)/60:1;
        const sc=prog<0.15?0.3+prog/0.15*.8:prog<0.25?1.12-(prog-0.15)/.10*.12:1.0;
        ctx.save();
        ctx.globalAlpha=Math.min(1,prog*2)*panelAlpha;
        ctx.translate(W/2,panelY+28);
        ctx.scale(sc,sc);
        ctx.font='bold 17px monospace';
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.fillText('★ STAGE '+currentStage+' CLEAR ★',2,2);
        ctx.fillStyle=currentStage===3?'#ff9944':'#ffef5a';
        ctx.fillText('★ STAGE '+currentStage+' CLEAR ★',0,0);
        ctx.restore();
      }

      // ─── Phase2: TIME BONUS（240→180）───
      if(t<=240){
        const prog2=t>180?(240-t)/60:1;
        const slideX=(1-Math.min(1,prog2*2))*(-80);
        const countProg=Math.min(1,prog2*1.4);
        const displayVal=Math.round(cd.tBonus*countProg);
        ctx.save();
        ctx.globalAlpha=Math.min(1,prog2*3)*panelAlpha;
        ctx.translate(slideX,0);
        ctx.textAlign='left'; ctx.font='bold 9px monospace';
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillText('⏱ TIME BONUS',30,panelY+60);
        ctx.fillStyle='#aaddff';
        ctx.fillText('⏱ TIME BONUS',29,panelY+59);
        ctx.textAlign='right';
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillText('+'+displayVal,W-29,panelY+60);
        ctx.fillStyle='#ffffff';
        ctx.fillText('+'+displayVal,W-30,panelY+59);
        ctx.restore();
      }

      // ─── Phase3: COIN BONUS（180→120）───
      if(t<=180){
        const prog3=t>120?(180-t)/60:1;
        const slideX=(1-Math.min(1,prog3*2))*(80);
        const countProg3=Math.min(1,prog3*1.4);
        const displayVal3=Math.round(cd.cBonus*countProg3);
        ctx.save();
        ctx.globalAlpha=Math.min(1,prog3*3)*panelAlpha;
        ctx.translate(slideX,0);
        ctx.textAlign='left'; ctx.font='bold 9px monospace';
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillText('🪙 COIN BONUS',30,panelY+82);
        ctx.fillStyle='#ffdd88';
        ctx.fillText('🪙 COIN BONUS',29,panelY+81);
        ctx.textAlign='right';
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillText('+'+displayVal3,W-29,panelY+82);
        ctx.fillStyle='#ffffff';
        ctx.fillText('+'+displayVal3,W-30,panelY+81);
        ctx.restore();
      }

      // ─── Phase4: RANK（120→60）───
      if(t<=120){
        const prog4=t>60?(120-t)/60:1;
        const sc4=prog4<0.2?0.2+prog4/0.2*.9:prog4<0.32?1.1-(prog4-0.2)/.12*.1:1.0;
        const flash4=prog4<0.35&&Math.floor(tick/4)%2?1:0;
        ctx.save();
        ctx.globalAlpha=Math.min(1,prog4*2)*panelAlpha;
        ctx.translate(W/2,panelY+112);
        ctx.scale(sc4,sc4);
        ctx.font='bold 7px monospace'; ctx.textAlign='center'; ctx.fillStyle='#aaaaaa';
        ctx.fillText('RANK',0,-12);
        ctx.font='bold 28px monospace';
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.fillText(cd.rank,2,6);
        ctx.fillStyle=flash4?'#ffffff':cd.rankCol;
        ctx.fillText(cd.rank,0,4);
        // S/Aランクは追加エフェクト
        if((cd.rank==='S'||cd.rank==='A')&&tick%3===0){
          parts.push({x:W/2+camX+(Math.random()-.5)*40,y:panelY+112+camY+(Math.random()-.5)*20,
            vx:(Math.random()-.5)*2,vy:-1-Math.random(),
            life:30,col:cd.rankCol,sz:2});
        }
        ctx.restore();
      }

      // ─── Phase5: 次の面へプロンプト（60→0）───
      if(t<=60){
        const nextTxt=currentStage===1?'▶ 2面へ進む':currentStage===2?'▶ 3面へ進む':'▶ 4面へ進む';
        if(Math.floor(tick/18)%2===0){
          ctx.save();
          ctx.textAlign='center'; ctx.font='bold 8px monospace';
          ctx.globalAlpha=panelAlpha;
          ctx.fillStyle='rgba(0,0,0,0.7)';
          ctx.fillText(nextTxt,W/2+1,panelY+panelH+14);
          ctx.fillStyle='#aaffaa';
          ctx.fillText(nextTxt,W/2,panelY+panelH+13);
          ctx.restore();
        }
      }
    }

    if(currentStage===4){
      // ══ 4面（最終）クリア演出 ══
      // 継続爆発パーティクル（多め）
      if(bossDefeatT>60 && tick%2===
0){
        const cols=['#ffd700','#ff8800','#ff4488','#88ffff','#ffffff','#cc88ff'];
        const cx=boss._dieX+boss.w/2, cy=boss._dieY+boss.h/2;
        parts.push({x:cx+(Math.random()-.5)*boss.w,y:cy+(Math.random()-.5)*boss.h,
          vx:(Math.random()-.5)*4,vy:-4-Math.random()*3,
          life:70,sz:5+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)]});
      }
      ctx.fillStyle='rgba(255,220,80,.18)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(0,0,0,.82)';
      ctx.fillRect(20,54,W-40,130);
      ctx.strokeStyle='#ffd700'; ctx.lineWidth=2;
      ctx.strokeRect(20,54,W-40,130);
      // 虹色タイトル
      ['#ffef5a','#ff8844','#ff44aa','#44aaff','#44ffaa'].forEach((col,i)=>{
        const off=Math.sin(tick*.08+i*.8)*1.5;
        ctx.fillStyle=col; ctx.font='bold 8px monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('★'.repeat(i%2===0?3:2), W/2-50+i*25, 68+off);
      });
      const isBest=lastClearIsBest;
      ctx.fillStyle=isBest?'#ffef5a':'#ffd700';
      ctx.font='bold 16px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(isBest?'\U0001f3c6 NEW RECORD!!':'\U0001f389 GAME CLEAR!!', W/2, 88);
      ctx.fillStyle='#fff'; ctx.font='9px monospace';
      ctx.fillText('SCORE  ' + String(lastClearScore||player.score), W/2, 108);
      ctx.fillText('TIME   ' + fmtTime(clearTimeMs), W/2, 121);
      ctx.fillStyle=isBest?'#ffef5a':'#9ee7ff';
      ctx.fillText('BEST   ' + fmtTime(bestClearTime), W/2, 134);
      const rankText=lastClearRankIn ? `\U0001f3c5 RANK ${lastClearRank}位 入り！` : 'RANK OUT';
      ctx.fillStyle=lastClearRankIn?'#ffdd55':'#aaaaaa';
      ctx.font='bold 8px monospace';
      ctx.fillText(rankText, W/2, 150);
      // 点滅プロンプト
      if(tick%50<30){
        ctx.fillStyle='#aaffaa'; ctx.font='7px monospace';
        ctx.fillText('タップでステージ選択へ', W/2, 170);
      }
    }
    ctx.restore();
  }
}


// ── PAUSE BUTTON ───────────────────────────────────────────────────────────
(function(){
  const btn = document.getElementById('pauseBtn');
  function togglePause(e){
    e.preventDefault(); e.stopPropagation();
    initAudio();
    if(gameState !== 'play') return;
    paused = !paused;
    btn.textContent = paused ? '▶' : '⏸';
  }
  btn.addEventListener('touchstart', togglePause, {passive:false});
  btn.addEventListener('click', togglePause);
})();

function drawSkyBossProjectiles(){
  projs.forEach(pr=>{
    const x=Math.floor(pr.x-camX), y=Math.floor(pr.y-camY);
    if(pr.kind==='bubble'){
      ctx.save();
      ctx.strokeStyle='#9ee7ff';
      ctx.fillStyle='rgba(160,230,255,.35)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(x+pr.w/2,y+pr.h/2,pr.w/2,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.fillRect(x+2,y+2,2,2);
      ctx.restore();
    }else if(pr.kind==='geyser'){
      ctx.save();
      const gf=tick%4<2?'#ff6600':'#ff3300';
      ctx.fillStyle=gf; ctx.fillRect(x,y,pr.w,pr.h);
      ctx.fillStyle='#ffcc00'; ctx.fillRect(x+2,y+2,pr.w-4,3);
      ctx.fillStyle=`rgba(255,150,0,.6)`;
      ctx.fillRect(x-3,y+4,pr.w+6,4);
      ctx.restore();
    }else if(pr.kind==='fire'){
      ctx.save();
      const fc=tick%6<3?'#ff4400':'#ff8800';
      ctx.fillStyle=fc;
      ctx.fillRect(x+1,y+1,pr.w-2,pr.h-2);
      ctx.fillStyle='#ffcc00';
      ctx.fillRect(x+3,y+2,pr.w-6,3);
      ctx.fillStyle='rgba(255,100,0,.5)';
      const trail=pr.vx>0?-1:1;
      ctx.fillRect(x+trail*4,y+2,4,pr.h-4);
      ctx.restore();
    }else if(pr.kind==='shockwave'){
      ctx.save();
      ctx.fillStyle='#ff8844';
      ctx.fillRect(x,y,pr.w,pr.h);
      ctx.fillStyle='#ffdd55';
      ctx.fillRect(x+2,y+2,pr.w-4,2);
      ctx.restore();
    }
  });
}
