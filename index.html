function drawMovPlat(mp){
  const sx=Math.round(mp.x-camX+shakeX), sy=Math.round(mp.y-camY+shakeY);
  const pw=mp.w;
  // 本体
  ctx.fillStyle='#7a5230'; ctx.fillRect(sx,sy,pw,T);
  ctx.fillStyle='#c07040'; ctx.fillRect(sx,sy,pw,3);
  ctx.fillStyle='#5a3820'; ctx.fillRect(sx,sy+T-3,pw,3);
  // 節目
  for(let i=1;i<Math.floor(pw/T);i++){
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(sx+i*T,sy+3,1,T-6);
  }
  // 矢印インジケーター（方向）
  ctx.fillStyle='rgba(255,230,60,.85)'; ctx.font='bold 7px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const icon=mp.vx?(mp.vx>0?'→':'←'):(mp.vy>0?'↓':'↑');
  ctx.fillText(icon,sx+pw/2,sy+T/2+1);
}

function drawCheckpoint(){
  const cpX=118*T, cpY=GR*T;
  const sx=Math.round(cpX-camX+shakeX), sy=Math.round(cpY-camY+shakeY);
  const poleH=40;
  // 竿
  ctx.fillStyle='#cccccc'; ctx.fillRect(sx,sy-poleH,3,poleH);
  ctx.fillStyle='#ffee00'; ctx.fillRect(sx-1,sy-poleH-2,5,4); // 先端

  if(checkpointActivated){
    // 活性化：大きい緑旗＋輝き
    const wave=Math.sin(tick*.15)*3;
    // 外枠
    ctx.fillStyle='#007733'; ctx.fillRect(sx+3,sy-poleH+1,18+wave,16);
    // 本体
    ctx.fillStyle='#00cc55'; ctx.fillRect(sx+4,sy-poleH+2,16+wave,12);
    // ハイライト
    ctx.fillStyle='#66ff99'; ctx.fillRect(sx+5,sy-poleH+3,8,4);
    // 星マーク
    ctx.fillStyle='#ffee00'; ctx.font='bold 9px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('★',sx+5,sy-poleH+5);
    // 発光
    if(tick%16<8){ ctx.fillStyle='rgba(0,255,136,.20)'; ctx.fillRect(sx-6,sy-poleH-6,32,poleH+10); }
    // 上部ラベル「ここから復活」
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(sx-14,sy-poleH-18,44,12);
    ctx.fillStyle='#00ff88'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
    ctx.fillText('ここから復活!',sx+8,sy-poleH-14);
  } else {
    // 未活性化：白旗＋「セーブ地点」ラベル
    ctx.fillStyle='#aaaaaa'; ctx.fillRect(sx+3,sy-poleH+1,16,14);
    ctx.fillStyle='#dddddd'; ctx.fillRect(sx+4,sy-poleH+2,14,10);
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(sx-14,sy-poleH-18,44,12);
    ctx.fillStyle='#fff'; ctx.font='bold 6px monospace'; ctx.textAlign='center';
    ctx.fillText('セーブ地点',sx+8,sy-poleH-14);
    // 矢印「通り過ぎると発動」
    const arrowBob=Math.floor(tick*.05)%2;
    ctx.fillStyle='#ffee00'; ctx.font='10px monospace';
    ctx.fillText('→',sx-10,sy-poleH+4+arrowBob);
  }
  // 土台
  ctx.fillStyle='#888'; ctx.fillRect(sx-3,sy-4,8,4);
}

function drawBarrel(br){
  const sx=Math.round(br.x-camX+shakeX), sy=Math.round(br.y-camY+shakeY);
  const rot=Math.floor(br.animT*.18)%4;
  ctx.fillStyle='#7a3510'; ctx.fillRect(sx,sy,br.w,br.h);
  ctx.fillStyle='#a05020'; ctx.fillRect(sx+1,sy+1,br.w-2,4);
  ctx.fillStyle='#c8a000'; ctx.fillRect(sx,sy+3,br.w,2); ctx.fillRect(sx,sy+br.h-5,br.w,2);
  const lx=rot%2===0?3:8;
  ctx.fillStyle='#4a1800'; ctx.fillRect(sx+lx,sy+5,2,br.h-10);
  ctx.fillStyle='rgba(255,200,130,.3)'; ctx.fillRect(sx+1,sy+5,3,br.h-10);
}

// Boss (Big Red Crab)
function drawBoss(){
  const b=boss;
  // ── デスアニメーション（撃破後90フレームかけて上に飛んで消える） ──
  if(!b.alive){
    const t=b._deadTimer||0;
    if(t>0 && t<=90){
      const alpha=Math.max(0,1-t/90);
      const spin=t*.15;
      const fly=-t*1.3;  // 上へ直線的に飛ぶ
      const sx=Math.round((b._dieX||b.x)-camX+shakeX+b.w/2);
      const sy=Math.round((b._dieY||b.y)-camY+shakeY+b.h/2+fly);
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(sx,sy);
      ctx.rotate(spin);
      const sc=1+t*.005;
      ctx.scale(sc,sc);
      // 簡易ボディ
      ctx.fillStyle='#cc3300'; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.fillStyle='#ee5533'; ctx.fillRect(-b.w/2+4,-b.h/2+2,b.w-8,6);
      ctx.restore();
      // 爆発パーティクルを追加（20フレームごと）
      if(t%20===0){
        addParts((b._dieX||b.x)+Math.random()*b.w,
                 (b._dieY||b.y)+Math.random()*b.h,
                 ['#ff4400','#ffd700','#ff8800'][Math.floor(Math.random()*3)],8);
      }
    }
    return;
  }
  const sx=Math.round(b.x-camX+shakeX), sy=Math.round(b.y-camY+shakeY);
  // HPによる段階カラー
  const hpR=b.hp/b.maxHp;
  const phase=b._phase||1;
  const rage=phase>=3;
  const flash=b.hitT>0 && Math.floor(b.hitT/5)%2;
  // フェーズ2+: 発光グロー
  if(phase>=2 && !flash){
    const glowAlpha=phase>=3?(.18+Math.sin(tick*.14)*.1):(.08+Math.sin(tick*.1)*.04);
    ctx.shadowColor=phase>=3?'#ff3300':'#ff8800'; ctx.shadowBlur=phase>=3?22:12;
  }
  if(flash){ ctx.globalAlpha=.35; }

  // ── CLAWS (激怒で大きく揺れる) ──
  const caBase=rage?0.35:0.22;
  const ca=Math.sin(b.clawA)*(caBase+(phase>=4?.15:0));
  // Left claw arm
  ctx.save(); ctx.translate(sx-2,sy+b.h/2-4); ctx.rotate(-Math.PI/4-ca);
  drawBossClaw(rage,false); ctx.restore();
  // Right claw arm
  ctx.save(); ctx.translate(sx+b.w+2,sy+b.h/2-4); ctx.rotate(Math.PI/4+ca);
  drawBossClaw(rage,true); ctx.restore();

  // ── BODY ── (HPによる色変化)
  const bc=phase>=4?'#ff0000':phase>=3?'#ff1500':phase>=2?'#e82800':'#cc3300';
  const bh=phase>=4?'#ff6644':phase>=3?'#ff4422':phase>=2?'#ff5522':'#ee5533';
  const bd=phase>=4?'#aa0000':phase>=3?'#990000':phase>=2?'#aa1100':'#aa2200';
  // フェーズ2+ でシェル上に汗/泡ドット
  if(phase>=2 && tick%4<2){
    ctx.fillStyle=`rgba(150,200,255,${.25+phase*.08})`;
    ctx.fillRect(sx+5,sy+14,2,2); ctx.fillRect(sx+b.w-8,sy+20,2,2);
    if(phase>=3){ ctx.fillRect(sx+12,sy+18,2,2); ctx.fillRect(sx+b.w/2,sy+28,2,2); }
  }
  // Main oval
  ctx.fillStyle=bc; ctx.fillRect(sx+3,sy+10,b.w-6,b.h-10);
  ctx.fillRect(sx+7,sy+5,b.w-14,8); ctx.fillRect(sx+12,sy+2,b.w-24,5);
  // Highlights
  ctx.fillStyle=bh; ctx.fillRect(sx+7,sy+11,b.w-14,5);
  ctx.fillStyle=rage?'#ff7755':'#ff6644'; ctx.fillRect(sx+10,sy+12,b.w-20,3);
  // Shell ridges
  ctx.fillStyle=bd;
  ctx.fillRect(sx+3,sy+18,b.w-6,1); ctx.fillRect(sx+3,sy+24,b.w-6,1); ctx.fillRect(sx+3,sy+30,b.w-6,1);
  // Shell segment lines (vertical)
  ctx.fillRect(sx+b.w/2,sy+10,1,b.h-10);

  // ── EYES (3 stalks) ──
  [-16,0,16].forEach((ex,i)=>{
    const ew=Math.sin(b.eyeA+i*1.3)*.9;
    const ecx=sx+b.w/2+ex;
    ctx.fillStyle=bd; ctx.fillRect(ecx-1,sy-7+ew,3,10);
    const eyeCol=phase>=4?`hsl(${tick*8%60},100%,60%)`:phase>=3?'#ff4400':phase>=2?'#ff7700':'#ff5533';
    ctx.fillStyle=eyeCol; ctx.fillRect(ecx-5,sy-15+ew,10,10);
    ctx.fillStyle='#fff'; ctx.fillRect(ecx-4,sy-14+ew,8,6);
    const pd=player.x>b.x?1:-1;
    ctx.fillStyle='#000'; ctx.fillRect(ecx-1+pd,sy-12+ew,3,4);
    ctx.fillStyle='#fff'; ctx.fillRect(ecx+pd,sy-12+ew,1,1);
    // Eyelid top
    ctx.fillStyle=rage?'#ff8800':'#ff5533'; ctx.fillRect(ecx-5,sy-15+ew,10,3);
  });

  // ── LEGS ──
  ctx.fillStyle=bd;
  for(let i=0;i<4;i++){
    const lx=sx+8+i*(b.w-16)/3;
    const lw=Math.sin(b.clawA+i*.7)*2.5;
    ctx.fillRect(lx,sy+b.h-2+lw,4,6); ctx.fillRect(lx-2,sy+b.h+3+lw,7,3);
  }

  // ── HP BAR ──
  ctx.globalAlpha=1;
  ctx.fillStyle='#330';
  ctx.fillRect(sx-4,sy-24,b.w+8,8);
  ctx.fillStyle=phase>=4?`hsl(${tick*10%60+0},100%,50%)`:phase>=3?'#ff1100':phase>=2?'#ff6600':'#ff4400';
  ctx.fillRect(sx-4,sy-24,Math.round((b.w+8)*b.hp/b.maxHp),8);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1;
  ctx.strokeRect(sx-4,sy-24,b.w+8,8);
  ctx.fillStyle='#fff'; ctx.font='bold 5px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('KING CRAB',sx+b.w/2,sy-20);
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
}

function drawBossClaw(rage,right){
  const phase=boss._phase||1;
  const col=phase>=4?'#ff0000':phase>=3?'#ff2200':phase>=2?'#e03300':'#cc3300';
  const hcol=phase>=4?'#ff7766':phase>=3?'#ff5533':phase>=2?'#ff4422':'#ee4422';
  const tcol='#ff9977';
  ctx.fillStyle=col; ctx.fillRect(-5,0,20,9); // arm
  ctx.fillStyle=hcol; ctx.fillRect(-4,0,18,3);
  // Pincer upper
  const px=right?13:-13;
  ctx.fillStyle=col; ctx.fillRect(px,-8,12,9); ctx.fillRect(px+2,4,9,7);

function drawPhotoOverlay(){
  if(!unusedPhotoOverlay || unusedPhotoOverlay.timer<=0) return;
  const t=unusedPhotoOverlay.timer;
  unusedPhotoOverlay.timer--;

  // フラッシュ（最初の8フレーム）
  if(t>82){
    ctx.fillStyle=`rgba(255,255,255,${(t-82)/8})`;
    ctx.fillRect(0,0,W,H);
  }

  // フェードアウト（残り20フレーム）
  const alpha = t<20 ? t/20 : 1;
  // ポップイン（最初の10フレームで拡大）
  const sc = t>80 ? 0.4+(1-((t-80)/10))*0.6 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H/2);
  ctx.rotate(unusedPhotoOverlay.rot);
  ctx.scale(sc, sc);

  const pw=170, ph=135, fr=10, bot=24;
  // ポラロイドフレーム
  ctx.fillStyle='#fffef5';
  ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=14;
  ctx.fillRect(-pw/2-fr,-ph/2-fr,pw+fr*2,ph+fr*2+bot);
  ctx.shadowBlur=0;
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  if(unusedPhotoOverlay.img){
    ctx.beginPath(); ctx.rect(-pw/2,-ph/2,pw,ph); ctx.clip();
    const im=unusedPhotoOverlay.img;
    const ir=im.width/im.height, pr=pw/ph;
    let dw=pw,dh=ph,dx=-pw/2,dy=-ph/2;
    if(ir>pr){ dh=ph; dw=ph*ir; dx=-dw/2; }
    else      { dw=pw; dh=pw/ir; dy=-dh/2; }
    ctx.drawImage(im,dx,dy,dw,dh);
  } else {
    ctx.fillStyle='#ddd'; ctx.fillRect(-pw/2,-ph/2,pw,ph);
  }
  ctx.restore();

  ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=1;
  ctx.strokeRect(-pw/2,-ph/2,pw,ph);

  // 下部テキスト
  ctx.fillStyle='#cc0077'; ctx.font='bold 7px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const pidx=loadedPhotos.indexOf(unusedPhotoOverlay.img)+1;
  ctx.fillText(`📷 かぞくのおもいで！ [${pidx}/${loadedPhotos.length}]  ❤️+1`,0,ph/2+bot/2);

  ctx.restore();
}

function drawPhotoCollection(){
  if(unusedPhotoCollection.length===0) return;
  const TW=22, TH=16, GAP=2, OX=2, OY=17;
  // 背景パネル
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.fillRect(OX-1,OY-1,unusedPhotoCollection.length*(TW+GAP)-GAP+2,TH+2);
  ctx.imageSmoothingEnabled=true;
  unusedPhotoCollection.forEach((img,i)=>{
    const tx=OX+i*(TW+GAP), ty=OY;
    // サムネイル描画
    ctx.save();
    ctx.beginPath(); ctx.rect(tx,ty,TW,TH); ctx.clip();
    const ir=img.width/img.height, pr=TW/TH;
    let dw=TW,dh=TH,dx=tx,dy=ty;
    if(ir>pr){ dh=TH; dw=TH*ir; dx=tx-(dw-TW)/2; }
    else      { dw=TW; dh=TW/ir; dy=ty-(dh-TH)/2; }
    ctx.drawImage(img,dx,dy,dw,dh);
    ctx.restore();
    // 金枠
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=1;
    ctx.strokeRect(tx,ty,TW,TH);
  });
  ctx.imageSmoothingEnabled=false;
  // ヒント（最初の1枚取った直後だけ少し表示）
  // ロード済み枚数表示（デバッグ兼ね）
  ctx.fillStyle='rgba(255,220,240,.85)'; ctx.font='5px monospace';

}

gameState='title';
buildLevel(); // initial build for title screen background

function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#5c94fc'; ctx.fillRect(0,0,W,H);

  if(gameState==='title')   { drawTitle(); return; }
  if(gameState==='win')     { drawWin(); return; }
  if(gameState==='gameover'){ drawGameOver(); return; }

  if(!unusedPhotoViewing && !paused) update();

  // ── パラックス背景（視差スクロール） ────────────────────
  // 空グラデーション
  {const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#2a80ee'); grd.addColorStop(.6,'#60b0f8'); grd.addColorStop(1,'#a0d8ff');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);}

  // Layer1: 遠い山（視差 0.06）
  {const ox=(-camX*.06)%(W*2);
  ctx.fillStyle='#6a9ad8';
  for(let mx=Math.floor(ox/64)*64-64;mx<W+64;mx+=64){
    ctx.beginPath(); ctx.moveTo(mx,H*.75);
    ctx.lineTo(mx+12,H*.42); ctx.lineTo(mx+24,H*.62); ctx.lineTo(mx+36,H*.36);
    ctx.lineTo(mx+48,H*.54); ctx.lineTo(mx+64,H*.75); ctx.fill();
  }
  // 山の雪冠
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let mx=Math.floor(ox/64)*64-64;mx<W+64;mx+=64){
    ctx.beginPath(); ctx.moveTo(mx+32,H*.42); ctx.lineTo(mx+36,H*.36); ctx.lineTo(mx+40,H*.42); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mx+8,H*.5); ctx.lineTo(mx+12,H*.42); ctx.lineTo(mx+16,H*.5); ctx.fill();
  }}

  // Layer2: 中景の丘（視差 0.18）
  {const ox2=(-camX*.18)%(W*2);
  ctx.fillStyle='#3a9e3a';
  for(let mx=Math.floor(ox2/48)*48-48;mx<W+48;mx+=48){
    ctx.beginPath(); ctx.moveTo(mx,H*.78);
    ctx.quadraticCurveTo(mx+12,H*.60,mx+24,H*.68);
    ctx.quadraticCurveTo(mx+36,H*.58,mx+48,H*.78); ctx.fill();
  }
  // ヤシの木シルエット
  ctx.fillStyle='#2a7e2a';
  for(let mx=Math.floor(ox2/96)*96+20;mx<W+96;mx+=96){
    ctx.fillRect(mx,H*.58,3,20); // 幹
    ctx.beginPath(); ctx.arc(mx+1,H*.58,10,0,Math.PI*2); ctx.fill(); // 葉
    ctx.fillRect(mx-8,H*.56,8,2); ctx.fillRect(mx+4,H*.56,8,2);
  }}

  // Layer3: 雲（視差 0.35 + 自律移動）
  {const cbase=(-camX*.35+tick*.18);
  [[0,22,55,13],[180,40,68,11],[300,18,42,14],[440,35,60,12]].forEach(([bcx,cy,cw,ch])=>{
    const cx=((cbase+bcx)%(W+100)+W+100)%(W+100)-100;
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.fillRect(cx,cy,cw,ch); ctx.fillRect(cx+8,cy-ch*.5,cw-16,ch*.6);
    ctx.fillRect(cx+16,cy-ch,cw-32,ch*.5);
  });}

  // World tiles
  const tx0=Math.max(0,Math.floor(camX/T)-1), tx1=Math.min(LW,tx0+22);
  const ty0=Math.max(0,Math.floor(camY/T)-1), ty1=Math.min(LH,ty0+17);
  for(let ty=ty0;ty<ty1;ty++) for(let tx=tx0;tx<tx1;tx++){
    const id=getTile(tx,ty);
    if(id===AIR) continue;
    const k=`${tx},${ty}`;
    if(brokenQ[k]&&id!==SOLID&&id!==BFLOOR) continue;
    const sx=tx*T-camX+shakeX, sy=ty*T-camY+shakeY;
    if(id===COIN){ if(!coinsDone[k]) drawCoinTile(sx,sy); }
    else drawTile(id,sx,sy,tx,ty);
  }

  drawFlag();
  drawCheckpoint();
  items.forEach(it=>{ if(!it.collected) drawItem(it); });
  enemies.forEach(e=>drawEnemy(e));
  fireballs.forEach(fb=>drawFireball(fb));
  iceballs.forEach(ib=>drawIceball(ib));
  thrownEnemies.forEach(te=>drawThrownEnemy(te));
  movPlats.forEach(mp=>drawMovPlat(mp));
  barrels.forEach(br=>{ if(br.alive) drawBarrel(br); });
  projs.forEach(p=>drawProj(p));
  drawBoss();

  // Particles
  parts.forEach(pt=>{
    ctx.globalAlpha=pt.life/30;
    ctx.fillStyle=pt.col;
    ctx.fillRect(Math.round(pt.x-camX+shakeX-pt.sz/2),Math.round(pt.y-camY+shakeY-pt.sz/2),pt.sz,pt.sz);
    ctx.globalAlpha=1;
  });
  // Float texts
  floatTxts.forEach(ft=>{
    ctx.globalAlpha=ft.life/55;
    ctx.fillStyle=ft.col; ctx.font='bold 7px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ft.txt,Math.round(ft.x-camX+shakeX),Math.round(ft.y-camY+shakeY));
    ctx.globalAlpha=1;
  });


  // パイプ警告「！」表示
  PIPE_DEFS.forEach((pd,i)=>{
    if(pipeWarn[i]>0 && Math.floor(pipeWarn[i]/7)%2===0){
      const sx=Math.round(pd.x-camX+shakeX);
      const sy=Math.round(pd.pipeTopY-camY+shakeY)-14;
      ctx.fillStyle='#ffe000';
      ctx.strokeStyle='#cc0000';
      ctx.lineWidth=1;
      ctx.font='bold 13px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.strokeText('!',sx,sy);
      ctx.fillText('!',sx,sy);
    }
  });

  drawPlayer();
  drawPhotoOverlay();
  drawPhotoCollection();
  if(unusedPhotoViewing) drawPhotoViewerFull();
  drawHUD();
  drawSkyBossProjectiles();
  drawUpgradeHUD();
  if(paused) drawPauseOverlay();
}

    ctx.strokeRect(0,0,W,H);
  }
  // コンボ表示
  if(p.combo>1&&p.comboT>0){
    const calpha=Math.min(1,p.comboT/20);
    ctx.globalAlpha=calpha;
    ctx.font='bold 11px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    const cmul=Math.pow(2,Math.min(p.combo-1,5));
    ctx.fillStyle='#ff9900'; ctx.fillText(`${p.combo}COMBO ×${cmul}`,4,24);
    ctx.globalAlpha=1;
  }
  // 磁石エフェクト（プレイヤー周囲にリング）
  if(p.magnet&&p.magnetT>0){
    const rx=Math.round(p.x+p.w/2-camX+shakeX), ry=Math.round(p.y+p.h/2-camY+shakeY);
    for(let ri=0;ri<3;ri++){
      const ang=tick*.09+ri*(Math.PI*2/3);
      const mr=58+Math.sin(tick*.14+ri)*7;
      ctx.strokeStyle=`rgba(255,200,0,${.35-ri*.1})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(rx,ry,mr,ang,ang+Math.PI*1.3); ctx.stroke();
    }
  }
  // hearts
  ctx.font='bold 12px monospace';
  ctx.textAlign='left';
  ctx.textBaseline='top';
  let hx=7;
  for(let i=0;i<5;i++){
    ctx.fillStyle=i<p.hp?'#ff3158':'rgba(255,255,255,.22)';
    ctx.fillText('♥',hx,7);
    hx+=13;
  }

  // power
  ctx.fillStyle='#fff';
  ctx.font='bold 7px monospace';
  const pow = p.cape ? '🪶 CAPE' : (p.fire ? '🔥 FIRE' : (p.big ? '⬆ BIG' : 'NORMAL'));
  ctx.fillText(pow, 7, 21);

  // time / best
  const nowTime = gameState==='play' ? Date.now()-gameStartTime : (clearTimeMs || bestClearTime);
  ctx.textAlign='right';
  ctx.fillStyle='#ffe66d';
  ctx.fillText('TIME '+fmtTime(nowTime), 164, 7);
  ctx.fillStyle='#9ee7ff';
  ctx.fillText('BEST '+fmtTime(bestClearTime), 164, 21);
  ctx.textAlign='left'; ctx.fillStyle=currentStage===2?'#ffef5a':'#ffffff'; ctx.fillText(currentStage===2?'STAGE 2':'STAGE 1',70,21);
  ctx.restore();

  // boss intro
  if(bossIntroT>0){
    bossIntroT--;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.65)';
    ctx.fillRect(20,78,W-40,44);
    ctx.strokeStyle='#ff4444';
    ctx.strokeRect(20,78,W-40,44);
    ctx.fillStyle='#ffdd55';
    ctx.font='bold 15px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('👑 BIG RED CRAB 👑', W/2, 96);
    ctx.fillStyle='#fff';
    ctx.font='8px monospace';
    ctx.fillText('ラスボス あらわる！', W/2, 112);
    ctx.restore();
  }

  // boss hp bar
  if(boss && boss.active && boss.alive){
    const bw=130, bh=8, bx=(W-bw)/2, by=12;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.65)';
    ctx.fillRect(bx-4,by-10,bw+8,22);
    ctx.fillStyle='#fff';
    ctx.font='bold 7px monospace';
    ctx.textAlign='center';
    ctx.fillText((boss.skyMode?(boss.phase2?'SKY CRAB KING!!':'SKY CRAB KING'):'KING CRAB'), W/2, by-3);
    ctx.fillStyle='#4a0000';
    ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#ff3333';
    ctx.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.maxHp),bh);
    ctx.strokeStyle='#fff';
    ctx.strokeRect(bx,by,bw,bh);
    ctx.restore();
  }

  if(bossDefeatT>0){
    bossDefeatT--;
    ctx.save();
    ctx.fillStyle='rgba(255,220,80,.18)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.fillRect(24,66,W-48,100);
    ctx.strokeStyle='#ffd700';
    ctx.strokeRect(24,66,W-48,100);
    const isBest=lastClearIsBest;
    const rankText=lastClearRankIn ? `RANK IN!  ${lastClearRank}位` : 'RANK OUT';
    ctx.fillStyle=isBest?'#ffef5a':'#ffd700';
    ctx.font='bold 16px monospace';
    ctx.textAlign='center';
    ctx.fillText(isBest?'🏆 NEW RECORD!! 🏆':'🎉 CLEAR! 🎉', W/2, 90);
    ctx.fillStyle='#fff';
    ctx.font='9px monospace';
    ctx.fillText('SCORE '+String(lastClearScore||player.score), W/2, 106);
    ctx.fillText('TIME  '+fmtTime(clearTimeMs), W/2, 119);
    ctx.fillStyle=isBest?'#ffef5a':'#9ee7ff';
    ctx.fillText('BEST  '+fmtTime(bestClearTime), W/2, 132);
    ctx.fillStyle=lastClearRankIn?'#ffdd55':'#cccccc';
    ctx.font='bold 9px monospace';
    ctx.fillText(rankText, W/2, 145);
    ctx.fillStyle='#9ee7ff';
    ctx.font='7px monospace';
    ctx.fillText('更新できたか一目でわかるようにしました', W/2, 157);
    ctx.restore();
  }
}


// ── PAUSE BUTTON ──────────────────────────────────────────────────
// ── PAUSE BUTTON ──────────────────────────────────────────────────
(function(){
  const btn = document.getElementById('pauseBtn');
  function togglePause(e){
    e.preventDefault(); e.stopPropagation();
    initAudio();
    if(gameState !== 'play') return;
    paused = !paused;
    btn.textContent = paused ? '▶' : '⏸';
  }
  btn.addEventListener('touchstart', togglePause, {passive:false});
  btn.addEventListener('click', togglePause);
})();

function drawSkyBossProjectiles(){
  projs.forEach(pr=>{
    const x=Math.floor(pr.x-camX), y=Math.floor(pr.y-camY);
    if(pr.kind==='bubble'){
      ctx.save();
      ctx.strokeStyle='#9ee7ff';
      ctx.fillStyle='rgba(160,230,255,.35)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(x+pr.w/2,y+pr.h/2,pr.w/2,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.fillRect(x+2,y+2,2,2);
      ctx.restore();
    }else if(pr.kind==='shockwave'){
      ctx.save();
      ctx.fillStyle='#ff8844';
      ctx.fillRect(x,y,pr.w,pr.h);
      ctx.fillStyle='#ffdd55';
      ctx.fillRect(x+2,y+2,pr.w-4,2);
      ctx.restore();
    }
  });
}
